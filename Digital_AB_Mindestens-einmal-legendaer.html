<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II.3 Summe von Wahrscheinlichkeiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>/*
 * worksheet.css – gemeinsames visuelles Erscheinungsbild der Arbeitsblätter.
 * Wird identisch verwendet in: Baukasten-Vorschau, exportiertes Arbeitsblatt.
 * Basiert auf dem Hausstil des Wachstum-Prototyps (top.html).
 */
:root {
  --paper: #F4F6F5;
  --paper-raised: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #566072;
  --line: #D7DEDC;
  --accent-primary: #3D5A80;
  --accent-primary-soft: #E7ECF3;
  --accent-linear: #2E7D8C;
  --accent-linear-soft: #DCEEF0;
  --accent-exp: #C85A22;
  --accent-exp-soft: #FBE7DA;
  --success: #2F9E44;
  --success-soft: #E3F6E6;
  --danger: #C1443C;
  --danger-soft: #FBEAE8;
  --shadow: 0 1px 2px rgba(27,36,48,0.07), 0 6px 18px rgba(27,36,48,0.07);
  --table-line: var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181F;
    --paper-raised: #1B232C;
    --ink: #E7ECEF;
    --ink-soft: #A7B2BD;
    --line: #2B3542;
    --accent-primary: #8FADD6;
    --accent-primary-soft: #243347;
    --accent-linear: #6BC4CF;
    --accent-linear-soft: #173236;
    --accent-exp: #F0935B;
    --accent-exp-soft: #3A2718;
    --success: #63CB85;
    --success-soft: #163A22;
    --danger: #E1685C;
    --danger-soft: #3A1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
    --table-line: rgba(255,255,255,0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181F;
  --paper-raised: #1B232C;
  --ink: #E7ECEF;
  --ink-soft: #A7B2BD;
  --line: #2B3542;
  --accent-primary: #8FADD6;
  --accent-primary-soft: #243347;
  --accent-linear: #6BC4CF;
  --accent-linear-soft: #173236;
  --accent-exp: #F0935B;
  --accent-exp-soft: #3A2718;
  --success: #63CB85;
  --success-soft: #163A22;
  --danger: #E1685C;
  --danger-soft: #3A1E1B;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: local;
  color: var(--ink);
  font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
  line-height: 1.55;
}
h1, h2, h3, .display {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  text-wrap: balance;
  margin: 0;
}
.mono, .val, input[type="text"], input[type="number"] {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent-primary); }
button { font-family: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 1.05rem; font-weight: 600; flex: 1 1 auto; min-width: 180px; }
.chapter-eyebrow {
  display: block;
  font-family: "Outfit", sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent-primary);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--paper-raised);
  color: var(--ink);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 8px 12px; min-height: 38px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

main { max-width: 800px; margin: 0 auto; padding: 20px 18px 80px; position: relative; }

/* Seitenumbruch-Indikator (siehe engine.js renderPageBreakOverlays): zeigt
   in der Live-Vorschau, wo der PDF-Export vermutlich eine neue Seite
   beginnen würde – rein informativ, nie Teil des Exports/Drucks. */
.wb-pagebreak-line {
  position: absolute;
  left: -4px; right: -4px; height: 0;
  border-top: 2px dashed #d6336c;
  pointer-events: none;
  z-index: 5;
}
.wb-pagebreak-label {
  position: absolute; top: -9px; right: 2px;
  background: #d6336c; color: #fff;
  font: 600 10px/1.5 var(--font-mono, "JetBrains Mono", monospace);
  padding: 1px 7px; border-radius: 4px 4px 0 0;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
@media print { .wb-pagebreak-line { display: none !important; } }

.header-card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 22px;
}
.header-card h1 { font-size: 1.6rem; }
.header-card .subtitle { color: var(--ink-soft); margin-top: 4px; font-size: 0.95rem; }
.chapter-eyebrow-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.chapter-eyebrow-row .chapter-eyebrow { margin-bottom: 0; }
.chapter-meta {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 0.8rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.phase-heading { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; }
.phase-eyebrow {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
}
.phase-eyebrow .tag {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-primary);
}
.phase-heading h2 { font-size: 1.25rem; }
.card {
  break-inside: avoid;
  page-break-inside: avoid;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }

/* Rasterzeile: bis zu 4 Einheiten (= 25/50/75/100%) nebeneinander. Ein
   Baustein-Baustein ohne eigene Breiten-Einstellung nimmt alle 4 Einheiten
   (= volle Breite) ein und verhält sich optisch wie zuvor. */
.wb-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 16px;
  align-items: start;
  margin-bottom: 14px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.wb-row > .wb-block { min-width: 0; }
/* Sicherheitsnetz nur für echte Schmalformate (Handy hochkant) – bewusst
   niedriger als die ~600–650px, die die Live-Vorschau-Spalte im Editor selbst
   schon einnimmt, sonst würde „nebeneinander“ dort nie sichtbar (und auch der
   PDF-Export aus dem Editor liefe über exakt diese Breite). */
@media (max-width: 480px) {
  .wb-row { grid-template-columns: 1fr; }
  .wb-row > .wb-block { grid-column: span 1 !important; }
}

.merksatz, .merksatz-exp, .merksatz-neutral {
  border-left: 4px solid var(--accent-primary);
  background: var(--accent-primary-soft);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 12px 0;
}
.merksatz-exp { border-left-color: var(--accent-exp); background: var(--accent-exp-soft); }
.merksatz-neutral { border-left-color: var(--ink-soft); background: var(--paper); }
.merksatz .label, .merksatz-exp .label, .merksatz-neutral .label {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-primary);
  margin-bottom: 6px;
}
.merksatz-exp .label { color: var(--accent-exp); }
.merksatz-neutral .label { color: var(--ink-soft); }
.formula {
  font-family: "JetBrains Mono", monospace;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
}
.swatch-linear, .swatch-exp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.swatch-linear::before, .swatch-exp::before {
  content: "";
  width: 12px; height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.swatch-linear::before { background: var(--accent-linear); }
.swatch-exp::before { background: var(--accent-exp); }
.swatch-linear { color: var(--accent-linear); }
.swatch-exp { color: var(--accent-exp); }

.example-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 0.92rem;
  border: 1px solid var(--table-line);
}
.example-table th, .example-table td {
  border: 1px solid var(--table-line);
  padding: 6px 10px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.example-table th { font-weight: 700; }
.example-table thead th { background: var(--accent-primary-soft); }
.example-table tbody th { background: transparent; }
/* Erste Spalte (Zeilen-Beschriftung) automatisch auf ihren Inhalt schrumpfen,
   statt sich unnötig breite Reste der 100%-Tabellenbreite zu nehmen. Die
   übrigen (Daten-)Spalten teilen sich den verbleibenden Platz gleichmäßig. */
.example-table th:first-child,
.example-table td:first-child { width: 1%; white-space: nowrap; }

.graph-block { margin: 14px 0; }
.graph-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.graph-canvas { display: block; width: 100%; height: 300px; touch-action: none; }

.coord-plane-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.coord-plane-canvas { display: block; width: 100%; height: 320px; }
.coord-plane-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 10px;
  font-size: 0.85rem;
}
.coord-plane-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.coord-plane-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.coord-plane-legend-item.coord-plane-error { color: var(--danger); }

.diagram-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.diagram-canvas { display: block; width: 100%; height: 300px; }

.wb-image-empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink-soft);
  font-size: 0.85rem;
  background: var(--paper-raised);
}
.wb-image { margin: 14px 0; max-width: 100%; }
.wb-image img { display: block; width: 100%; height: auto; border-radius: 10px; }
.wb-image.align-center { margin-left: auto; margin-right: auto; }
.wb-image.align-left { margin-left: 0; margin-right: auto; }
.wb-image.align-right { margin-left: auto; margin-right: 0; }
.wb-image figcaption {
  margin-top: 6px;
  font-size: 0.82rem;
  color: var(--ink-soft);
  text-align: center;
  font-style: italic;
}
@media print { .wb-image { break-inside: avoid; } }
.slider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px 22px;
  margin-top: 14px;
}
.slider-field label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.slider-field .val { font-weight: 700; }
.slider-field.linear .val { color: var(--accent-linear); }
.slider-field.exp .val { color: var(--accent-exp); }
input[type="range"] {
  width: 100%;
  height: 36px;
  accent-color: var(--accent-primary);
  touch-action: manipulation;
}
.slider-field.linear input[type="range"] { accent-color: var(--accent-linear); }
.slider-field.exp input[type="range"] { accent-color: var(--accent-exp); }

.task-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.task-num {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: "Outfit", sans-serif;
}
.task-num.knobel { background: var(--accent-exp-soft); color: var(--accent-exp); }
.task-prompt { flex: 1 1 auto; font-weight: 600; }
.task-prompt p { margin: 0; }
.difficulty-stars {
  font-size: 0.95rem;
  white-space: nowrap;
  letter-spacing: 1px;
  flex: none;
}
.difficulty-stars .filled { color: var(--accent-exp); }
.difficulty-stars .empty { color: var(--line); }

/* --- Sortier-Aufgabe (Drag & Drop, siehe engine.js wireSortList) --- */
.sort-list { margin: 10px 0; }
.sort-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--paper-raised);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  min-height: 44px;
  transition: box-shadow 0.15s ease, opacity 0.15s ease;
}
.sort-item.dragging { opacity: 0.4; }
.sort-item.drag-over-top { box-shadow: 0 -3px 0 var(--accent-primary); }
.sort-item.drag-over-bottom { box-shadow: 0 3px 0 var(--accent-primary); }
.sort-handle {
  flex: none;
  cursor: grab;
  color: var(--ink-soft);
  font-size: 1.15rem;
  touch-action: none;
  line-height: 1;
  padding: 4px 2px;
}
.sort-handle:active { cursor: grabbing; }
.sort-text { flex: 1 1 auto; }

.answer-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}
/* Die Aufgaben-Vorlage bekommt einen eigenen Block-Container, damit Text und
   Eingabefelder normal fließen (mit <br> auch mehrzeilig). Läge sie direkt im
   Flex-Container, würde jeder Textschnipsel ein eigenes Flex-Element. */
.answer-template {
  flex: 1 1 100%;
  line-height: 2.6;
}
/* Auftragstext ohne Eingabefelder: normaler Leseabstand. */
.answer-template.answer-text { line-height: 1.6; }
.answer-template.answer-text p { margin: 0 0 8px; }
.fu-label { font-size: 0.85rem; color: var(--ink-soft); margin-right: 4px; }
input[type="text"], input[type="number"] {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  width: 100px;
  background: var(--paper);
  color: var(--ink);
}
input.field-input { width: auto; }
input:focus { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
select.choice {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  background: var(--paper);
  color: var(--ink);
}

.feedback {
  display: none;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 6px;
}
.feedback.show { display: inline-flex; }
.feedback.ok { background: var(--success-soft); color: var(--success); }
.feedback.bad { background: var(--danger-soft); color: var(--danger); }

.hint-area {
  display: none;
  margin-top: 8px;
  font-size: 0.87rem;
  color: var(--ink-soft);
  border-left: 3px solid var(--accent-exp);
  padding-left: 10px;
}
.hint-area.show { display: block; }
.hint-area p { margin: 4px 0; }

.solution-area {
  display: none;
  margin-top: 10px;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
}
.solution-area.show { display: block; }

.drawpad-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  margin-top: 10px;
}
.drawpad-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.color-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}
.color-dot.active { border-color: var(--ink); }
/* Karo und Schreibfläche liegen bewusst in zwei Schichten übereinander:
   Das Karo wird einmal gemalt und bleibt dann liegen, die durchsichtige
   Fläche darüber bekommt jede Strichbewegung ab. Lägen beide zusammen,
   müsste Safari bei jedem Strichstück auch den Verlauf neu rechnen. */
.drawpad-paper {
  position: relative;
  border-radius: 8px;
}
.drawpad-karo {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  border: 1px solid var(--line);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px;
  pointer-events: none;
}
canvas.drawpad-canvas {
  width: 100%; height: 220px;
  display: block;
  position: relative;
  background: transparent;
  border-radius: 8px;
  border: 1px solid transparent;
  touch-action: none;
  transform: translateZ(0);
}

.scratch-fab {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 30;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent-primary);
  color: #fff;
  border: none;
  box-shadow: var(--shadow);
  font-size: 1.4rem;
  cursor: pointer;
}
.scratch-panel {
  position: fixed;
  right: 18px; bottom: 84px;
  z-index: 30;
  width: min(420px, calc(100vw - 36px));
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 12px;
  display: none;
}
.scratch-panel.show { display: block; }
.scratch-panel h3 { font-size: 0.95rem; margin-bottom: 6px; }

footer.appfoot {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px 40px;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.no-print { }
body.exporting .no-print { visibility: hidden; }
body.exporting { background-image: none; }
body.exporting .feedback { display: none !important; }
/* Tipps werden im PDF ausgeblendet – AUSSER auf dem Lösungsblatt, dort
   gehören sie zur Lehrerfassung dazu. */
body.exporting:not(.wb-solution) .hint-area { display: none !important; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 0.88rem;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Lösungsblatt (Lehrerfassung) ---------- */
.header-card.is-solution { border-color: var(--accent-exp); }
.solution-badge {
  display: inline-block;
  margin: 8px 0 2px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--accent-exp);
  color: #fff;
  font-family: "Outfit", sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.01em;
}
.field-solution {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--accent-exp-soft);
  border-bottom: 2px solid var(--accent-exp);
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  margin-right: 2px;
}
.hint-area.open,
.solution-area.open { display: block; }
.solution-hints { margin: 4px 0 0; padding-left: 20px; }
.solution-hints li { margin: 2px 0; }
.sort-item.solved { cursor: default; }
.sort-rank {
  flex: none;
  min-width: 1.8em;
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  color: var(--accent-primary);
}

/* ---------- Seitenumbruch-Baustein ---------- */
/* Nur ein Hinweis im Baukasten/in der Vorschau – beim PDF-Export wird die
   Zeile gar nicht erst gerastert (collectPrintItems in engine.js). */
.wb-forced-break {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0;
  color: var(--ink-soft);
  font-family: "Outfit", sans-serif;
  font-size: 0.78rem;
  white-space: nowrap;
}
.wb-forced-break::before,
.wb-forced-break::after {
  content: "";
  flex: 1 1 auto;
  border-top: 2px dashed var(--line);
}
/* Im Schülerblatt bleibt die Zeile als Marke für die Seitenaufteilung stehen,
   ist aber leer – dann darf sie auch keinen Abstand erzeugen. */
.wb-row.wb-break-only { margin: 0; gap: 0; }

/* ---------- Rechenweg: Schreibfläche unter der Aufgabe ----------
   Soll nie vom Seitenumbruch zerschnitten werden – halbe Rechnungen auf zwei
   Seiten sind beim Korrigieren wertlos. */
.calc-area {
  margin-top: 14px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.calc-label {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.calc-area .drawpad-wrap { margin-top: 0; }

/* ---------- Schreiben statt markieren ----------
   Beim Schreiben hat der Browser oft eine Textauswahl gestartet: die halbe
   Aufgabe war blau hinterlegt statt beschrieben.

   Es reicht nicht, das Markieren nur auf der Schreibfläche abzuschalten: Ein
   Strich beginnt leicht einen Millimeter daneben, und von dort zieht Safari
   die Markierung über die ganze Aufgabe. Deshalb ist das Blatt insgesamt
   nicht markierbar – ausgenommen die Eingabefelder, in denen man Text
   auswählen und korrigieren können muss. */
#wbWorksheet,
#wbWorksheet *,
.calc-overlay,
.calc-overlay * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#wbWorksheet input,
#wbWorksheet textarea,
#wbWorksheet select,
.calc-overlay input,
.calc-overlay textarea,
.calc-overlay select {
  -webkit-user-select: text;
  user-select: text;
}
canvas.drawpad-canvas { cursor: crosshair; }
canvas.drawpad-canvas.is-erasing { cursor: cell; }

/* Die Geste auf der Schreibfläche gehört immer uns – niemals dem Browser.
   Gäbe man sie mit touch-action: auto zurück, blättert der Apple Pencil in
   Safari die Seite, statt zu schreiben (siehe Kommentar in engine.js).
   Das Blättern mit dem Finger führt die Engine selbst aus. */
canvas.drawpad-canvas { touch-action: none !important; }

/* Hauptweg zum Schreiben – deutlich sichtbar, nicht als Zusatzknopf. */
.drawpad-toolbar .tool-fullscreen {
  background: var(--accent-primary-soft);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  font-weight: 700;
}

/* ---------- Vollbild-Schreibmodus ---------- */
.calc-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  gap: 8px;
}
.calc-overlay-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
}
.calc-overlay-title {
  flex: 1 1 auto;
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-weight: 600;
  font-size: 1rem;
}
.calc-overlay .drawpad-wrap {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 0;
}
/* Im Vollbild wächst die Fläche auf die Resthöhe. Weil das Karo jetzt in
   einer eigenen Schicht darunter liegt, muss diese Schicht mitwachsen. */
.calc-overlay .drawpad-paper {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.calc-overlay .drawpad-canvas {
  flex: 1 1 auto;
  height: auto !important;
  min-height: 0;
}

/* Messanzeige für ?diag=1 */
.wb-diag {
  position: fixed;
  left: 8px; bottom: 8px;
  z-index: 60;
  background: rgba(20, 20, 24, 0.86);
  color: #fff;
  font-size: 0.72rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 6px 10px;
  border-radius: 8px;
  pointer-events: none;
}
/* Seite dahinter stillstellen, damit beim Schreiben nichts verrutscht. */
body.wb-vollbild { overflow: hidden; }
@media print { .calc-overlay { display: none !important; } }

/* Radierer: aktiv sichtbar markiert, sonst rät man, welches Werkzeug greift. */
.drawpad-toolbar .tool-active {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #fff;
}

/* ---------- Rückmeldung pro Lücke ----------
   Nach „Prüfen" ist an jedem Feld einzeln sichtbar, ob es stimmt – bei
   Aufgaben mit mehreren Lücken war vorher nur eine Gesamtmeldung zu sehen. */
.field-input.field-ok,
select.choice.field-ok {
  border-color: var(--success);
  background: var(--success-soft);
}
.field-input.field-bad,
select.choice.field-bad {
  border-color: var(--danger);
  background: var(--danger-soft);
}

/* ---------- Sortier-Aufgabe: Touch-Bedienung ---------- */
.sort-item {
  transition: box-shadow 0.15s ease, opacity 0.15s ease, background 0.4s ease;
}
.sort-item.dragging {
  opacity: 0.9;
  position: relative;
  z-index: 20;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  border-color: var(--accent-primary);
}
.sort-item.just-moved { background: var(--accent-primary-soft); }
/* Vollwertiges Touch-Ziel: vorher war der Griff nur gut 20 px groß. */
.sort-handle {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  border-radius: 8px;
  user-select: none;
}
.sort-handle:hover { background: var(--accent-primary-soft); }
.sort-moves {
  flex: none;
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
}
.sort-move {
  appearance: none;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 7px;
  width: 44px;
  height: 30px;
  font-size: 0.72rem;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.sort-move:hover:not(:disabled) {
  border-color: var(--accent-primary);
  background: var(--accent-primary-soft);
}
.sort-move:disabled { opacity: 0.3; cursor: default; }

/* ---------- Nebenrechnungen: größerer, umschaltbarer Block ---------- */
.scratch-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.scratch-head h3 { margin: 0; }
.scratch-spacer { flex: 1 1 auto; }
.scratch-panel .drawpad-canvas { height: 300px; }
.scratch-panel.big {
  width: min(1000px, calc(100vw - 24px));
  right: 12px;
  bottom: 12px;
}
.scratch-panel.big .drawpad-canvas { height: min(62vh, 620px); }

/* ---------- Hinweis nach dem Wiederherstellen von Eingaben ---------- */
.restore-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.88rem;
}
.restore-bar span { flex: 1 1 auto; }
.linklike {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent-primary);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Funktionen-Regler ---------- */
.funcplot-term {
  font-size: 1.15rem;
  font-weight: 600;
  background: var(--accent-exp-soft);
  color: var(--accent-exp);
  display: inline-block;
  padding: 5px 14px;
  border-radius: 9px;
  margin: 0 0 10px;
}

/* ---------- Freischaltung von Aufgaben ----------
   Ein gesperrter Baustein bleibt im Fluss stehen: Statt des Inhalts steht ein
   Platzhalter da, der sagt, woran es hängt. Im PDF-Export und auf dem
   Lösungsblatt ist dagegen IMMER alles sichtbar – ein Ausdruck mit fehlenden
   Aufgaben wäre wertlos. */
.wb-block.is-locked > .wb-locked-content { display: none; }
.wb-block.is-locked {
  border-style: dashed;
  box-shadow: none;
  background: transparent;
}
.wb-lock-note {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 2px;
  color: var(--ink-soft);
  font-size: 0.92rem;
}
.wb-lock-icon { font-size: 1.3rem; flex: none; }
.wb-block.just-unlocked {
  animation: wb-aufgeht 0.5s ease-out;
}
@keyframes wb-aufgeht {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
/* Hinweis in der Lehrerfassung und in der Baukasten-Vorschau */
.wb-lock-badge {
  display: inline-block;
  margin-bottom: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-size: 0.78rem;
  font-weight: 600;
}
/* Beim Export alles zeigen – auch das, was gerade noch gesperrt ist. */
body.exporting .wb-block.is-locked > .wb-locked-content { display: block; }
body.exporting .wb-block.is-locked > .wb-lock-note { display: none; }
body.exporting .wb-block.is-locked { border-style: solid; background: var(--paper-raised); }
@media print {
  .wb-block.is-locked > .wb-locked-content { display: block; }
  .wb-block.is-locked > .wb-lock-note { display: none; }
}

/* Aufgabenstellung im Vollbild-Schreibmodus */
.calc-overlay-task {
  flex: 0 1 auto;
  max-height: 26vh;
  overflow-y: auto;
  padding: 10px 14px;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.94rem;
  line-height: 1.5;
}
.calc-overlay-task.is-collapsed { display: none; }
.calc-overlay-task .calc-overlay-prompt {
  margin: 0 0 6px;
  font-weight: 600;
}
.calc-overlay-task p { margin: 0 0 6px; }
.calc-overlay-task p:last-child { margin-bottom: 0; }
.calc-overlay-task .answer-template { line-height: 1.5; }


/* ---------- Term-Lücken ----------
   Hier wird kein Zahlenwert erwartet, sondern ein Rechenausdruck. Feste
   Zeichenbreite macht Klammern und Exponenten übersichtlich, und das Feld
   bekommt etwas mehr Luft als eine Zahlenlücke. */
input.field-input.field-term {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.95rem;
  letter-spacing: 0.01em;
}
input.field-input.field-term::placeholder {
  font-family: inherit;
  opacity: 0.45;
}

<style>body:not(.exporting) .answer-template{min-width:0}body:not(.exporting) select{max-width:100%;text-overflow:ellipsis}figure.wb-image{display:flex;flex-direction:column}figure.wb-image figcaption{order:-1;margin:0 0 8px;font-weight:700;font-size:1rem;color:var(--ink);text-align:left}</style></head>
<body>
<div id="wbRoot"></div>
<script>/*
 * Baukasten – gemeinsame Laufzeit-Engine
 * Wird sowohl im Baukasten (Live-Vorschau) als auch im exportierten,
 * eigenständigen Arbeitsblatt verwendet. Rein datengetrieben: kennt keine
 * konkreten Aufgaben, nur die Baustein-Konfiguration aus dem Projekt-JSON.
 */
(function (global) {
  "use strict";

  /* ---------- kleine Helfer ---------- */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#000000";
  }
  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      var args = arguments, ctx = this;
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }
  function parseNum(raw) {
    if (raw === null || raw === undefined) return NaN;
    var s = String(raw).trim().toLowerCase();
    if (s === "") return NaN;
    s = s.replace(/€/g, "").replace(/\beuro\b/g, "");
    s = s.replace(/\btagen\b/g, "").replace(/\btage\b/g, "").replace(/\btag\b/g, "");
    s = s.replace(/%/g, "").replace(/\s+/g, "");
    if (s.indexOf(",") !== -1 && s.indexOf(".") !== -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (s.indexOf(",") !== -1) {
      s = s.replace(",", ".");
    }
    // Einheit am Ende tolerieren: am Feld steht die richtige Einheit ohnehin
    // daneben, Schüler tippen sie aber oft trotzdem mit ("2,5 m", "18 cm²").
    s = s.replace(/[a-zäöüß²³]+$/, "");
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function numEq(a, b, eps) {
    eps = eps === undefined ? 1e-6 : eps;
    return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < eps;
  }
  function formatEuro(v) { return Math.round(v).toLocaleString("de-DE"); }
  function formatDE(num, decimals) { return num.toFixed(decimals).replace(".", ","); }
  // Deterministisch "zufällige" Reihenfolge aus einer Text-Seed (z. B. der
  // Baustein-id) – dieselbe Sortier-Aufgabe zeigt bei jedem Neu-Rendern
  // (Vorschau-Refresh, PDF-Export) dieselbe Ausgangsreihenfolge, verschiedene
  // Bausteine bekommen unterschiedliche Mischungen.
  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
    return h;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seedStr) {
    var rnd = mulberry32(hashStr(String(seedStr)));
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    // Falls die Mischung zufällig die Originalreihenfolge trifft (bei wenigen
    // Elementen nicht unwahrscheinlich): einmal fest vertauschen, damit die
    // Aufgabe nicht bereits gelöst startet.
    if (a.length > 1 && a.every(function (x, i2) { return x === arr[i2]; })) {
      var t2 = a[0]; a[0] = a[a.length - 1]; a[a.length - 1] = t2;
    }
    return a;
  }
  function niceCeil(v) {
    if (v <= 0) return 1;
    var exp = Math.floor(Math.log10(v));
    var base = Math.pow(10, exp);
    var n = v / base, niceN;
    if (n <= 1) niceN = 1; else if (n <= 2) niceN = 2; else if (n <= 5) niceN = 5; else niceN = 10;
    return niceN * base;
  }
  function showToast(msg) {
    var t = el("wbToast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  var redrawCallbacks = [];

  /* ---------- Zeichenfläche ---------- */

  /* Stift oder Finger?
   *
   * Beim Schreiben mit dem Finger liegt oft der Handballen auf und es entstehen
   * Striche, die keiner wollte. Ein harter „nur Stift"-Zwang wäre aber falsch:
   * wer kein Pencil dabei hat, könnte dann gar nichts mehr aufschreiben.
   * Deshalb entscheidet das Blatt selbst: Sobald auf der Seite EINMAL mit einem
   * Stift geschrieben wurde, gilt für alle Flächen Stift-Betrieb – der Finger
   * zeichnet dann nicht mehr, sondern blättert.
   * stiftModus: "auto" (Voreinstellung) | "stift" (erzwungen) | "alle".
   *
   * WICHTIG – hier steckte ein Fehler, der das Schreiben auf dem iPad praktisch
   * unmöglich gemacht hat: Früher wurde für den Finger-Betrieb `touch-action`
   * der Fläche auf "auto" zurückgestellt. Damit darf Safari die Geste aber
   * selbst auswerten – und auf dem iPad blättert der Apple Pencil in Seiten,
   * sobald er das darf. Ergebnis: Der erste Strich kam noch an, danach schob
   * jeder weitere Strich das Arbeitsblatt weg.
   *
   * Deshalb gilt jetzt: `touch-action: none` bleibt dauerhaft auf der Fläche
   * (siehe worksheet.css), die Geste gehört immer uns. Der Handballenschutz
   * passiert ausschließlich in JavaScript, und das Blättern mit dem Finger
   * führen wir selbst aus (siehe Fingerschub in createDrawPad).
   */
  var stiftModus = "auto";
  var stiftGesehen = false;
  var stiftHinweisGezeigt = false;

  function nurStift() {
    if (stiftModus === "stift") return true;
    if (stiftModus === "alle") return false;
    return stiftGesehen;
  }

  function setStiftModus(modus) {
    stiftModus = (modus === "stift" || modus === "alle") ? modus : "auto";
  }

  function merkeStift() {
    stiftGesehen = true;
    kritzelHinweis();
  }

  /* Hinweis auf „Kritzeln".
   *
   * Auf dem iPad ist die Funktion „Kritzeln" (Handschrift wird in Text
   * umgewandelt) ab Werk eingeschaltet. Ihr Gestenerkenner greift sich auf
   * Webseiten einen Teil der Stiftkontakte, BEVOR der Browser sie ausliefert –
   * gemessen wurde ein Verlust von rund 40 % beim zügigen Schreiben. Das Blatt
   * bekommt von diesen Strichen nichts mit und kann sie auch nicht nachholen;
   * abschalten lässt sich die Funktion nur am Gerät.
   *
   * Deshalb beim ersten Stiftkontakt ein einmaliger Hinweis pro Gerät – kurz,
   * und nur dort, wo er zutrifft.
   */
  var kritzelGeprueft = false;
  var KRITZEL_SCHLUESSEL = "baukasten:kritzeln-hinweis";
  function kritzelHinweis() {
    if (kritzelGeprueft) return;
    kritzelGeprueft = true;
    // Nur auf iPadOS: dort meldet sich Safari als „Macintosh", hat aber
    // Berührungseingabe. Ein echter Mac hat keine.
    if (!("ontouchstart" in window) || navigator.maxTouchPoints < 1) return;
    if (!/iPad|Macintosh/.test(navigator.userAgent || "")) return;
    try {
      if (localStorage.getItem(KRITZEL_SCHLUESSEL)) return;
      localStorage.setItem(KRITZEL_SCHLUESSEL, "1");
    } catch (e) { /* ohne Speicher: Hinweis einmal pro Sitzung */ }
    setTimeout(function () {
      showToast("Falls beim Schreiben Striche fehlen: Einstellungen → Apple Pencil → "
        + "„Kritzeln“ ausschalten.", 9000);
    }, 1200);
  }

  var now = (window.performance && performance.now)
    ? function () { return performance.now(); }
    : function () { return Date.now(); };

  /* Safari auf dem iPad fängt mit dem Stift gern eine Textmarkierung an,
   * sobald ein Strich auch nur knapp neben der Fläche beginnt. Sichtbar wird
   * das als blau hinterlegter Text, der beim Weiterschreiben mitwandert.
   * Zwei Maßnahmen greifen ineinander: das Blatt ist in worksheet.css
   * insgesamt nicht markierbar (Eingabefelder ausgenommen), und eine schon
   * begonnene Markierung wird beim Aufsetzen weggeräumt. */
  function loescheMarkierung() {
    try {
      var sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed) sel.removeAllRanges();
    } catch (e) {}
  }
  document.addEventListener("selectstart", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest("input, textarea, select, [contenteditable]")) return;
    // Nur im Blatt selbst – im Baukasten muss die Lehrkraft Text auswählen
    // und kopieren können.
    if (!t.closest("#wbWorksheet, .calc-overlay")) return;
    e.preventDefault();
  }, true);

  /* Messhilfe: Das Blatt mit ?diag=1 öffnen, dann zeigt eine kleine Anzeige,
   * wie viele Ereignisse ankommen, wie viele Zwischenpunkte dabei sind und wo
   * die längste Lücke liegt. Damit lässt sich die Schreibleistung auf dem
   * echten Gerät messen, statt sie zu schätzen. */
  var diagAn = false, diagBox = null, diag = null;
  function diagStart() {
    diagAn = true;
    diag = { striche: 0, ereignisse: 0, punkte: 0, luecke: 0, handler: 0, letzter: 0 };
    diagBox = document.createElement("div");
    diagBox.className = "wb-diag no-print";
    document.body.appendChild(diagBox);
    setInterval(diagZeigen, 500);
  }
  function diagZeigen() {
    if (!diagBox) return;
    diagBox.textContent =
      "Striche " + diag.striche + " · Ereignisse " + diag.ereignisse +
      " · Punkte " + diag.punkte +
      " · größte Lücke " + Math.round(diag.luecke) + " ms" +
      " · längste Rechenzeit " + (Math.round(diag.handler * 10) / 10) + " ms";
  }
  function diagZaehl(art, punkte, dauer) {
    if (!diagAn) return;
    var t = now();
    if (art === "down") { diag.striche++; diag.letzter = t; }
    else if (art === "move") {
      diag.ereignisse++;
      diag.punkte += (punkte || 1);
      if (diag.letzter) diag.luecke = Math.max(diag.luecke, t - diag.letzter);
      diag.letzter = t;
      if (dauer > diag.handler) diag.handler = dauer;
    } else if (art === "up") { diag.letzter = 0; }
  }

  /* Striche werden NICHT in Bildschirmpunkten gespeichert, sondern in einem
   * festen Rechenblatt-Maß: 1000 Einheiten entsprechen der Breite der Fläche.
   * Dadurch bleibt Geschriebenes unverändert, wenn dieselbe Fläche größer
   * dargestellt wird – genau das braucht der Vollbild-Schreibmodus. */
  var LOGISCHE_BREITE = 1000;

  function createDrawPad(canvas) {
    var ctx = canvas.getContext("2d");
    var drawing = false, current = null, strokes = [];
    var color = getCssVar("--ink");
    var lineWidth = 2.5 * 2;          // in logischen Einheiten (~2,5 px bei 500 px Breite)
    var radiert = false;
    var RADIER_BREITE = 24 * 2;

    function massstab() {
      var rect = canvas.getBoundingClientRect();
      return rect.width > 0 ? rect.width / LOGISCHE_BREITE : 1;
    }

    function resize() {
      var rect = canvas.getBoundingClientRect();
      if (rect.width < 1) return;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      var s = dpr * (rect.width / LOGISCHE_BREITE);
      ctx.setTransform(s, 0, 0, s, 0, 0);
      rahmen = null;                // beim nächsten Aufsetzen neu messen
      redraw();
    }
    function redraw() {
      var rect = canvas.getBoundingClientRect();
      var m = massstab();
      ctx.clearRect(0, 0, rect.width / m, rect.height / m);
      for (var i = 0; i < strokes.length; i++) drawStroke(strokes[i]);
    }

    function stilSetzen(s) {
      // Radierte Striche nehmen weg statt hinzuzufügen. Weil die Fläche
      // durchsichtig ist, kommt darunter wieder das Karo zum Vorschein.
      ctx.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
      ctx.strokeStyle = s.erase ? "rgba(0,0,0,1)" : s.color;
      ctx.lineWidth = s.width;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
    }

    function drawStroke(s) {
      if (s.points.length < 1) return;
      stilSetzen(s);
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      if (s.points.length === 1) ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1);
      for (var i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }

    /* Nur das NEUE Stück des laufenden Strichs zeichnen.
     *
     * Vorher wurde bei jeder Zeigerbewegung die gesamte Fläche neu gezeichnet.
     * Mit jedem weiteren Strich dauerte das länger; ab einer gewissen Menge
     * schaffte der Browser die Bildrate nicht mehr und verwarf Ereignisse –
     * beim schnellen Schreiben fehlten dann Buchstaben. Ein angehängtes
     * Segment kostet dagegen immer gleich wenig, egal wie voll das Blatt ist. */
    function drawSegment(s, abIndex) {
      if (s.points.length < 2) { drawStroke(s); return; }
      stilSetzen(s);
      ctx.beginPath();
      ctx.moveTo(s.points[abIndex - 1].x, s.points[abIndex - 1].y);
      for (var i = abIndex; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }

    // Das Rechteck der Fläche wird beim Aufsetzen EINMAL gemessen und dann
    // festgehalten: getBoundingClientRect() pro Punkt würde den Browser bei
    // jedem Messpunkt zum Neuberechnen des Layouts zwingen.
    var rahmen = null, rahmenM = 1;
    function rahmenMessen() {
      rahmen = canvas.getBoundingClientRect();
      rahmenM = rahmen.width > 0 ? rahmen.width / LOGISCHE_BREITE : 1;
    }
    function posFromEvent(e) {
      if (!rahmen) rahmenMessen();
      return { x: (e.clientX - rahmen.left) / rahmenM, y: (e.clientY - rahmen.top) / rahmenM };
    }

    /* Zwischenpunkte abholen.
     *
     * Ein Apple Pencil tastet deutlich häufiger ab, als der Browser
     * pointermove-Ereignisse ausliefert. Die dazwischen liegenden Messpunkte
     * stehen in getCoalescedEvents() – ohne sie werden schnelle Striche zu
     * geraden Linien zwischen weit auseinanderliegenden Punkten, Rundungen
     * und kleine Buchstaben gehen dabei verloren. */
    function messpunkte(e) {
      if (typeof e.getCoalescedEvents === "function") {
        try {
          var liste = e.getCoalescedEvents();
          if (liste && liste.length) return liste;
        } catch (err) { /* ältere Browser: unten weiter */ }
      }
      return [e];
    }

    // Fingerschub: Im Stift-Betrieb zeichnet der Finger nicht, soll aber auch
    // nicht wirkungslos sein. Weil touch-action dauerhaft "none" ist, blättert
    // Safari nicht von selbst – also schieben wir die Seite hier mit.
    var schubId = null, schubX = 0, schubY = 0;

    /* Ein laufender Strich wird über die Zeiger-Kennung verfolgt, NICHT über
     * ein einfaches drawing-Flag.
     *
     * Hier steckte der Fehler, der beim schnellen Schreiben Buchstaben
     * verschluckt hat: Safari meldet nach setPointerCapture gelegentlich sofort
     * "lostpointercapture" – vor allem, wenn Striche dicht aufeinanderfolgen.
     * Der Strich wurde dann mitten im Buchstaben abgebrochen, obwohl der Stift
     * noch auf der Fläche lag. Jetzt wird das Einfangen nur noch als Zugabe
     * benutzt; verfolgt wird der Strich über pointermove/pointerup am Fenster.
     * Dadurch ist es auch egal, ob der Browser die Ereignisse an die Fläche
     * oder an ein darüberliegendes Element ausliefert. */
    var aktivId = null;
    var letzteBewegung = -1;   // Zeitstempel der zuletzt verarbeiteten Bewegung
    var letzterStift = 0;          // Zeitpunkt des letzten Stift-Ereignisses
    var HANDBALLEN_MS = 900;

    function fensterAn() {
      window.addEventListener("pointermove", onMove, { passive: false });
      window.addEventListener("pointerup", onUp, true);
      window.addEventListener("pointercancel", onUp, true);
    }
    function fensterAus() {
      window.removeEventListener("pointermove", onMove, { passive: false });
      window.removeEventListener("pointerup", onUp, true);
      window.removeEventListener("pointercancel", onUp, true);
    }

    function onDown(e) {
      if (e.pointerType === "pen") { merkeStift(); letzterStift = now(); }
      if (e.pointerType !== "pen" && nurStift()) {
        // Handballenschutz: Während ein Stiftstrich läuft – und kurz danach –
        // ist jede Berührung der aufliegende Handballen, kein Blättern.
        if (aktivId !== null || now() - letzterStift < HANDBALLEN_MS) {
          e.preventDefault();
          return;
        }
        if (schubId !== null) { e.preventDefault(); return; }
        schubId = e.pointerId;
        schubX = e.clientX;
        schubY = e.clientY;
        fensterAn();
        if (!stiftHinweisGezeigt) {
          stiftHinweisGezeigt = true;
          showToast("Zum Schreiben den Stift benutzen – mit dem Finger blätterst du.");
        }
        e.preventDefault();
        return;
      }
      // Läuft noch ein Strich, wird er hier sauber beendet, statt den neuen zu
      // verwerfen: Fehlt einmal ein pointerup, ginge sonst alles Folgende
      // verloren.
      if (aktivId !== null) strichBeenden(null);
      // Eine angefangene Textmarkierung würde beim nächsten Strich wieder
      // aufblitzen – deshalb hier wegräumen.
      loescheMarkierung();
      /* Der Zeiger wird NICHT mehr eingefangen.
       *
       * setPointerCapture war ursprünglich dafür da, dass ein Strich über den
       * Rand der Fläche hinaus weitergeht. Das erledigen inzwischen die
       * Listener am Fenster – und für Berührungen (und damit auch für den
       * Stift auf dem iPad) fängt der Browser den Zeiger ohnehin von selbst
       * ein. Das ausdrückliche Einfangen bringt also nichts, kostet aber:
       * Safari liefert ab da jede Bewegung doppelt aus, und beim schnellen
       * Aufeinanderfolgen von Strichen – beim Schreiben eines Bruchs etwa –
       * verschluckt es ganze Zeigerfolgen. Dann fehlt ein Buchstabe oder ein
       * Querstrich vollständig.
       */
      aktivId = e.pointerId;
      letzteBewegung = -1;
      drawing = true;
      rahmenMessen();
      current = {
        color: color,
        width: radiert ? RADIER_BREITE : lineWidth,
        erase: radiert,
        points: []
      };
      punktAnhaengen(current, e);
      strokes.push(current);
      drawStroke(current);          // der aufgesetzte Punkt
      fensterAn();
      wachhundStellen();
      diagZaehl("down");
      e.preventDefault();
    }

    function onMove(e) {
      if (schubId !== null && e.pointerId === schubId) {
        // Im Vollbild-Schreibmodus gibt es nichts zu blättern.
        if (!document.body.classList.contains("wb-vollbild")) {
          window.scrollBy(schubX - e.clientX, schubY - e.clientY);
        }
        schubX = e.clientX;
        schubY = e.clientY;
        e.preventDefault();
        return;
      }
      if (aktivId === null || e.pointerId !== aktivId) return;
      // Safari auf dem iPad meldet jede Zeigerbewegung doppelt, sobald der
      // Zeiger eingefangen ist: einmal an die Fläche, einmal an das Element
      // darunter. Beide Meldungen tragen denselben Zeitstempel. Die zweite
      // kostet nur Rechenzeit – jeder Messpunkt darin ist schon verarbeitet.
      if (e.timeStamp === letzteBewegung) return;
      letzteBewegung = e.timeStamp;
      if (e.pointerType === "pen") letzterStift = now();
      // Schwebt der Stift über der Fläche, statt sie zu berühren, ist der
      // Strich zu Ende – auch wenn kein pointerup kam.
      // (Ohne den Punkt zu übernehmen: Der Stift schwebt dann schon woanders.)
      if (e.buttons === 0) { strichBeenden(null); return; }
      var t0 = now();
      var zahl = punkteUebernehmen(e);
      wachhundStellen();
      diagZaehl("move", zahl, now() - t0);
      e.preventDefault();
    }

    /* Alle Messpunkte eines Ereignisses übernehmen und das neue Stück zeichnen.
     * Gibt zurück, wie viele Punkte das Ereignis mitgebracht hat. */
    function punkteUebernehmen(e) {
      var ab = current.points.length;
      var punkte = messpunkte(e);
      for (var i = 0; i < punkte.length; i++) punktAnhaengen(current, punkte[i]);
      if (current.points.length > ab) drawSegment(current, ab);
      return punkte.length;
    }

    /* Messpunkte werden gerundet und ausgedünnt gespeichert.
     * Beides zusammen macht den gespeicherten Zustand um ein Mehrfaches
     * kleiner – und damit das Zwischenspeichern (JSON + localStorage), das
     * auf dem iPad den Hauptfaden blockiert, entsprechend kürzer. */
    var MIN_ABSTAND2 = 1.2 * 1.2;   // in logischen Einheiten, quadriert
    function punktAnhaengen(s, e) {
      var p = posFromEvent(e);
      p.x = Math.round(p.x * 10) / 10;
      p.y = Math.round(p.y * 10) / 10;
      var last = s.points[s.points.length - 1];
      if (last) {
        var dx = p.x - last.x, dy = p.y - last.y;
        if (dx * dx + dy * dy < MIN_ABSTAND2) return;
      }
      s.points.push(p);
    }

    /* Einen laufenden Strich abschließen.
     *
     * HIER steckte der Fehler, den man beim Bruchstrich von „1/2" sieht:
     * Safari liefert die letzten Messpunkte eines Strichs nicht mehr als
     * pointermove, sondern hängt sie an das pointerup-Ereignis. Diese Punkte
     * wurden bisher weggeworfen – beim langen Strich der 1 fehlte dadurch nur
     * das letzte Stück und fiel nicht auf, beim kurzen, schnellen Querstrich
     * war es der ganze Strich: Übrig blieb der aufgesetzte Punkt.
     * Deshalb wird der Abschluss jetzt genauso ausgewertet wie eine Bewegung.
     */
    function strichBeenden(e) {
      if (aktivId === null) return;
      if (e) {
        if (e.pointerType === "pen") letzterStift = now();
        // Auch bei „pointercancel" werden die Punkte übernommen. Safari bricht
        // besonders kurze Stiftkontakte gern ab, statt sie als Absetzen zu
        // melden – und mit dem Abbruch wären genau die Messpunkte verloren,
        // aus denen der kurze Strich besteht. Geschriebenes wegzuwerfen ist in
        // keinem Fall das, was man erwartet.
        punkteUebernehmen(e);
      }
      // Falls der Browser den Zeiger von sich aus eingefangen hat, geben wir
      // ihn ausdrücklich wieder frei – sonst kann der nächste Strich hängen.
      try {
        if (canvas.hasPointerCapture && canvas.hasPointerCapture(aktivId)) {
          canvas.releasePointerCapture(aktivId);
        }
      } catch (err) {}
      aktivId = null;
      drawing = false;
      current = null;
      if (schubId === null) fensterAus();
      clearTimeout(wachhund);
      diagZaehl("up");
      changed();
    }

    // Letzte Sicherung: Kommt für einen laufenden Strich längere Zeit gar
    // nichts mehr an, wurde das Absetzen verschluckt. Dann beenden wir ihn
    // selbst, damit der nächste Strich wieder anfangen kann.
    var wachhund = null;
    function wachhundStellen() {
      clearTimeout(wachhund);
      wachhund = setTimeout(function () { strichBeenden(null); }, 1500);
    }

    function onUp(e) {
      if (schubId !== null && e.pointerId === schubId) {
        schubId = null;
        if (aktivId === null) fensterAus();
        return;
      }
      if (aktivId === null || e.pointerId !== aktivId) return;
      strichBeenden(e);
    }

    canvas.addEventListener("pointerdown", onDown, { passive: false });
    // Der Abschluss wird doppelt abgefangen: am Fenster (greift auch, wenn der
    // Stift die Fläche verlassen hat) und fest an der Fläche selbst (greift
    // auch, wenn das Ereignis das Fenster nie erreicht). Doppelt gemeldet
    // schadet nicht – strichBeenden prüft die Zeiger-Kennung.
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    // "lostpointercapture" beendet den Strich ausdrücklich NICHT mehr –
    // siehe die Erklärung oben.

    requestAnimationFrame(resize);

    var onChange = null;
    function changed() { if (onChange) { try { onChange(); } catch (e) {} } }

    // Setzt zusätzlich die Strichstärke des Stifts zurück, wenn der Radierer
    // über setColor/setWidth abgewählt wird (siehe unten).
    return {
      setColor: function (c) { color = c; radiert = false; },
      setWidth: function (w) { lineWidth = w * 2; radiert = false; },
      setEraser: function (an) { radiert = !!an; },
      isEraser: function () { return radiert; },
      undo: function () { strokes.pop(); redraw(); changed(); },
      clear: function () { strokes = []; redraw(); changed(); },
      isEmpty: function () { return strokes.length === 0; },
      resize: resize,
      // Für das Zwischenspeichern: Striche auslesen und wieder einsetzen.
      getStrokes: function () { return strokes; },
      setStrokes: function (arr) {
        strokes = Array.isArray(arr) ? arr : [];
        redraw();
      },
      setOnChange: function (fn) { onChange = fn; }
    };
  }

  function mkToolBtn(label, title, onClick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn btn-sm btn-ghost";
    b.textContent = label; if (title) b.title = title;
    b.addEventListener("click", onClick);
    return b;
  }

  /* Das Karo lag bisher als CSS-Verlauf auf der Zeichenfläche selbst. Jedes
   * neue Strichstück zwang Safari damit, den Verlauf unter der Fläche neu zu
   * malen – auf dem iPad der teuerste Teil des Schreibens. Jetzt liegt das
   * Karo in einer eigenen, unveränderlichen Schicht darunter; die Fläche
   * darüber ist durchsichtig und bekommt eine eigene Ebene im Compositor. */
  function karoSchicht(canvas) {
    if (!canvas || !canvas.parentNode) return;
    if (canvas.parentNode.classList.contains("drawpad-paper")) return;
    var paper = document.createElement("div");
    paper.className = "drawpad-paper";
    var karo = document.createElement("div");
    karo.className = "drawpad-karo";
    canvas.parentNode.insertBefore(paper, canvas);
    paper.appendChild(karo);
    paper.appendChild(canvas);
  }

  function wireDrawpad(wrapEl) {
    var canvas = wrapEl.querySelector("canvas.drawpad-canvas");
    var toolbar = wrapEl.querySelector(".drawpad-toolbar");
    if (!canvas || !toolbar) return null;
    karoSchicht(canvas);
    var pad = createDrawPad(canvas);
    var colors = [
      { name: "Tinte", v: getCssVar("--ink") },
      { name: "Blau (Modell A)", v: getCssVar("--accent-linear") },
      { name: "Orange (Modell B)", v: getCssVar("--accent-exp") },
      { name: "Rot", v: getCssVar("--danger") }
    ];
    colors.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "color-dot" + (i === 0 ? " active" : "");
      b.style.background = c.v; b.title = c.name; b.setAttribute("aria-label", c.name);
      b.addEventListener("click", function () {
        pad.setColor(c.v);
        toolbar.querySelectorAll(".color-dot").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
      toolbar.appendChild(b);
    });
    // Stift/Radierer als Paar: was gerade aktiv ist, bleibt sichtbar markiert.
    // Farben und Strichstärken schalten den Radierer selbst wieder aus, damit
    // niemand rätselt, warum plötzlich nichts mehr ankommt.
    var duennBtn = mkToolBtn("Dünn", "Feiner Stift", function () { pad.setWidth(1.4); zeigeWerkzeug(); });
    var dickBtn = mkToolBtn("Dick", "Dicker Stift", function () { pad.setWidth(5.5); zeigeWerkzeug(); });
    var radierBtn = mkToolBtn("Radierer", "Striche wegwischen – nochmal tippen, um weiterzuschreiben", function () {
      pad.setEraser(!pad.isEraser());
      zeigeWerkzeug();
    });
    radierBtn.classList.add("tool-eraser");

    function zeigeWerkzeug() {
      var an = pad.isEraser();
      radierBtn.classList.toggle("tool-active", an);
      canvas.classList.toggle("is-erasing", an);
    }

    toolbar.appendChild(duennBtn);
    toolbar.appendChild(dickBtn);
    toolbar.appendChild(radierBtn);
    toolbar.appendChild(mkToolBtn("↺ Rückgängig", "Letzten Strich entfernen", function () { pad.undo(); }));
    toolbar.appendChild(mkToolBtn("🗑 Löschen", "Alles löschen", function () { pad.clear(); }));
    // Farbwechsel beendet das Radieren – die Farbknöpfe stehen weiter oben.
    toolbar.querySelectorAll(".color-dot").forEach(function (b) {
      b.addEventListener("click", zeigeWerkzeug);
    });
    redrawCallbacks.push(pad.resize);

    /* Vollbild-Schreibmodus.
     *
     * Handschrift auf einer langen Seite steht immer in Konkurrenz zum
     * Blättern: Man schreibt zwei Wörter, dann will man weiter, verschiebt
     * dabei das Blatt und verliert die Zeile. Im Vollbild ist die Seite
     * dahinter gesperrt, es gibt nichts zu verschieben – und viel mehr Platz.
     *
     * Umgesetzt wird das, indem dieselbe Fläche kurzzeitig in eine Hülle
     * umgehängt wird: gleiche Zeichenfläche, gleiche Striche, gleicher
     * Zwischenspeicher. Weil Striche im festen Blattmaß liegen (siehe
     * LOGISCHE_BREITE), sieht Geschriebenes danach unverändert aus.
     */
    var vollbildBtn = null;
    if (wrapEl.closest(".calc-area")) {
      vollbildBtn = mkToolBtn("⤢ Groß schreiben", "Fläche bildschirmfüllend öffnen", oeffneVollbild);
      vollbildBtn.classList.remove("btn-ghost");
      vollbildBtn.classList.add("tool-fullscreen");
      // Ganz nach vorn: Auf dem iPad ist das der Weg zum ruhigen Schreiben,
      // nicht eine Zusatzoption am Ende der Leiste.
      toolbar.insertBefore(vollbildBtn, toolbar.firstChild);
    }

    function oeffneVollbild() {
      if (document.querySelector(".calc-overlay")) return;
      var platzhalter = document.createElement("div");
      wrapEl.parentNode.insertBefore(platzhalter, wrapEl);

      var huelle = document.createElement("div");
      huelle.className = "calc-overlay";
      var leiste = document.createElement("div");
      leiste.className = "calc-overlay-bar";
      var titel = document.createElement("span");
      titel.className = "calc-overlay-title";
      var aufgabe = platzhalter.closest(".wb-block");
      var nummer = aufgabe ? aufgabe.querySelector(".task-num") : null;
      titel.textContent = nummer ? "Rechenweg zu Aufgabe " + nummer.textContent : "Rechenweg";
      var fertig = mkToolBtn("✓ Fertig", "Zurück zum Arbeitsblatt", schliesse);
      // btn-ghost (aus mkToolBtn) würde den farbigen Hintergrund überschreiben.
      fertig.classList.remove("btn-ghost");
      fertig.classList.add("btn-primary");

      /* Aufgabenstellung mitnehmen: Im Vollbild ist das Blatt dahinter
       * verdeckt – ohne den Text müsste man zum Nachlesen jedes Mal schließen.
       * Übernommen werden der Aufgabentext und, falls vorhanden, der
       * mehrteilige Arbeitsauftrag offener Aufgaben. Der Bereich ist
       * einklappbar und hat eine eigene Bildlaufleiste, damit bei langen
       * Aufträgen trotzdem genug Platz zum Schreiben bleibt. */
      var auftrag = null, auftragBtn = null;
      if (aufgabe) {
        var teile = [];
        var prompt = aufgabe.querySelector(".task-prompt");
        if (prompt) teile.push('<p class="calc-overlay-prompt">' + prompt.innerHTML + "</p>");
        var vorlage = aufgabe.querySelector(".answer-template.answer-text");
        if (vorlage) teile.push(vorlage.innerHTML);
        if (teile.length) {
          auftrag = document.createElement("div");
          auftrag.className = "calc-overlay-task";
          auftrag.innerHTML = teile.join("");
          auftragBtn = mkToolBtn("Aufgabe ausblenden", "Aufgabenstellung ein- oder ausblenden", function () {
            var zu = auftrag.classList.toggle("is-collapsed");
            auftragBtn.textContent = zu ? "Aufgabe einblenden" : "Aufgabe ausblenden";
          });
        }
      }

      leiste.appendChild(titel);
      if (auftragBtn) leiste.appendChild(auftragBtn);
      leiste.appendChild(fertig);
      huelle.appendChild(leiste);
      if (auftrag) huelle.appendChild(auftrag);
      huelle.appendChild(wrapEl);
      document.body.appendChild(huelle);
      document.body.classList.add("wb-vollbild");
      if (vollbildBtn) vollbildBtn.style.display = "none";
      requestAnimationFrame(function () { pad.resize(); });

      function schliesse() {
        platzhalter.parentNode.insertBefore(wrapEl, platzhalter);
        platzhalter.remove();
        huelle.remove();
        document.body.classList.remove("wb-vollbild");
        if (vollbildBtn) vollbildBtn.style.display = "";
        requestAnimationFrame(function () { pad.resize(); });
        document.removeEventListener("keydown", beiEscape);
      }
      function beiEscape(e) { if (e.key === "Escape") schliesse(); }
      document.addEventListener("keydown", beiEscape);
    }

    // Für das Zwischenspeichern merken, welche Zeichenfläche zu welchem
    // Canvas gehört – die Striche werden nach einem Neuladen wiederhergestellt.
    if (canvas.id) {
      padRegistry[canvas.id] = pad;
      pad.setOnChange(scheduleSave);
    }
    return pad;
  }

  /* ---------- Parameter-Graph ---------- */
  function drawGrowthGraph(canvas, opts) {
    var maxDays = opts.maxDays, series = opts.series;

  }

  /* ---------- Diagramm-Baustein: Balken/Linie/Kreis ----------
   * opts: { chartType: 'bar'|'line'|'pie', data: [{label,value,color}],
   *         xLabel, yLabel, unit, showValues }. Farben kommen bereits
   * aufgelöst (getCssVar) vom Aufrufer, damit diese Funktion themen-

    return unit ? s + " " + unit : s;
  }

    s = String(s == null ? "" : s);

  }
  function drawPieChart(ctx, W, H, data, opts, ink) {
    var total = data.reduce(function (s, d) { return s + Math.max(0, Number(d.value) || 0); }, 0);
    if (total <= 0) total = 1;
    var cx = W / 2, cy = H / 2, r = Math.max(20, Math.min(W, H) / 2 - 14);
    var startAngle = -Math.PI / 2;
    data.forEach(function (d) {

      var angle = (val / total) * Math.PI * 2;

      ctx.fillStyle = d.color || ink;

        ctx.fillStyle = "#fff";

        ctx.font = "700 12px 'Karla', sans-serif";

  function drawDiagram(canvas, opts) {
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;

    if (rect.width < 1) return;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = rect.width, H = rect.height;
    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft");
    var line = getCssVar("--line"), paperRaised = getCssVar("--paper-raised");
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paperRaised; ctx.fillRect(0, 0, W, H);

    var data = (opts.data || []).filter(function (d) { return d && d.label !== undefined && d.label !== ""; });
    if (!data.length) return;

    if (opts.chartType === "pie") { drawPieChart(ctx, W, H, data, opts, ink); return; }

    var vals = data.map(function (d) { return Math.max(0, Number(d.value) || 0); });
    var niceMax = niceCeil(Math.max.apply(null, vals.concat([0])) || 1);

    // Linke Randbreite an die tatsächlich breiteste y-Achsen-Beschriftung
    // anpassen (Werte + Einheit können deutlich breiter sein als reine
    // Zahlen, z. B. "7 Schüler") – sonst würde der Text links abgeschnitten.
    ctx.font = "11px 'JetBrains Mono', monospace";
    var ySteps = 5;
    var maxTickW = 0;
    for (var mi = 0; mi <= ySteps; mi++) {
      var mw = ctx.measureText(diagramValueLabel(niceMax * mi / ySteps, opts.unit)).width;
      if (mw > maxTickW) maxTickW = mw;
    }

    var plotW = W - padL - padR, plotH = H - padT - padB;
    if (plotW < 10 || plotH < 10) return;

    function xFor(i) { return padL + (i + 0.5) / data.length * plotW; }
    function yFor(v) { return padT + plotH - (v / niceMax) * plotH; }

    for (var i = 0; i <= ySteps; i++) {
      var v = niceMax * i / ySteps, y = yFor(v);
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = inkSoft; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(diagramValueLabel(v, opts.unit), padL - 8, y);

    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(W - padR, padT + plotH);
    ctx.stroke();

      ctx.beginPath();
      data.forEach(function (d, i) {
        var x = xFor(i), y = yFor(Math.max(0, Number(d.value) || 0));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

        var x = xFor(i), val = Math.max(0, Number(d.value) || 0), y = yFor(val);

        if (opts.showValues) {

      data.forEach(function (d, i) {

        ctx.fillStyle = d.color || ink;

        if (opts.showValues) {

  /* ---------- Sicherer Funktions-Parser (kein eval/Function) ----------
   * Unterstützt: + - * / ^ (rechtsassoziativ), Klammern, Variable x,
   * Konstanten pi/e, Funktionen sin/cos/tan/asin/acos/atan/sqrt/abs/exp/
   * ln/log/round/floor/ceil/sign. Wirft bei ungültiger Eingabe einen Error

   * zurück. */

    asin: Math.asin, acos: Math.acos, atan: Math.atan,

    ln: Math.log, log: Math.log10, log10: Math.log10,

  function tokenizeExpr(str) {
    var tokens = [], i = 0, n = str.length;
    while (i < n) {

      if (/[A-Za-z]/.test(c)) {

        tokens.push({ type: "IDENT", value: str.slice(i, k) });
        i = k; continue;
      }
      if ("+-*/^()".indexOf(c) !== -1) { tokens.push({ type: "OP", value: c }); i++; continue; }
      throw new Error("unerwartetes Zeichen „" + c + "“");

  function compileExpr(str) {

    }

        if (peek() && peek().value === "(") {

          if (!EXPR_FUNCS.hasOwnProperty(name)) throw new Error("unbekannte Funktion „" + name + "“");

  /* ---------- Koordinatensystem mit Funktionsgraphen ---------- */

    else { ctx.moveTo(x, y - 8); ctx.lineTo(x - 4.5, y + 3); ctx.lineTo(x + 4.5, y + 3); }
    ctx.closePath();
    ctx.fill();
  }

  function drawCoordinatePlane(canvas, opts) {
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;

    var xMin = Math.min(opts.xMin, opts.xMax - 0.001), xMax = Math.max(opts.xMax, opts.xMin + 0.001);
    var yMin = Math.min(opts.yMin, opts.yMax - 0.001), yMax = Math.max(opts.yMax, opts.yMin + 0.001);
    var xStep = opts.xStep > 0 ? opts.xStep : (xMax - xMin) / 10 || 1;
    var yStep = opts.yStep > 0 ? opts.yStep : (yMax - yMin) / 10 || 1;

    // Die Höhe wird passend zur (vom Layout vorgegebenen) Breite berechnet,
    // damit die Gitterkästchen quadratisch sind UND die volle Breite ausfüllen
    // (kein Leerraum links/rechts wie beim reinen Zentrieren in fester Höhe).

    if (startRect.width < 1) return;
    var availW = Math.max(10, startRect.width - 2 * pad);

    // Breite gewählt, dieser Schritt fängt nur Rundungsdifferenzen ab).

    var plotW = scale * (xMax - xMin), plotH = scale * (yMax - yMin);
    var offX = pad + (availW - plotW) / 2, offY = pad + (availH - plotH) / 2;

    function X(vx) { return offX + (vx - xMin) * scale; }
    function Y(vy) { return offY + plotH - (vy - yMin) * scale; }

    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft"), line = getCssVar("--line"), paperRaised = getCssVar("--paper-raised");
    ctx.clearRect(0, 0, W, H);

      ctx.fillText(formatTick(gy), axisX + (ctx.textAlign === "right" ? -6 : 6), Y(gy));
    }
    ctx.fillText("0", axisX + (ctx.textAlign === "right" ? -6 : 6), axisY + (axisY < offY + plotH - 14 ? 9 : -9));

    // Achsenbeschriftungen – fest im Rand außerhalb des Rasters platziert
    // (nicht relativ zur Achsenposition), damit sie nie mit den Zahlen an
    // den Gitterlinien kollidieren, auch wenn die Achse an den Rand rutscht
    // (z. B. bei einem Definitionsbereich, der die 0 nicht enthält).
    ctx.font = "600 13px 'Outfit', ui-sans-serif, sans-serif";
    ctx.fillStyle = ink;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(opts.xLabel || "x", offX + plotW + 6, axisY);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(opts.yLabel || "y", axisX, offY - 8);

    // Funktionsgraphen – auf das Gitter-Rechteck geclippt, damit Kurven, die
    // steil aus dem sichtbaren Bereich laufen, sauber am Rand enden statt in
    // die Beschriftung/den Rand darüber hinauszuragen.

          started = false; prevY = null; continue;
        }
        var px = X(vx), py = Y(vy);
        if (!started) { ctx.moveTo(px, py); started = true; }
        else if (prevY !== null && Math.abs(vy - prevY) > yRange * 1.5) { ctx.moveTo(px, py); }
        else { ctx.lineTo(px, py); }
        prevY = vy;
      }
      ctx.stroke();
    });
    ctx.restore();
  }

  /* ---------- Fortschritt / Feedback ---------- */
  function setFeedback(feedbackId, ok, msg) {
    var fb = el(feedbackId);
    if (!fb) return;
    fb.className = "feedback show " + (ok ? "ok" : "bad");
    fb.textContent = (ok ? "✓ " : "✗ ") + msg;
  }

  var hintState = {};
