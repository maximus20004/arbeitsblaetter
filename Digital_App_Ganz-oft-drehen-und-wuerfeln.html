<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganz oft drehen und würfeln</title>
<style>
/* Simulation zum empirischen Gesetz der großen Zahlen.
   Reiter 1 „Glücksrad“: Felder Rot (halbes Rad), Blau (Drittel), Gelb (Sechstel), Verlauf der relativen Häufigkeiten.
   Reiter 2 „Gezinkter Würfel?“: ein Würfel mit unbekannten Wahrscheinlichkeiten, Säulen der relativen Häufigkeiten 1–6.
   Wahrscheinlichkeiten erst auf Knopfdruck. */
:root{
  --bg:#f5f6f1; --card:#fff; --ink:#1d2433; --muted:#5d6678; --line:#d9dccf; --accent:#1f4e9c; --soft:#e8eef8;
  --a:#d6352f; --b:#2f6fd0; --c:#c99700; --grid:#e6e8de; --target:#2e9e6a; --bar:#7b8fb8; --bar6:#d6352f;
  --font:"Segoe UI",system-ui,-apple-system,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141821; --card:#1d2330; --ink:#e9edf5; --muted:#9aa4b8; --line:#333c4e; --accent:#7aa7ff; --soft:#25304a;
  --a:#ff6b5e; --b:#7aa7ff; --c:#f2c94c; --grid:#2a3242; --target:#5fd39b; --bar:#8b9dc4; --bar6:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141821; --card:#1d2330; --ink:#e9edf5; --muted:#9aa4b8; --line:#333c4e; --accent:#7aa7ff; --soft:#25304a;
  --a:#ff6b5e; --b:#7aa7ff; --c:#f2c94c; --grid:#2a3242; --target:#5fd39b; --bar:#8b9dc4; --bar6:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px}
.wrap{max-width:900px;margin:0 auto;padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:600 17px var(--font);min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:8px 12px;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0}
.rule{color:var(--muted);margin:0;line-height:1.45}
.top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:560px){.top{grid-template-columns:1fr}}
.stage{min-width:150px;height:130px;padding:0 12px;border-radius:16px;background:var(--soft);display:flex;gap:12px;align-items:center;justify-content:center;justify-self:center}
.die{width:80px;height:80px;background:#fff;border:3px solid #1d2433;border-radius:16px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.die.red{background:#fde8e6;border-color:#a8231f}
.die.gold{background:#fff3cf;border-color:#9a7400}
.die i{width:15px;height:15px;border-radius:50%;background:#1d2433;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.7) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.last{font-weight:700;text-align:center;min-height:22px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:560px){.row{grid-template-columns:repeat(3,1fr)}}
.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;white-space:normal;color:var(--muted);font-weight:600}
td.h{font-weight:700}
td.p{color:var(--target);font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%}
@media (max-width:560px){.chartwrap{aspect-ratio:1/1}}
canvas{width:100%;height:100%;display:block}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button{flex:1 1 200px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-m="rad">🎡 Glücksrad</button>
    <button role="tab" aria-selected="false" data-m="gezinkt">🎲 Gezinkter Würfel?</button>
  </nav>
  <div class="card">
    <div class="top">
      <div><div class="stage" id="stage"></div><div class="last" id="last"></div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 id="title"></h1>
        <p class="rule" id="rule"></p>
        <p class="rule"><b id="n">0</b> <span id="unit">Würfe</span></p>
      </div>
    </div>
    <div class="row" id="btns">
      <button class="primary" data-a="1">+1</button>
      <button data-a="10">+10</button>
      <button data-a="100">+100</button>
      <button data-a="1000">+1&#8239;000</button>
      <button data-a="10000">+10&#8239;000</button>
    </div>
  </div>
  <div class="card">
    <h2>Strichliste</h2>
    <div class="tablewrap"><table id="tab"></table></div>
    <div class="foot">
      <button id="target">Wahrscheinlichkeiten einblenden</button>
      <button id="reset">Neu anfangen</button>
    </div>
  </div>
</div>
<script>
(function(){
  // Gezinkter Würfel: die Sechs ist beschwert, die gegenüberliegende Eins dafür seltener.
  var W=[0.10,0.15,0.15,0.15,0.15,0.30];
  var MODES={
    rad:{title:"Das Glücksrad",rule:"Drei Felder mit den Mittelpunktswinkeln Rot 180°, Blau 120° und Gelb 60°. Der Zeiger oben zeigt das Ergebnis.",
      ctitle:"Verlauf der relativen Häufigkeiten",
      ev:[{name:"Rot",col:"--a",p:1/2,pt:"1/2 = 50 %",dash:[]},{name:"Blau",col:"--b",p:1/3,pt:"1/3 ≈ 33,3 %",dash:[10,4]},{name:"Gelb",col:"--c",p:1/6,pt:"1/6 ≈ 16,7 %",dash:[3,4]}],
      roll:function(){var r=Math.random();return [r<1/2?0:(r<5/6?1:2)];},
      hits:function(v){return [v[0]===0,v[0]===1,v[0]===2];},
      label:function(v){return ["Rot","Blau","Gelb"][v[0]];}},
    gezinkt:{title:"Ist dieser Würfel gezinkt?",rule:"Ein Glückswürfel aus dem Scherzartikelladen. Ob alle Augenzahlen gleich wahrscheinlich sind, sieht man ihm nicht an.",
      ctitle:"Relative Häufigkeiten der Augenzahlen",
      ev:[1,2,3,4,5,6].map(function(k){return {name:"Augenzahl "+k,col:k===6?"--bar6":"--bar",p:W[k-1],pt:String(Math.round(W[k-1]*100))+" %"};}),
      roll:function(){var r=Math.random(),s=0;for(var i=0;i<6;i++){s+=W[i];if(r<s)return [i+1];}return [6];},
      hits:function(v){return [1,2,3,4,5,6].map(function(k){return v[0]===k;});},
      label:function(v){return "Augenzahl "+v[0];}}
  };
  var mode="rad",rot=0,n=0,cnt=[],pts=[],showT=false,busy=false,last=null;
  var $=function(id){return document.getElementById(id);};
  
  function fmt(x){return String(x).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
  function pct(x){return (x*100).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";}
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  function M(){return MODES[mode];}
  function setMode(m){mode=m;document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.m===m));});reset();}
  function reset(){n=0;cnt=M().ev.map(function(){return 0;});pts=[];last=null;showT=false;$("target").textContent="Wahrscheinlichkeiten einblenden";render();}
  function step(c){for(var i=0;i<c;i++){last=M().roll();if(mode==="rad"){var lo=[0,180,300][last[0]],hi=[180,300,360][last[0]],ang=lo+5+Math.random()*(hi-lo-10);rot=(Math.floor(rot/360)+2)*360-ang;}n++;var h=M().hits(last);for(var j=0;j<h.length;j++)if(h[j])cnt[j]++;
    if(n<=100||n%Math.max(1,Math.floor(n/200))===0)pts.push([n,cnt.map(function(k){return k/n;})]);}}
  function arc(a0,a1,col){var r=52,cx=60,cy=62,f=function(a){a=(a-90)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2);};
    return '<path d="M'+cx+' '+cy+' L'+f(a0)+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+f(a1)+' Z" fill="var('+col+')" stroke="#1d2433" stroke-width="1.5"/>';}
  function wheel(){return '<svg width="120" height="124" viewBox="0 0 120 124" aria-label="Glücksrad"><g style="transform-origin:60px 62px;transform:rotate('+rot+'deg);transition:transform .5s cubic-bezier(.2,.8,.3,1)">'+
    arc(0,180,"--a")+arc(180,300,"--b")+arc(300,360,"--c")+'</g><circle cx="60" cy="62" r="5" fill="#1d2433"/><path d="M52 2 L68 2 L60 16 Z" fill="#1d2433"/></svg>';}
  function die(v,cls){var pips={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];var d='<div class="die pop '+(cls||"")+'">';for(var i=0;i<9;i++)d+='<i class="'+(pips.indexOf(i)>=0?"on":"")+'"></i>';return d+"</div>";}
  function render(){
    var m=M();$("title").textContent=m.title;$("rule").textContent=m.rule;$("n").textContent=fmt(n);$("unit").textContent=mode==="rad"?"Drehungen":"Würfe";
    if(last===null){$("stage").innerHTML=mode==="rad"?wheel():'<span style="color:var(--muted);font-size:14px">Tippe auf +1</span>';$("last").textContent="";}
    else if(mode==="rad"){$("stage").innerHTML=wheel();$("last").textContent=m.label(last);}
    else{$("stage").innerHTML=last.map(function(v){return die(v,"gold");}).join("");$("last").textContent=m.label(last);}
    var t='<tr><th>Ereignis</th><th>absolute<br>Häufigkeit</th><th>relative<br>Häufigkeit</th>'+(showT?'<th>Wahrschein&shy;lichkeit</th>':'')+'</tr>';
    m.ev.forEach(function(e,i){t+='<tr><td><span class="dot" style="background:var('+e.col+')"></span>'+e.name+'</td><td>'+fmt(cnt[i])+'</td><td class="h">'+(n?pct(cnt[i]/n):"–")+'</td>'+(showT?'<td class="p">'+e.pt+'</td>':'')+'</tr>';});
    $("tab").innerHTML=t;chart();
  }
  function frame(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);g.font="12px "+css("--font");return r;}
  function yaxis(L,T,pw,ph,top,ly){for(var yv=0;yv<=top+1e-9;yv+=0.1){var y=ly(yv);g.strokeStyle=css("--grid");g.lineWidth=1;g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillStyle=css("--muted");g.textAlign="right";g.fillText(Math.round(yv*100)+" %",L-6,y+4);}}
  function chart(){}
  function lines(){
    var r=frame(),W_=r.width,H=r.height,L=48,R=14,T=12,B=40,pw=W_-L-R,ph=H-T-B,m=M();
    var maxN=Math.max(10,n*1.25),lx=function(x){return L+pw*Math.log10(x)/Math.log10(maxN);};
    var mx=0;pts.forEach(function(q){q[1].forEach(function(v){if(v>mx)mx=v;});});var top=Math.max(0.7,Math.ceil(mx*10-1e-9)/10),ly=function(y){return T+ph*(1-y/top);};
    yaxis(L,T,pw,ph,top,ly);
    for(var e=0;e<=Math.floor(Math.log10(maxN)+1e-9);e++){var x=lx(Math.pow(10,e));g.strokeStyle=css("--grid");g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.fillStyle=css("--muted");g.textAlign="center";g.fillText(fmt(Math.pow(10,e)),x,T+ph+16);}
    g.fillStyle=css("--muted");g.textAlign="center";g.fillText((mode==="rad"?"Anzahl der Drehungen":"Anzahl der Würfe")+" (jeder Strich: zehnmal so viele)",L+pw/2,H-4);
    if(showT){m.ev.forEach(function(ev){g.strokeStyle=css("--target");g.lineWidth=2;g.setLineDash([7,6]);g.beginPath();g.moveTo(L,ly(ev.p));g.lineTo(L+pw,ly(ev.p));g.stroke();g.setLineDash([]);
      g.fillStyle=css("--target");g.textAlign="left";g.fillText(ev.pt.split(" =")[0].split(" ≈")[0],L+4,ly(ev.p)-6);});}
    m.ev.forEach(function(ev,j){if(!pts.length)return;g.strokeStyle=css(ev.col);g.lineWidth=2.5;g.lineJoin="round";g.setLineDash(ev.dash||[]);g.beginPath();
      pts.forEach(function(p,i){var x=lx(p[0]),y=ly(p[1][j]);if(i)g.lineTo(x,y);else g.moveTo(x,y);});g.stroke();g.setLineDash([]);});
  }
  function bars(){
    var r=frame(),W_=r.width,H=r.height,L=48,R=14,T=12,B=40,pw=W_-L-R,ph=H-T-B,m=M();
    var mx=0;cnt.forEach(function(k){if(n&&k/n>mx)mx=k/n;});var top=Math.max(0.4,Math.ceil(mx*10-1e-9)/10),ly=function(y){return T+ph*(1-y/top);};
    yaxis(L,T,pw,ph,top,ly);
    var slot=pw/6,bw=Math.min(56,slot*0.6);
    for(var k=0;k<6;k++){var cx=L+slot*(k+0.5);g.fillStyle=css("--muted");g.textAlign="center";g.fillText(String(k+1),cx,T+ph+16);
      if(n){var h=cnt[k]/n;g.fillStyle=css(m.ev[k].col);g.fillRect(cx-bw/2,ly(h),bw,T+ph-ly(h));}
      if(showT){g.strokeStyle=css("--target");g.lineWidth=3;g.setLineDash([6,4]);g.beginPath();g.moveTo(cx-bw/2-6,ly(W[k]));g.lineTo(cx+bw/2+6,ly(W[k]));g.stroke();g.setLineDash([]);}}
    g.fillStyle=css("--muted");g.textAlign="center";g.fillText("Augenzahl",L+pw/2,H-4);
  }
  function add(c){
    if(busy)return;if(c<=10){step(c);render();return;}
    busy=true;document.querySelectorAll("#btns button").forEach(function(b){b.disabled=true;});
    var frames=c>=1000?40:20,per=Math.ceil(c/frames),done=0;
    (function f(){var s=Math.min(per,c-done);step(s);done+=s;render();if(done<c)requestAnimationFrame(f);else{busy=false;document.querySelectorAll("#btns button").forEach(function(b){b.disabled=false;});}})();
  }
  document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.m);});});
  document.querySelectorAll("#btns button").forEach(function(b){b.addEventListener("click",function(){add(+b.dataset.a);});});
  $("target").addEventListener("click",function(){showT=!showT;this.textContent=showT?"Wahrscheinlichkeiten ausblenden":"Wahrscheinlichkeiten einblenden";render();});
  $("reset").addEventListener("click",reset);
  window.addEventListener("resize",chart);
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",chart);
  setMode("rad");
})();
</script>
</body>
</html>
