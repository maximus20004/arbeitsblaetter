<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II.1 Mehrstufige Zufallsexperimente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>/*
 * worksheet.css – gemeinsames visuelles Erscheinungsbild der Arbeitsblätter.
 * Wird identisch verwendet in: Baukasten-Vorschau, exportiertes Arbeitsblatt.
 * Basiert auf dem Hausstil des Wachstum-Prototyps (top.html).
 */
:root {
  --paper: #F4F6F5;
  --paper-raised: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #566072;
  --line: #D7DEDC;
  --accent-primary: #3D5A80;
  --accent-primary-soft: #E7ECF3;
  --accent-linear: #2E7D8C;
  --accent-linear-soft: #DCEEF0;
  --accent-exp: #C85A22;
  --accent-exp-soft: #FBE7DA;
  --success: #2F9E44;
  --success-soft: #E3F6E6;
  --danger: #C1443C;
  --danger-soft: #FBEAE8;
  --shadow: 0 1px 2px rgba(27,36,48,0.07), 0 6px 18px rgba(27,36,48,0.07);
  --table-line: var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181F;
    --paper-raised: #1B232C;
    --ink: #E7ECEF;
    --ink-soft: #A7B2BD;
    --line: #2B3542;
    --accent-primary: #8FADD6;
    --accent-primary-soft: #243347;
    --accent-linear: #6BC4CF;
    --accent-linear-soft: #173236;
    --accent-exp: #F0935B;
    --accent-exp-soft: #3A2718;
    --success: #63CB85;
    --success-soft: #163A22;
    --danger: #E1685C;
    --danger-soft: #3A1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
    --table-line: rgba(255,255,255,0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181F;
  --paper-raised: #1B232C;
  --ink: #E7ECEF;
  --ink-soft: #A7B2BD;
  --line: #2B3542;
  --accent-primary: #8FADD6;
  --accent-primary-soft: #243347;
  --accent-linear: #6BC4CF;
  --accent-linear-soft: #173236;
  --accent-exp: #F0935B;
  --accent-exp-soft: #3A2718;
  --success: #63CB85;
  --success-soft: #163A22;
  --danger: #E1685C;
  --danger-soft: #3A1E1B;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: local;
  color: var(--ink);
  font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
  line-height: 1.55;
}
h1, h2, h3, .display {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  text-wrap: balance;
  margin: 0;
}
.mono, .val, input[type="text"], input[type="number"] {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent-primary); }
button { font-family: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 1.05rem; font-weight: 600; flex: 1 1 auto; min-width: 180px; }
.chapter-eyebrow {
  display: block;
  font-family: "Outfit", sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent-primary);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--paper-raised);
  color: var(--ink);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 8px 12px; min-height: 38px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

main { max-width: 800px; margin: 0 auto; padding: 20px 18px 80px; position: relative; }

/* Seitenumbruch-Indikator (siehe engine.js renderPageBreakOverlays): zeigt
   in der Live-Vorschau, wo der PDF-Export vermutlich eine neue Seite
   beginnen würde – rein informativ, nie Teil des Exports/Drucks. */
.wb-pagebreak-line {
  position: absolute;
  left: -4px; right: -4px; height: 0;
  border-top: 2px dashed #d6336c;
  pointer-events: none;
  z-index: 5;
}
.wb-pagebreak-label {
  position: absolute; top: -9px; right: 2px;
  background: #d6336c; color: #fff;
  font: 600 10px/1.5 var(--font-mono, "JetBrains Mono", monospace);
  padding: 1px 7px; border-radius: 4px 4px 0 0;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
@media print { .wb-pagebreak-line { display: none !important; } }

.header-card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 22px;
}
.header-card h1 { font-size: 1.6rem; }
.header-card .subtitle { color: var(--ink-soft); margin-top: 4px; font-size: 0.95rem; }
.chapter-eyebrow-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.chapter-eyebrow-row .chapter-eyebrow { margin-bottom: 0; }
.chapter-meta {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 0.8rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.phase-heading { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; }
.phase-eyebrow {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
}
.phase-eyebrow .tag {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-primary);
}
.phase-heading h2 { font-size: 1.25rem; }
.card {
  break-inside: avoid;
  page-break-inside: avoid;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }

/* Rasterzeile: bis zu 4 Einheiten (= 25/50/75/100%) nebeneinander. Ein
   Baustein-Baustein ohne eigene Breiten-Einstellung nimmt alle 4 Einheiten
   (= volle Breite) ein und verhält sich optisch wie zuvor. */
.wb-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 16px;
  align-items: start;
  margin-bottom: 14px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.wb-row > .wb-block { min-width: 0; }
/* Sicherheitsnetz nur für echte Schmalformate (Handy hochkant) – bewusst
   niedriger als die ~600–650px, die die Live-Vorschau-Spalte im Editor selbst
   schon einnimmt, sonst würde „nebeneinander“ dort nie sichtbar (und auch der
   PDF-Export aus dem Editor liefe über exakt diese Breite). */
@media (max-width: 480px) {
  .wb-row { grid-template-columns: 1fr; }
  .wb-row > .wb-block { grid-column: span 1 !important; }
}

.merksatz, .merksatz-exp, .merksatz-neutral {
  border-left: 4px solid var(--accent-primary);
  background: var(--accent-primary-soft);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 12px 0;
}
.merksatz-exp { border-left-color: var(--accent-exp); background: var(--accent-exp-soft); }
.merksatz-neutral { border-left-color: var(--ink-soft); background: var(--paper); }
.merksatz .label, .merksatz-exp .label, .merksatz-neutral .label {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-primary);
  margin-bottom: 6px;
}
.merksatz-exp .label { color: var(--accent-exp); }
.merksatz-neutral .label { color: var(--ink-soft); }
.formula {
  font-family: "JetBrains Mono", monospace;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
}
.swatch-linear, .swatch-exp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.swatch-linear::before, .swatch-exp::before {
  content: "";
  width: 12px; height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.swatch-linear::before { background: var(--accent-linear); }
.swatch-exp::before { background: var(--accent-exp); }
.swatch-linear { color: var(--accent-linear); }
.swatch-exp { color: var(--accent-exp); }

.example-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 0.92rem;
  border: 1px solid var(--table-line);
}
.example-table th, .example-table td {
  border: 1px solid var(--table-line);
  padding: 6px 10px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.example-table th { font-weight: 700; }
.example-table thead th { background: var(--accent-primary-soft); }
.example-table tbody th { background: transparent; }
/* Erste Spalte (Zeilen-Beschriftung) automatisch auf ihren Inhalt schrumpfen,
   statt sich unnötig breite Reste der 100%-Tabellenbreite zu nehmen. Die
   übrigen (Daten-)Spalten teilen sich den verbleibenden Platz gleichmäßig. */
.example-table th:first-child,
.example-table td:first-child { width: 1%; white-space: nowrap; }

.graph-block { margin: 14px 0; }
.graph-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.graph-canvas { display: block; width: 100%; height: 300px; touch-action: none; }

.coord-plane-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.coord-plane-canvas { display: block; width: 100%; height: 320px; }
.coord-plane-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 10px;
  font-size: 0.85rem;
}
.coord-plane-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.coord-plane-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.coord-plane-legend-item.coord-plane-error { color: var(--danger); }

.diagram-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.diagram-canvas { display: block; width: 100%; height: 300px; }

.wb-image-empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink-soft);
  font-size: 0.85rem;
  background: var(--paper-raised);
}
.wb-image { margin: 14px 0; max-width: 100%; }
.wb-image img { display: block; width: 100%; height: auto; border-radius: 10px; }
.wb-image.align-center { margin-left: auto; margin-right: auto; }
.wb-image.align-left { margin-left: 0; margin-right: auto; }
.wb-image.align-right { margin-left: auto; margin-right: 0; }
.wb-image figcaption {
  margin-top: 6px;
  font-size: 0.82rem;
  color: var(--ink-soft);
  text-align: center;
  font-style: italic;
}
@media print { .wb-image { break-inside: avoid; } }
.slider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px 22px;
  margin-top: 14px;
}
.slider-field label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.slider-field .val { font-weight: 700; }
.slider-field.linear .val { color: var(--accent-linear); }
.slider-field.exp .val { color: var(--accent-exp); }
input[type="range"] {
  width: 100%;
  height: 36px;
  accent-color: var(--accent-primary);
  touch-action: manipulation;
}
.slider-field.linear input[type="range"] { accent-color: var(--accent-linear); }
.slider-field.exp input[type="range"] { accent-color: var(--accent-exp); }

.task-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.task-num {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: "Outfit", sans-serif;
}
.task-num.knobel { background: var(--accent-exp-soft); color: var(--accent-exp); }
.task-prompt { flex: 1 1 auto; font-weight: 600; }
.task-prompt p { margin: 0; }
.difficulty-stars {
  font-size: 0.95rem;
  white-space: nowrap;
  letter-spacing: 1px;
  flex: none;
}
.difficulty-stars .filled { color: var(--accent-exp); }
.difficulty-stars .empty { color: var(--line); }

/* --- Sortier-Aufgabe (Drag & Drop, siehe engine.js wireSortList) --- */
.sort-list { margin: 10px 0; }
.sort-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--paper-raised);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  min-height: 44px;
  transition: box-shadow 0.15s ease, opacity 0.15s ease;
}
.sort-item.dragging { opacity: 0.4; }
.sort-item.drag-over-top { box-shadow: 0 -3px 0 var(--accent-primary); }
.sort-item.drag-over-bottom { box-shadow: 0 3px 0 var(--accent-primary); }
.sort-handle {
  flex: none;
  cursor: grab;
  color: var(--ink-soft);
  font-size: 1.15rem;
  touch-action: none;
  line-height: 1;
  padding: 4px 2px;
}
.sort-handle:active { cursor: grabbing; }
.sort-text { flex: 1 1 auto; }

.answer-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}
/* Die Aufgaben-Vorlage bekommt einen eigenen Block-Container, damit Text und
   Eingabefelder normal fließen (mit <br> auch mehrzeilig). Läge sie direkt im
   Flex-Container, würde jeder Textschnipsel ein eigenes Flex-Element. */
.answer-template {
  flex: 1 1 100%;
  line-height: 2.6;
}
.fu-label { font-size: 0.85rem; color: var(--ink-soft); margin-right: 4px; }
input[type="text"], input[type="number"] {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  width: 100px;
  background: var(--paper);
  color: var(--ink);
}
input.field-input { width: auto; }
input:focus { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
select.choice {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  background: var(--paper);
  color: var(--ink);
}

.feedback {
  display: none;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 6px;
}
.feedback.show { display: inline-flex; }
.feedback.ok { background: var(--success-soft); color: var(--success); }
.feedback.bad { background: var(--danger-soft); color: var(--danger); }

.hint-area {
  display: none;
  margin-top: 8px;
  font-size: 0.87rem;
  color: var(--ink-soft);
  border-left: 3px solid var(--accent-exp);
  padding-left: 10px;
}
.hint-area.show { display: block; }
.hint-area p { margin: 4px 0; }

.solution-area {
  display: none;
  margin-top: 10px;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
}
.solution-area.show { display: block; }

.drawpad-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  margin-top: 10px;
}
.drawpad-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.color-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}
.color-dot.active { border-color: var(--ink); }
canvas.drawpad-canvas {
  width: 100%; height: 220px;
  display: block;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  touch-action: none;
}

.scratch-fab {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 30;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent-primary);
  color: #fff;
  border: none;
  box-shadow: var(--shadow);
  font-size: 1.4rem;
  cursor: pointer;
}
.scratch-panel {
  position: fixed;
  right: 18px; bottom: 84px;
  z-index: 30;
  width: min(420px, calc(100vw - 36px));
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 12px;
  display: none;
}
.scratch-panel.show { display: block; }
.scratch-panel h3 { font-size: 0.95rem; margin-bottom: 6px; }

footer.appfoot {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px 40px;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.no-print { }
body.exporting .no-print { visibility: hidden; }
body.exporting { background-image: none; }
body.exporting .feedback { display: none !important; }
/* Tipps werden im PDF ausgeblendet – AUSSER auf dem Lösungsblatt, dort
   gehören sie zur Lehrerfassung dazu. */
body.exporting:not(.wb-solution) .hint-area { display: none !important; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 0.88rem;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Lösungsblatt (Lehrerfassung) ---------- */
.header-card.is-solution { border-color: var(--accent-exp); }
.solution-badge {
  display: inline-block;
  margin: 8px 0 2px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--accent-exp);
  color: #fff;
  font-family: "Outfit", sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.01em;
}
.field-solution {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--accent-exp-soft);
  border-bottom: 2px solid var(--accent-exp);
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  margin-right: 2px;
}
.hint-area.open,
.solution-area.open { display: block; }
.solution-hints { margin: 4px 0 0; padding-left: 20px; }
.solution-hints li { margin: 2px 0; }
.sort-item.solved { cursor: default; }
.sort-rank {
  flex: none;
  min-width: 1.8em;
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  color: var(--accent-primary);
}

/* ---------- Seitenumbruch-Baustein ---------- */
/* Nur ein Hinweis im Baukasten/in der Vorschau – beim PDF-Export wird die
   Zeile gar nicht erst gerastert (collectPrintItems in engine.js). */
.wb-forced-break {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0;
  color: var(--ink-soft);
  font-family: "Outfit", sans-serif;
  font-size: 0.78rem;
  white-space: nowrap;
}
.wb-forced-break::before,
.wb-forced-break::after {
  content: "";
  flex: 1 1 auto;
  border-top: 2px dashed var(--line);
}
/* Im Schülerblatt bleibt die Zeile als Marke für die Seitenaufteilung stehen,
   ist aber leer – dann darf sie auch keinen Abstand erzeugen. */
.wb-row.wb-break-only { margin: 0; gap: 0; }

/* ---------- Rechenweg: Schreibfläche unter der Aufgabe ----------
   Soll nie vom Seitenumbruch zerschnitten werden – halbe Rechnungen auf zwei
   Seiten sind beim Korrigieren wertlos. */
.calc-area {
  margin-top: 14px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.calc-label {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.calc-area .drawpad-wrap { margin-top: 0; }

/* ---------- Schreiben statt markieren ----------
   Beim Schreiben mit dem Finger hat der Browser bisher oft eine Textauswahl
   gestartet: die halbe Aufgabe war blau hinterlegt statt beschrieben. Auf der
   Fläche und ihrer Werkzeugleiste ist Markieren deshalb abgeschaltet – im
   übrigen Blatt bleibt es erlaubt, dort will man Text kopieren können. */
.drawpad-wrap,
.drawpad-wrap * ,
.calc-label {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
canvas.drawpad-canvas { cursor: crosshair; }
canvas.drawpad-canvas.is-erasing { cursor: cell; }

/* Radierer: aktiv sichtbar markiert, sonst rät man, welches Werkzeug greift. */
.drawpad-toolbar .tool-active {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #fff;
}

/* ---------- Rückmeldung pro Lücke ----------
   Nach „Prüfen" ist an jedem Feld einzeln sichtbar, ob es stimmt – bei
   Aufgaben mit mehreren Lücken war vorher nur eine Gesamtmeldung zu sehen. */
.field-input.field-ok,
select.choice.field-ok {
  border-color: var(--success);
  background: var(--success-soft);
}
.field-input.field-bad,
select.choice.field-bad {
  border-color: var(--danger);
  background: var(--danger-soft);
}

/* ---------- Sortier-Aufgabe: Touch-Bedienung ---------- */
.sort-item {
  transition: box-shadow 0.15s ease, opacity 0.15s ease, background 0.4s ease;
}
.sort-item.dragging {
  opacity: 0.9;
  position: relative;
  z-index: 20;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  border-color: var(--accent-primary);
}
.sort-item.just-moved { background: var(--accent-primary-soft); }
/* Vollwertiges Touch-Ziel: vorher war der Griff nur gut 20 px groß. */
.sort-handle {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  border-radius: 8px;
  user-select: none;
}
.sort-handle:hover { background: var(--accent-primary-soft); }
.sort-moves {
  flex: none;
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
}
.sort-move {
  appearance: none;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 7px;
  width: 44px;
  height: 30px;
  font-size: 0.72rem;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.sort-move:hover:not(:disabled) {
  border-color: var(--accent-primary);
  background: var(--accent-primary-soft);
}
.sort-move:disabled { opacity: 0.3; cursor: default; }

/* ---------- Nebenrechnungen: größerer, umschaltbarer Block ---------- */
.scratch-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.scratch-head h3 { margin: 0; }
.scratch-spacer { flex: 1 1 auto; }
.scratch-panel .drawpad-canvas { height: 300px; }
.scratch-panel.big {
  width: min(1000px, calc(100vw - 24px));
  right: 12px;
  bottom: 12px;
}
.scratch-panel.big .drawpad-canvas { height: min(62vh, 620px); }

/* ---------- Hinweis nach dem Wiederherstellen von Eingaben ---------- */
.restore-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.88rem;
}
.restore-bar span { flex: 1 1 auto; }
.linklike {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent-primary);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}
</style>

<body>
<div id="wbRoot"></div>
<script>/*
 * Baukasten – gemeinsame Laufzeit-Engine
 * Wird sowohl im Baukasten (Live-Vorschau) als auch im exportierten,
 * eigenständigen Arbeitsblatt verwendet. Rein datengetrieben: kennt keine
 * konkreten Aufgaben, nur die Baustein-Konfiguration aus dem Projekt-JSON.
 */
(function (global) {
  "use strict";

  /* ---------- kleine Helfer ---------- */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#000000";
  }
  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      var args = arguments, ctx = this;
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }
  function parseNum(raw) {
    if (raw === null || raw === undefined) return NaN;
    var s = String(raw).trim().toLowerCase();
    if (s === "") return NaN;
    s = s.replace(/€/g, "").replace(/\beuro\b/g, "");
    s = s.replace(/\btagen\b/g, "").replace(/\btage\b/g, "").replace(/\btag\b/g, "");
    s = s.replace(/%/g, "").replace(/\s+/g, "");
    if (s.indexOf(",") !== -1 && s.indexOf(".") !== -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (s.indexOf(",") !== -1) {

    // daneben, Schüler tippen sie aber oft trotzdem mit ("2,5 m", "18 cm²").

  }
  function numEq(a, b, eps) {
    eps = eps === undefined ? 1e-6 : eps;
    return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < eps;
  }
  function formatEuro(v) { return Math.round(v).toLocaleString("de-DE"); }
  function formatDE(num, decimals) { return num.toFixed(decimals).replace(".", ","); }
  // Deterministisch "zufällige" Reihenfolge aus einer Text-Seed (z. B. der
  // Baustein-id) – dieselbe Sortier-Aufgabe zeigt bei jedem Neu-Rendern
  // (Vorschau-Refresh, PDF-Export) dieselbe Ausgangsreihenfolge, verschiedene
  // Bausteine bekommen unterschiedliche Mischungen.
  function hashStr(s) {
    var h = 0;

  function mulberry32(seed) {

    // Elementen nicht unwahrscheinlich): einmal fest vertauschen, damit die
    // Aufgabe nicht bereits gelöst startet.
    if (a.length > 1 && a.every(function (x, i2) { return x === arr[i2]; })) {

  var alleZeichenflaechen = [];

  function nurStift() {
    if (stiftModus === "stift") return true;
    if (stiftModus === "alle") return false;

  }

    stiftModus = (modus === "stift" || modus === "alle") ? modus : "auto";
    aktualisiereZeigerverhalten();
  }

  function merkeStift() {
    if (stiftGesehen) return;
    stiftGesehen = true;
    aktualisiereZeigerverhalten();
  }

  function createDrawPad(canvas) {

    var drawing = false, current = null, strokes = [];

      canvas.height = Math.max(1, Math.round(rect.height * dpr));

      // Im Stift-Betrieb wird Finger-Eingabe durchgelassen (= die Seite
      // scrollt), statt einen ungewollten Strich zu hinterlassen.
      if (e.pointerType !== "pen" && nurStift()) {
        if (!stiftHinweisGezeigt) {
          stiftHinweisGezeigt = true;
          showToast("Zum Schreiben den Stift benutzen – mit dem Finger kannst du scrollen.");
        }
        return;

      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      current = {
        color: color,
        width: radiert ? RADIER_BREITE : lineWidth,
        erase: radiert,

    });

      if (!drawing) return;
      current.points.push(posFromEvent(e));
      redraw();
      e.preventDefault();

    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("pointerleave", function () { if (drawing) endStroke(); });

    requestAnimationFrame(resize);

    var onChange = null;
    function changed() { if (onChange) { try { onChange(); } catch (e) {} } }
    canvas.addEventListener("pointerup", changed);
    canvas.addEventListener("pointercancel", changed);

    alleZeichenflaechen.push(canvas);
    aktualisiereZeigerverhalten();

    return {
      setColor: function (c) { color = c; radiert = false; },
      setWidth: function (w) { lineWidth = w; radiert = false; },
      setEraser: function (an) { radiert = !!an; },
      isEraser: function () { return radiert; },
      undo: function () { strokes.pop(); redraw(); changed(); },
      clear: function () { strokes = []; redraw(); changed(); },
      isEmpty: function () { return strokes.length === 0; },
      resize: resize,
      // Für das Zwischenspeichern: Striche auslesen und wieder einsetzen.
      getStrokes: function () { return strokes; },
      setStrokes: function (arr) {

      },
      setOnChange: function (fn) { onChange = fn; }
    };
  }

  function mkToolBtn(label, title, onClick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn btn-sm btn-ghost";

  }

  function wireDrawpad(wrapEl) {

      { name: "Tinte", v: getCssVar("--ink") },
      { name: "Blau (Modell A)", v: getCssVar("--accent-linear") },
      { name: "Orange (Modell B)", v: getCssVar("--accent-exp") },
      { name: "Rot", v: getCssVar("--danger") }

    toolbar.appendChild(dickBtn);
    toolbar.appendChild(radierBtn);
    toolbar.appendChild(mkToolBtn("↺ Rückgängig", "Letzten Strich entfernen", function () { pad.undo(); }));

    toolbar.querySelectorAll(".color-dot").forEach(function (b) {
      b.addEventListener("click", zeigeWerkzeug);

    // Für das Zwischenspeichern merken, welche Zeichenfläche zu welchem
    // Canvas gehört – die Striche werden nach einem Neuladen wiederhergestellt.
    if (canvas.id) {
      padRegistry[canvas.id] = pad;
      pad.setOnChange(scheduleSave);
    }
    return pad;
  }

  /* ---------- Parameter-Graph ---------- */
  function drawGrowthGraph(canvas, opts) {
    var maxDays = opts.maxDays, series = opts.series;

    canvas.height = Math.max(1, Math.round(rect.height * dpr));

    var padL = 52, padR = 16, padT = 16, padB = 34;

    for (var n = 0; n <= maxDays; n++) days.push(n);
    var maxY = 1;
    var seriesVals = series.map(function (s) {
      var vals = days.map(function (n) {

      });
      maxY = Math.max(maxY, Math.max.apply(null, vals));
      var copy = {}; for (var k in s) copy[k] = s[k];

    });
    var niceMax = niceCeil(maxY);

    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft");

    ctx.font = "11px 'JetBrains Mono', monospace";

      ctx.fillStyle = inkSoft; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(formatEuro(v), padL - 8, y);
    }
    var xTickStep = maxDays <= 8 ? 1 : (maxDays <= 14 ? 2 : 3);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (var nx = 0; nx <= maxDays; nx += xTickStep) {
      var x = xFor(nx);
      ctx.strokeStyle = line;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB + 4); ctx.stroke();
      ctx.fillStyle = inkSoft; ctx.fillText(String(nx), x, H - padB + 8);
    }

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Betrag in €", 0, 0);
    ctx.restore();

    ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB);
    ctx.stroke();

    seriesVals.forEach(function (s) {
      ctx.strokeStyle = s.color; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
      ctx.beginPath();
      days.forEach(function (n, i) {
        var x = xFor(n), y = yFor(s.vals[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = s.color;
      days.forEach(function (n, i) {

  }

  /* ---------- Diagramm-Baustein: Balken/Linie/Kreis ----------
   * opts: { chartType: 'bar'|'line'|'pie', data: [{label,value,color}],
   *         xLabel, yLabel, unit, showValues }. Farben kommen bereits
   * aufgelöst (getCssVar) vom Aufrufer, damit diese Funktion themen-

  function diagramValueLabel(v, unit) {
    var s = Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : formatDE(v, 1);

  }
  function truncateLabel(s, max) {

    return s.length > max ? s.slice(0, max - 1) + "…" : s;
  }
  function drawPieChart(ctx, W, H, data, opts, ink) {
    var total = data.reduce(function (s, d) { return s + Math.max(0, Number(d.value) || 0); }, 0);

  /* ---------- Sicherer Funktions-Parser (kein eval/Function) ----------

  function tokenizeExpr(str) {

  function drawCoordinatePlane(canvas, opts) {
    var ctx = canvas.getContext("2d");

    var yStep = opts.yStep > 0 ? opts.yStep : (yMax - yMin) / 10 || 1;

    // damit die Gitterkästchen quadratisch sind UND die volle Breite ausfüllen
    // (kein Leerraum links/rechts wie beim reinen Zentrieren in fester Höhe).

    // Breite gewählt, dieser Schritt fängt nur Rundungsdifferenzen ab).

    ctx.fillStyle = ink;

    // Funktionsgraphen – auf das Gitter-Rechteck geclippt, damit Kurven, die

        else { ctx.lineTo(px, py); }

  /* ---------- Fortschritt / Feedback ---------- */
  function setFeedback(feedbackId, ok, msg) {
    var fb = el(feedbackId);
    if (!fb) return;
    fb.className = "feedback show " + (ok ? "ok" : "bad");
    fb.textContent = (ok ? "✓ " : "✗ ") + msg;
  }

  var hintState = {};
  function wireHintButton(btn, hintAreaId, hints) {
    var key = hintAreaId;
    hintState[key] = 0;
    btn.addEventListener("click", function () {
      var area = el(hintAreaId);
      if (!area) return;
      if (hintState[key] < hints.length) {
        var p = document.createElement("p");
        p.textContent = "Tipp " + (hintState[key] + 1) + ": " + hints[hintState[key]];
        area.appendChild(p);
        area.classList.add("show");
        hintState[key]++;
      }
      if (hintState[key] >= hints.length) {
        btn.disabled = true;
        btn.textContent = "Keine weiteren Tipps";
      }
    });
  }

  function wireRevealButton(btn, targetId) {
    btn.addEventListener("click", function () {
      var area = el(targetId);
      if (!area) return;
      var showing = area.classList.toggle("show");
      btn.textContent = showing ? "Musterlösung verbergen" : "Musterlösung anzeigen";
    });
  }

  /* ---------- Aufgaben-Prüfung (generisch, feld-basiert) ---------- */
  function fieldElId(blockId, fieldId) { return "wb-" + blockId + "-f-" + fieldId; }

  // Markiert ein einzelnes Feld grün bzw. rot. Die Markierung verschwindet,
  // sobald der Schüler das Feld wieder anfasst – sonst bliebe ein rotes Feld
  // auch dann rot stehen, wenn die Antwort längst korrigiert ist.
  function markField(e, ok) {
    e.classList.remove("field-ok", "field-bad");
    e.classList.add(ok ? "field-ok" : "field-bad");
    if (!e.dataset.markWired) {
      e.dataset.markWired = "1";
      var clear = function () { e.classList.remove("field-ok", "field-bad"); };
      e.addEventListener("input", clear);
      e.addEventListener("change", clear);
    }
  }

  /* Mehrere zulässige Schreibweisen pro Lücke: im Editor mit Semikolon
   * getrennt eingeben, z. B. "0,5; 1/2; ein halb". Angenommen wird, wenn die
   * Eingabe EINER Alternative entspricht – entweder als Zahl (Komma/Punkt und
   * Einheiten werden dabei wie bisher toleriert) oder als Text (Groß-/
   * Kleinschreibung und Leerzeichen egal). Die ERSTE Alternative ist die
   * Musterlösung, die auf dem Lösungsblatt erscheint. */
  function acceptedValues(f) {
    return String(f.expected == null ? "" : f.expected)
      .split(";")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s !== ""; });
  }

  function normText(s) {
    return String(s).toLowerCase().replace(/\s+/g, "").replace(/,/g, ".");
  }

  function answerMatches(f, eingabe) {
    if (String(eingabe).trim() === "") return false;
    var alts = acceptedValues(f);
    for (var i = 0; i < alts.length; i++) {
      var a = parseNum(eingabe), b = parseNum(alts[i]);
      if (numEq(a, b)) return true;
      if (normText(eingabe) === normText(alts[i])) return true;
    }
    return false;
  }

  function checkFieldsTask(blockId, fields) {
    var allOk = true, leer = 0, falsch = 0;
    fields.forEach(function (f) {
      var e = el(fieldElId(blockId, f.id));
      if (!e) { allOk = false; return; }
      var leerFeld = String(e.value).trim() === "";
      var ok = answerMatches(f, e.value);
      if (leerFeld) { ok = false; leer++; } else if (!ok) { falsch++; }
      markField(e, ok);
      if (!ok) allOk = false;
    });
    var msg;
    if (allOk) {
      msg = fields.length > 1 ? "Alle Lücken richtig." : "Richtig.";
    } else if (fields.length > 1) {
      var teile = [];
      if (falsch) teile.push(falsch === 1 ? "eine Lücke ist noch falsch" : falsch + " Lücken sind noch falsch");
      if (leer) teile.push(leer === 1 ? "eine Lücke ist leer" : leer + " Lücken sind leer");
      msg = "Rot markiert: " + teile.join(", ") + ". Grün markierte Lücken stimmen.";
    } else {
      msg = leer ? "Da fehlt noch eine Antwort." : "Noch nicht richtig – schau dir ggf. einen Tipp an.";
    }
    setFeedback("wb-" + blockId + "-fb", allOk, msg);
  }

  /* ---------- Sortier-Aufgabe: Drag&Drop-Umsortieren + Prüfung ----------
   * Rein DOM-basiert: jedes .sort-item trägt in data-key den Index, den es

   * registry.js sortTask). Prüfen liest einfach die aktuelle DOM-Reihenfolge
   * aus – funktioniert unabhängig davon, wie oft/wie umsortiert wurde, und
   * genau das erscheint auch in einem PDF-Export (Momentaufnahme). */
  /* ---------- Eingaben auf dem Gerät zwischenspeichern ----------
   * Ein versehentliches Neuladen – auf dem Tablet schnell passiert – hat
   * bisher alles gelöscht. Eingaben, Sortierreihenfolge und Zeichnungen
   * liegen jetzt im localStorage DES GERÄTS. Nichts wird gesendet, nichts
   * verlässt das Tablet, es gibt keinerlei Auswertung.
   * Bewusst NICHT gespeichert: die Prüf-Rückmeldungen – nach dem Neuladen
   * soll man selbst noch einmal auf „Prüfen" tippen. */
  var padRegistry = {};
  var autosaveKey = null;
  var autosaveTimer = null;

  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function collectState(mitZeichnungen) {
    var s = { v: 1, fields: {}, sort: {}, pads: {} };
    Array.prototype.forEach.call(document.querySelectorAll(".field-input, select.choice"), function (e) {
      if (e.id && String(e.value) !== "") s.fields[e.id] = e.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".sort-list[id]"), function (c) {
      s.sort[c.id] = Array.prototype.map.call(c.querySelectorAll(".sort-item"), function (it) {
        return it.dataset.key;
      });
    });
    if (global.__wbTrees) {
      s.trees = {};
      Object.keys(global.__wbTrees).forEach(function (id) { s.trees[id] = global.__wbTrees[id].get(); });
    }
    if (mitZeichnungen !== false) {
      Object.keys(padRegistry).forEach(function (id) {
        var st = padRegistry[id].getStrokes();
        if (st && st.length) s.pads[id] = st;
      });
    }
    return s;
  }

  function applyState(s) {
    if (!s || s.v !== 1) return false;
    var etwas = false;
    Object.keys(s.fields || {}).forEach(function (id) {
      var e = el(id);
      if (e) { e.value = s.fields[id]; etwas = true; }
    });
    Object.keys(s.sort || {}).forEach(function (cid) {
      var c = el(cid);
      if (!c) return;
      (s.sort[cid] || []).forEach(function (k) {
        var it = c.querySelector('.sort-item[data-key="' + k + '"]');
        if (it) { c.appendChild(it); etwas = true; }
      });
      updateSortButtons(c);
    });
    Object.keys(s.trees || {}).forEach(function (id) {
      var t = global.__wbTrees && global.__wbTrees[id];
      if (t && s.trees[id] && s.trees[id].children && s.trees[id].children.length) { t.set(s.trees[id]); etwas = true; }
    });
    Object.keys(s.pads || {}).forEach(function (id) {
      var pad = padRegistry[id];
      if (pad) { pad.setStrokes(s.pads[id]); etwas = true; }
    });
    return etwas;
  }

  function saveNow() {
    if (!autosaveKey) return;
    try {
      var json = JSON.stringify(collectState(true));
      // Zeichnungen können groß werden; notfalls lieber die Eingaben retten.
      if (json.length > 2000000) json = JSON.stringify(collectState(false));
      storeSet(autosaveKey, json);
    } catch (e) {}
  }

  function scheduleSave() {
    if (!autosaveKey) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(saveNow, 400);
  }

  function clearSaved() {
    if (autosaveKey) storeDel(autosaveKey);
    // Schlüssel abschalten und laufende Speicherung abbrechen: sonst schreibt
    // der pagehide-/beforeunload-Haken beim Neuladen sofort alles zurück und
    // „Neu anfangen" hätte keine Wirkung.
    autosaveKey = null;
    clearTimeout(autosaveTimer);
    location.reload();
  }

  function mkResetBtn(text, frage, cls) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = text;
    b.addEventListener("click", function () {
      if (confirm(frage)) clearSaved();
    });
    return b;
  }

  function showRestoreBar() {
    var root = el("wbWorksheet");
    if (!root) return;
    var bar = document.createElement("div");
    bar.className = "restore-bar no-print";
    var txt = document.createElement("span");
    txt.textContent = "Deine Eingaben von vorhin wurden wiederhergestellt.";
    bar.appendChild(txt);
    bar.appendChild(mkResetBtn("Neu anfangen",
      "Alle deine Eingaben auf diesem Blatt löschen und neu anfangen?", "btn btn-ghost btn-sm"));
    root.insertBefore(bar, root.firstChild);
  }

  function wireAutosave(project) {
    // Auf dem Lösungsblatt gibt es nichts zu retten, und in der Live-Vorschau
    // des Baukastens würde Zwischenspeichern nur die Ansicht der Lehrkraft
    // mit alten Probe-Eingaben verunreinigen.
    if (!project || project.solutionMode || project.previewMode) return;
    if (!storeSet("wb-test", "1")) return;   // z. B. privater Modus
    storeDel("wb-test");
    autosaveKey = "baukasten:" + ((project.meta && project.meta.filename) || "arbeitsblatt");

    var raw = storeGet(autosaveKey), wieder = false;
    if (raw) { try { wieder = applyState(JSON.parse(raw)); } catch (e) {} }

    document.addEventListener("input", scheduleSave, true);
    document.addEventListener("change", scheduleSave, true);
    global.addEventListener("pagehide", saveNow);
    global.addEventListener("beforeunload", saveNow);

    if (wieder) showRestoreBar();
    var foot = document.querySelector("footer.appfoot");
    if (foot) {
      foot.appendChild(document.createTextNode(" · "));
      foot.appendChild(mkResetBtn("Eingaben auf diesem Gerät löschen",
        "Alle deine Eingaben auf diesem Blatt löschen?", "linklike"));
    }
  }

  // Ein Element um eine Position nach oben (-1) oder unten (+1) schieben.
  // Das ist der verlässliche Weg auf Geräten, auf denen Ziehen hakt.
  function moveSortItem(item, dir) {
    var container = item.parentNode;
    if (!container) return;
    if (dir < 0 && item.previousElementSibling) {
      container.insertBefore(item, item.previousElementSibling);
    } else if (dir > 0 && item.nextElementSibling) {
      container.insertBefore(item.nextElementSibling, item);
    } else {
      return;
    }
    item.classList.remove("just-moved");
    void item.offsetWidth;                 // Neustart der Hervorhebung erzwingen
    item.classList.add("just-moved");
    updateSortButtons(container);
    scheduleSave();
  }

  // Hoch/Runter am jeweiligen Rand ausgrauen, damit sichtbar ist, was geht.
  function updateSortButtons(container) {
    var items = Array.prototype.slice.call(container.querySelectorAll(".sort-item"));
    items.forEach(function (it, i) {
      var up = it.querySelector("[data-sort-up]"), dn = it.querySelector("[data-sort-down]");
      if (up) up.disabled = (i === 0);
      if (dn) dn.disabled = (i === items.length - 1);
    });
  }

  /* Umsortieren per Ziehen. Gegenüber der ersten Fassung überarbeitet, weil es
   * auf Tablets schlecht lief:
   *  - das gezogene Element folgt jetzt sichtbar dem Finger (vorher bewegte
   *    sich nichts, man sah nur eine Markierung und hielt es für kaputt),
   *  - die Seite scrollt automatisch mit, wenn man an den Bildschirmrand zieht,
   *  - der Ziehgriff ist ein vollwertiges Touch-Ziel (siehe worksheet.css),
   *  - und über die Hoch/Runter-Knöpfe geht alles auch ganz ohne Ziehen. */
  function wireSortList(container) {
    if (!container) return;

    Array.prototype.forEach.call(container.querySelectorAll("[data-sort-up]"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        moveSortItem(btn.closest(".sort-item"), -1);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll("[data-sort-down]"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        moveSortItem(btn.closest(".sort-item"), 1);
      });
    });
    updateSortButtons(container);

    var drag = null;

    function clearHighlights() {
      Array.prototype.forEach.call(container.querySelectorAll(".sort-item"), function (it) {
        it.classList.remove("drag-over-top", "drag-over-bottom");
      });
    }

    function autoScroll(clientY) {
      var rand = 70;
      if (clientY < rand) global.scrollBy(0, -Math.max(6, (rand - clientY) / 3));
      else if (clientY > global.innerHeight - rand) {
        global.scrollBy(0, Math.max(6, (clientY - (global.innerHeight - rand)) / 3));
      }
    }

    Array.prototype.forEach.call(container.querySelectorAll(".sort-item"), function (item) {
      var handle = item.querySelector(".sort-handle");
      if (!handle) return;

      handle.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        drag = { id: e.pointerId, item: item, startY: e.clientY };
        item.classList.add("dragging");
      });

      handle.addEventListener("pointermove", function (e) {
        if (!drag || drag.item !== item || e.pointerId !== drag.id) return;
        e.preventDefault();
        item.style.transform = "translateY(" + (e.clientY - drag.startY) + "px)";
        autoScroll(e.clientY);
        // Das gezogene Element liegt unter dem Finger – für die Trefferabfrage
        // kurz durchlässig schalten, sonst trifft elementFromPoint nur es selbst.
        item.style.pointerEvents = "none";
        var overEl = document.elementFromPoint(e.clientX, e.clientY);
        item.style.pointerEvents = "";
        var overItem = overEl && overEl.closest ? overEl.closest(".sort-item") : null;
        clearHighlights();
        if (overItem && overItem !== item && container.contains(overItem)) {
          var rect = overItem.getBoundingClientRect();
          var before = (e.clientY - rect.top) < rect.height / 2;
          overItem.classList.add(before ? "drag-over-top" : "drag-over-bottom");
          drag.overKey = overItem.dataset.key;
          drag.before = before;
        } else {
          drag.overKey = undefined;
        }
      });

      function finish(e) {
        if (!drag || drag.item !== item || e.pointerId !== drag.id) return;
        item.classList.remove("dragging");
        item.style.transform = "";
        clearHighlights();
        if (drag.overKey !== undefined) {
          var overItem = container.querySelector('.sort-item[data-key="' + drag.overKey + '"]');
          if (overItem && overItem !== item) {
            if (drag.before) container.insertBefore(item, overItem);
            else container.insertBefore(item, overItem.nextSibling);
            updateSortButtons(container);
            scheduleSave();
          }
        }
        drag = null;
      }
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  function checkSortTask(uid) {
    var container = el("wb-" + uid + "-sort");
    if (!container) return;
    var items = Array.prototype.slice.call(container.querySelectorAll(".sort-item"));
    var ok = items.length > 0 && items.every(function (it, i) { return Number(it.dataset.key) === i; });
    setFeedback("wb-" + uid + "-fb", ok, ok ? "Richtig einsortiert." : "Noch nicht in der richtigen Reihenfolge – vertausche zwei Elemente.");
  }

  /* ---------- Vorlagen-Rendering ({{id}} -> Eingabefeld) ---------- */
  function renderTemplate(template, fields, blockId) {
    var byId = {};
    (fields || []).forEach(function (f) { byId[f.id] = f; });
    return String(template || "").replace(/\{\{(\w+)\}\}/g, function (m, id) {
      var f = byId[id];
      if (!f) return m;
      var elId = fieldElId(blockId, id);
      if (f.type === "choice") {
        var opts = (f.options || []).map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>";
        }).join("");
        return '<select class="choice" id="' + elId + '"><option value="">wähle…</option>' + opts + "</select>";
      }
      // Ohne ausdrücklich gesetzte Breite richtet sich das Feld nach der Länge
      // des erwarteten Werts – so muss man die Breite nie von Hand einstellen,
      // ältere Projekte mit explizitem width behalten aber ihren Wert.
      var ersteAlt = String(f.expected == null ? "" : f.expected).split(";")[0].trim();
      var width = f.width || Math.max(64, Math.min(230, ersteAlt.length * 11 + 40));
      return '<input type="text" inputmode="decimal" class="field-input" style="width:' + width + 'px;" id="' + elId + '">' +
        (f.unit ? '<span class="fu-label">' + esc(f.unit) + "</span>" : "");
    });
  }

  // Lösungsblatt-Variante derselben Vorlage: statt leerer Eingabefelder wird
  // der erwartete Wert direkt als hervorgehobener Text eingesetzt (bei
  // Auswahlfeldern das LABEL der richtigen Option, nicht deren technischer
  // Wert – im Schülerblatt sieht man ja auch nur die Labels).
  function renderTemplateSolution(template, fields) {
    var byId = {};
    (fields || []).forEach(function (f) { byId[f.id] = f; });
    return String(template || "").replace(/\{\{(\w+)\}\}/g, function (m, id) {
      var f = byId[id];
      if (!f) return m;
      var txt;
      var erste = acceptedValues(f)[0];
      if (erste === undefined) erste = "";
      if (f.type === "choice") {
        var hit = (f.options || []).filter(function (o) { return String(o.value) === String(erste); })[0];
        txt = hit ? hit.label : String(erste);
      } else {
        // Deutsche Schreibweise: Dezimalkomma und typografisches Minus (U+2212).
        txt = String(erste).replace(".", ",").replace(/^-/, "−");
      }
      return '<span class="field-solution">' + esc(txt) + "</span>" +
        (f.unit ? '<span class="fu-label">' + esc(f.unit) + "</span>" : "");
    });
  }

  /* ---------- PDF-Export: generische, blockweise Paginierung ---------- */
  // A4 in PDF-Punkten (1pt = 1/72 Zoll) sowie die im Export verwendeten Ränder/
  // Abstände – identisch zu den Werten in exportPdf() weiter unten. Wird hier
  // zusätzlich als reine Konstante gehalten, damit der Seitenumbruch-Schätzer
  // (computePageBreakOffsets) ohne jsPDF-Instanz auskommt.
  var PDF_LAYOUT = { marginX: 26, marginY: 26, gap: 10, pageW: 595.28, pageH: 841.89 };

  // Reine, messungsbasierte Nachbildung der Paginierungs-Entscheidungen aus
  // exportPdf() weiter unten (bewusst dupliziert statt geteilt, damit am
  // bereits getesteten PDF-Export nichts verändert wird – bei Änderungen an
  // der Paginierungslogik dort bitte auch hier nachziehen).
  // heights: Array von Höhen (in pt) je Baustein/Zeile; keepFlags: paralleles
  // Array von keepWithNext-Flags; forceFlags: paralleles Array – true heißt
  // „vor diesem Baustein einen Seitenumbruch erzwingen" (Seitenumbruch-
  // Baustein). Gibt eine Liste von Umbruch-Punkten zurück:
  // { itemIndex, offset } – ein Seitenumbruch fällt vor Baustein itemIndex,
  // offset pt von dessen Oberkante entfernt (>0 nur bei überlangen, in
  // mehrere Seiten zerschnittenen Bausteinen).
  function computePagination(heights, keepFlags, forceFlags, layout) {
    layout = layout || PDF_LAYOUT;
    var marginY = layout.marginY, gap = layout.gap;
    var usableH = layout.pageH - 2 * marginY;
    var n = heights.length;
    var breaks = [];
    var cursorY = marginY, isPageEmpty = true;
    for (var i = 0; i < n; i++) {
      var imgH = heights[i];
      if (forceFlags && forceFlags[i] && !isPageEmpty) {
        breaks.push({ itemIndex: i, offset: 0 });
        cursorY = marginY; isPageEmpty = true;
      }
      if (imgH > usableH + 0.5) {
        if (!isPageEmpty) { breaks.push({ itemIndex: i, offset: 0 }); cursorY = marginY; isPageEmpty = true; }
        var renderedH = 0, first = true, lastSliceH = 0;
        while (renderedH < imgH - 0.5) {
          if (!first) breaks.push({ itemIndex: i, offset: renderedH });
          var sliceH = Math.min(usableH, imgH - renderedH);
          renderedH += sliceH; lastSliceH = sliceH; first = false;
        }
        cursorY = marginY + lastSliceH + gap;
        isPageEmpty = false;
        continue;
      }
      var minNeeded = imgH;
      var keepsWithNext = keepFlags[i] && (i + 1 < n) && heights[i + 1] <= usableH + 0.5;
      if (keepsWithNext) minNeeded = imgH + gap + heights[i + 1];
      var fits = isPageEmpty || (cursorY + minNeeded <= marginY + usableH);
      if (!fits && minNeeded > usableH + 0.5) fits = cursorY + imgH <= marginY + usableH;
      if (!fits) { breaks.push({ itemIndex: i, offset: 0 }); cursorY = marginY; isPageEmpty = true; }
      cursorY += imgH + gap; isPageEmpty = false;
    }
    return breaks;
  }

  // Misst die aktuell gerenderten Bausteine/Zeilen im DOM (kein html2canvas –
  // rein getBoundingClientRect) und rechnet ihre On-Screen-Pixelhöhen über
  // einen konstanten Skalierungsfaktor (PDF-nutzbare Breite ÷ On-Screen-
  // Breite) in PDF-Punkte um. Damit lässt sich dieselbe Paginierung wie beim
  // echten Export "live" schätzen, ohne dass gerastert werden muss.
  function computePageBreakOffsets(rootId) {
    var root = el(rootId);
    if (!root) return [];
    var printItems = collectPrintItems(rootId);
    if (!printItems.length) return [];
    var containerRect = root.getBoundingClientRect();
    var onScreenW = containerRect.width;
    if (onScreenW < 1) return [];
    var usableW = PDF_LAYOUT.pageW - 2 * PDF_LAYOUT.marginX;
    var k = usableW / onScreenW; // pt pro On-Screen-Pixel
    var heights = [], keepFlags = [], forceFlags = [], tops = [];
    printItems.forEach(function (it) {
      var r = it.el.getBoundingClientRect();
      heights.push(r.height * k);
      keepFlags.push(it.keepWithNext);
      forceFlags.push(it.forceBreak);
      tops.push(r.top - containerRect.top);
    });
    var breaks = computePagination(heights, keepFlags, forceFlags, PDF_LAYOUT);
    return breaks.map(function (b) {
      return tops[b.itemIndex] + b.offset / k;
    });
  }

  // Blendet gestrichelte Seitenumbruch-Linien (+ "Seite N"-Etikett) direkt in
  // die Live-Vorschau ein, an genau den Y-Positionen, an denen der PDF-Export
  // vermutlich eine neue Seite beginnen würde. Rein informativ (no-print),
  // wird nach jedem Re-Render und bei Resize neu berechnet.
  function renderPageBreakOverlays(rootId) {
    var root = el(rootId);
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll(":scope > .wb-pagebreak-line"), function (n) { n.remove(); });
    var offsets = computePageBreakOffsets(rootId);
    offsets.forEach(function (y, idx) {
      var line = document.createElement("div");
      line.className = "wb-pagebreak-line no-print";
      line.style.top = Math.round(y) + "px";
      line.innerHTML = '<span class="wb-pagebreak-label">✂ Seite ' + (idx + 2) + "</span>";
      root.appendChild(line);
    });
  }

  function collectPrintBlocks(rootId) {
    var root = el(rootId);
    if (!root) return [];
    // .wb-block direkt unter #wbWorksheet = Header-Karte (immer alleine).
    // .wb-row = eine Rasterzeile (1 oder mehrere nebeneinanderstehende
    // Bausteine) – wird als EINE Einheit gerastert, damit nebeneinander
    // platzierte Bausteine auch im PDF nebeneinander erscheinen.
    return Array.prototype.slice.call(root.querySelectorAll(":scope > .wb-block, :scope > .wb-row"));
  }

  // Wandelt die rohen Druckeinheiten in die tatsächlich zu rasternde Liste um.
  // Eine Zeile, die nur den Seitenumbruch-Baustein enthält (data-force-break),
  // wird selbst NICHT gerastert – sie setzt stattdessen das forceBreak-Flag
  // der nachfolgenden Einheit, vor der dann eine neue Seite beginnt.
  function collectPrintItems(rootId) {
    var out = [];
    var pendingBreak = false;
    collectPrintBlocks(rootId).forEach(function (elm) {
      if (elm.dataset.forceBreak === "true") { pendingBreak = true; return; }
      out.push({ el: elm, keepWithNext: elm.dataset.keepWithNext === "true", forceBreak: pendingBreak });
      pendingBreak = false;
    });
    return out;
  }

  function addSlicedImage(pdf, canvas, x, marginY, imgW, usableH, pageH) {
    var totalImgH = (canvas.height * imgW) / canvas.width;
    var pxPerPt = canvas.height / totalImgH;
    var renderedH = 0, first = true, lastSliceH = 0;
    while (renderedH < totalImgH - 0.5) {
      if (!first) pdf.addPage();
      var availH = first ? usableH : (pageH - 2 * marginY);
      var sliceH = Math.min(availH, totalImgH - renderedH);
      var srcY = Math.round(renderedH * pxPerPt);
      var srcH = Math.round(sliceH * pxPerPt);
      var sliceCanvas = document.createElement("canvas");
      sliceCanvas.width = canvas.width; sliceCanvas.height = srcH;
      sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
      pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.92), "JPEG", x, marginY, imgW, sliceH);
      renderedH += sliceH; lastSliceH = sliceH; first = false;
    }
    return lastSliceH;
  }

  async function offerDownload(blob, filename) {
    if (global.claude && typeof global.claude.use === "function") {
      try {
        var downloads = await global.claude.use("downloads");
        if (downloads) {
          await downloads.save({ filename: filename, data: blob });
          showToast("PDF gespeichert.");
          return;
        }
      } catch (err) {
        showToast("Speichern hier nicht möglich. Nutze die eigenständige Datei, um zu speichern.");
        return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    showToast("PDF wird heruntergeladen.");
  }

  // Baut das PDF und gibt es als Blob zurück, OHNE es herunterzuladen.
  // Getrennt von exportPdf(), damit auch der Baukasten selbst ein PDF
  // erzeugen kann (er rendert das Arbeitsblatt in ein verstecktes iframe und
  // holt sich den Blob hier ab, um ihn über seinen eigenen Download-Pfad zu
  // speichern – nur der kennt die claude.use("downloads")-Fähigkeit).
  // Versionen wie die eingebetteten Kopien – bei einem Austausch hier mitziehen.
  var PDF_CDN = [
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
  ];

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("Konnte " + src + " nicht laden")); };
      document.head.appendChild(s);
    });
  }

  /* jsPDF und html2canvas werden erst beim ersten PDF-Export bereitgestellt –
   * nie beim bloßen Öffnen des Arbeitsblatts. Zwei Wege, je nach Exportfassung:
   *  - vollständige Fassung: die Bibliotheken liegen als text/plain-Halter im
   *    Dokument und werden hier ausgewertet. Funktioniert ohne Internet.
   *  - schlanke Fassung: die Halter fehlen (Datei ~150 statt ~700 KB), die
   *    Bibliotheken kommen beim ersten Klick aus dem Netz.
   * In beiden Fällen bleibt der PDF-Knopf für die Schüler erhalten. */
  async function ensurePdfLibs() {
    if (global.jspdf && global.html2canvas) return;
    ["src-jspdf", "src-html2canvas"].forEach(function (id) {
      var holder = el(id);
      if (!holder) return;
      try { (0, eval)(holder.textContent); } catch (err) { console.error("Lade " + id + ":", err); }
    });
    if (global.jspdf && global.html2canvas) return;
    for (var i = 0; i < PDF_CDN.length; i++) await loadScript(PDF_CDN[i]);
  }

  async function buildPdfBlob(rootId) {
    await ensurePdfLibs();
    if (!global.jspdf || !global.html2canvas) throw new Error("PDF-LIBS");
    document.body.classList.add("exporting");

    merksatz: {
      label: "Merksatz", icon: "💡", group: "inhalt",
      defaultConfig: function () { return { variant: "linear", label: "Merke", html: "Wichtiger Merksatz.", gateHeading: "", gateAnswer: "" }; },
      render: function (c, uid, ctx) {
        var cls = "merksatz" + (c.variant === "exp" ? " merksatz-exp" : (c.variant === "neutral" ? " merksatz-neutral" : ""));
        var box = '<div class="' + cls + '"><div class="label">' + esc(c.label) + "</div>" + autoParagraph(c.html) + "</div>";
        var gh = String(c.gateHeading || "");
        if (!gh || gh.indexOf("{{}}") < 0 || !String(c.gateAnswer || "").trim()) return box;
        var solution = !!(ctx && ctx.solution), preview = !!(ctx && ctx.preview);
        var first = String(c.gateAnswer).split(";")[0].trim();
        var longest = String(c.gateAnswer).split(";").reduce(function (m, x) { return Math.max(m, x.trim().length); }, 0);
        var parts = gh.split("{{}}");
        var gap = solution ? '<span class="field-solution">' + esc(first) + "</span>"
          : '<input type="text" class="field-input merk-gate-in" id="wb-' + uid + '-gate" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke in der Überschrift" style="width:calc(' + Math.max(6, longest + 1) + 'ch + 34px)">';
        var out = MERKGATE_CSS + '<div class="merk-gate-head">' + esc(parts[0]) + gap + esc(parts.slice(1).join("")) + "</div>";
        if (solution || preview) return out + box;
        return out + '<div class="merk-gate-fb no-print" id="wb-' + uid + '-gatefb" hidden></div>' +
          '<div class="merk-gate-body" id="wb-' + uid + '-gatebody">' + box + "</div>";
      },
      mount: function (c, uid) {
        var inp = E.el("wb-" + uid + "-gate"), body = E.el("wb-" + uid + "-gatebody"), fb = E.el("wb-" + uid + "-gatefb");
        if (!inp || !body) return;
        function norm(s) {
          return String(s || "").trim().toLowerCase().replace(/[.,:;!?„“"']/g, "").replace(/\s+/g, " ")
            .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
        }
        var answers = String(c.gateAnswer).split(";").map(norm).filter(Boolean);
        var first = String(c.gateAnswer).split(";")[0].trim();
        var open = false, tries = 0;
        function check(fromUser) {
          if (open) return;
          var v = norm(inp.value);
          if (answers.indexOf(v) >= 0) {
            open = true;
            body.classList.add("open");
            inp.classList.add("correct");
            if (fb) fb.style.display = "none";
            return;
          }
          if (fromUser && v) {
            tries++;
            if (fb) fb.hidden = false;
            if (fb) fb.textContent = "✗ Das passt noch nicht.";
          }
        }
        inp.addEventListener("input", function () { check(false); });
        inp.addEventListener("change", function () { check(true); });
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(true); } });
        // nach dem Wiederherstellen gespeicherter Eingaben (läuft nach mount)
        setTimeout(function () { check(false); }, 30);
        setTimeout(function () { check(false); }, 400);
      },
      editor: function (c, api) {
        var d = document.createElement("div");
        d.appendChild(field("Farbe", selectInput(c.variant, [
          { value: "linear", label: "Blau (linear)" }, { value: "exp", label: "Orange (exponentiell)" }, { value: "neutral", label: "Neutral" }
        ], function (v) { api.update({ variant: v }); })));
        d.appendChild(field("Titel", withSymbols(textInput(c.label, function (v) { api.update({ label: v }); }))));
        d.appendChild(field("Text (HTML erlaubt, z. B. <span class=\"formula\">…</span> für Formeln)",
          withSymbols(textArea(c.html, function (v) { api.update({ html: v }); }, 4))));
        d.appendChild(field("Zwischenüberschrift mit Lücke (optional; {{}} markiert die Lücke, z. B. „{{}} Zufallsexperimente“). Der Merksatz erscheint erst, wenn die Lücke richtig gefüllt ist.",
          withSymbols(textInput(c.gateHeading || "", function (v) { api.update({ gateHeading: v }); }))));
        d.appendChild(field("Richtiges Wort für die Lücke (Alternativen mit ; trennen; Groß-/Kleinschreibung egal)",
          withSymbols(textInput(c.gateAnswer || "", function (v) { api.update({ gateAnswer: v }); }))));
        return d;
      }
    },

          starsHtml(c.stars) + "</div>";

          // Auf dem Lösungsblatt keine leere Schreibfläche: sie würde die

        }

        // Vorlage + „Lücke einfügen“: der Knopf setzt den Platzhalter an der

          var tpl = String(c.template || "");

          var defined = (c.fields || []).map(function (f) { return f.id; });

          var msgs = [];
          if (missing.length) msgs.push("Zu {{" + missing.join("}}, {{") + "}} gibt es kein Feld – die Lücke bleibt als Text stehen.");
          if (unused.length) msgs.push("Feld „" + unused.join("“, „") + "“ kommt in der Vorlage nicht vor und wird nicht angezeigt.");
          if (!tpl.trim() && defined.length) msgs.push("Es gibt Felder, aber keine Vorlage – ohne Vorlagentext erscheint nichts.");

              g.appendChild(textInput(f.unit, function (v) { update({ unit: v }); }, "Einheit (z. B. €)"));
              // Feldbreite bewusst kein Eingabefeld mehr: sie ergibt sich
