<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0 Wiederholung Jahrgangsstufe 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>/*
 * worksheet.css – gemeinsames visuelles Erscheinungsbild der Arbeitsblätter.
 * Wird identisch verwendet in: Baukasten-Vorschau, exportiertes Arbeitsblatt.
 * Basiert auf dem Hausstil des Wachstum-Prototyps (top.html).
 */
:root {
  --paper: #F4F6F5;
  --paper-raised: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #566072;
  --line: #D7DEDC;
  --accent-primary: #3D5A80;
  --accent-primary-soft: #E7ECF3;
  --accent-linear: #2E7D8C;
  --accent-linear-soft: #DCEEF0;
  --accent-exp: #C85A22;
  --accent-exp-soft: #FBE7DA;
  --success: #2F9E44;
  --success-soft: #E3F6E6;
  --danger: #C1443C;
  --danger-soft: #FBEAE8;
  --shadow: 0 1px 2px rgba(27,36,48,0.07), 0 6px 18px rgba(27,36,48,0.07);
  --table-line: var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181F;
    --paper-raised: #1B232C;
    --ink: #E7ECEF;
    --ink-soft: #A7B2BD;
    --line: #2B3542;
    --accent-primary: #8FADD6;
    --accent-primary-soft: #243347;
    --accent-linear: #6BC4CF;
    --accent-linear-soft: #173236;
    --accent-exp: #F0935B;
    --accent-exp-soft: #3A2718;
    --success: #63CB85;
    --success-soft: #163A22;
    --danger: #E1685C;
    --danger-soft: #3A1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
    --table-line: rgba(255,255,255,0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181F;
  --paper-raised: #1B232C;
  --ink: #E7ECEF;
  --ink-soft: #A7B2BD;
  --line: #2B3542;
  --accent-primary: #8FADD6;
  --accent-primary-soft: #243347;
  --accent-linear: #6BC4CF;
  --accent-linear-soft: #173236;
  --accent-exp: #F0935B;
  --accent-exp-soft: #3A2718;
  --success: #63CB85;
  --success-soft: #163A22;
  --danger: #E1685C;
  --danger-soft: #3A1E1B;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: local;
  color: var(--ink);
  font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
  line-height: 1.55;
}
h1, h2, h3, .display {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  text-wrap: balance;
  margin: 0;
}
.mono, .val, input[type="text"], input[type="number"] {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent-primary); }
button { font-family: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper-raised);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 1.05rem; font-weight: 600; flex: 1 1 auto; min-width: 180px; }
.chapter-eyebrow {
  display: block;
  font-family: "Outfit", sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent-primary);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--paper-raised);
  color: var(--ink);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 8px 12px; min-height: 38px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

main { max-width: 800px; margin: 0 auto; padding: 20px 18px 80px; position: relative; }

/* Seitenumbruch-Indikator (siehe engine.js renderPageBreakOverlays): zeigt
   in der Live-Vorschau, wo der PDF-Export vermutlich eine neue Seite
   beginnen würde – rein informativ, nie Teil des Exports/Drucks. */
.wb-pagebreak-line {
  position: absolute;
  left: -4px; right: -4px; height: 0;
  border-top: 2px dashed #d6336c;
  pointer-events: none;
  z-index: 5;
}
.wb-pagebreak-label {
  position: absolute; top: -9px; right: 2px;
  background: #d6336c; color: #fff;
  font: 600 10px/1.5 var(--font-mono, "JetBrains Mono", monospace);
  padding: 1px 7px; border-radius: 4px 4px 0 0;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
@media print { .wb-pagebreak-line { display: none !important; } }

.header-card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 22px;
}
.header-card h1 { font-size: 1.6rem; }
.header-card .subtitle { color: var(--ink-soft); margin-top: 4px; font-size: 0.95rem; }
.chapter-eyebrow-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.chapter-eyebrow-row .chapter-eyebrow { margin-bottom: 0; }
.chapter-meta {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 0.8rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.phase-heading { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; }
.phase-eyebrow {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
}
.phase-eyebrow .tag {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-primary);
}
.phase-heading h2 { font-size: 1.25rem; }
.card {
  break-inside: avoid;
  page-break-inside: avoid;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }

/* Rasterzeile: bis zu 4 Einheiten (= 25/50/75/100%) nebeneinander. Ein
   Baustein-Baustein ohne eigene Breiten-Einstellung nimmt alle 4 Einheiten
   (= volle Breite) ein und verhält sich optisch wie zuvor. */
.wb-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 16px;
  align-items: start;
  margin-bottom: 14px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.wb-row > .wb-block { min-width: 0; }
/* Sicherheitsnetz nur für echte Schmalformate (Handy hochkant) – bewusst
   niedriger als die ~600–650px, die die Live-Vorschau-Spalte im Editor selbst
   schon einnimmt, sonst würde „nebeneinander“ dort nie sichtbar (und auch der
   PDF-Export aus dem Editor liefe über exakt diese Breite). */
@media (max-width: 480px) {
  .wb-row { grid-template-columns: 1fr; }
  .wb-row > .wb-block { grid-column: span 1 !important; }
}

.merksatz, .merksatz-exp, .merksatz-neutral {
  border-left: 4px solid var(--accent-primary);
  background: var(--accent-primary-soft);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 12px 0;
}
.merksatz-exp { border-left-color: var(--accent-exp); background: var(--accent-exp-soft); }
.merksatz-neutral { border-left-color: var(--ink-soft); background: var(--paper); }
.merksatz .label, .merksatz-exp .label, .merksatz-neutral .label {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-primary);
  margin-bottom: 6px;
}
.merksatz-exp .label { color: var(--accent-exp); }
.merksatz-neutral .label { color: var(--ink-soft); }
.formula {
  font-family: "JetBrains Mono", monospace;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
}
.swatch-linear, .swatch-exp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.swatch-linear::before, .swatch-exp::before {
  content: "";
  width: 12px; height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.swatch-linear::before { background: var(--accent-linear); }
.swatch-exp::before { background: var(--accent-exp); }
.swatch-linear { color: var(--accent-linear); }
.swatch-exp { color: var(--accent-exp); }

.example-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 0.92rem;
  border: 1px solid var(--table-line);
}
.example-table th, .example-table td {
  border: 1px solid var(--table-line);
  padding: 6px 10px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.example-table th { font-weight: 700; }
.example-table thead th { background: var(--accent-primary-soft); }
.example-table tbody th { background: transparent; }
/* Erste Spalte (Zeilen-Beschriftung) automatisch auf ihren Inhalt schrumpfen,
   statt sich unnötig breite Reste der 100%-Tabellenbreite zu nehmen. Die
   übrigen (Daten-)Spalten teilen sich den verbleibenden Platz gleichmäßig. */
.example-table th:first-child,
.example-table td:first-child { width: 1%; white-space: nowrap; }

.graph-block { margin: 14px 0; }
.graph-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.graph-canvas { display: block; width: 100%; height: 300px; touch-action: none; }

.coord-plane-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.coord-plane-canvas { display: block; width: 100%; height: 320px; }
.coord-plane-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 10px;
  font-size: 0.85rem;
}
.coord-plane-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.coord-plane-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.coord-plane-legend-item.coord-plane-error { color: var(--danger); }

.diagram-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}
canvas.diagram-canvas { display: block; width: 100%; height: 300px; }

.wb-image-empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink-soft);
  font-size: 0.85rem;
  background: var(--paper-raised);
}
.wb-image { margin: 14px 0; max-width: 100%; }
.wb-image img { display: block; width: 100%; height: auto; border-radius: 10px; }
.wb-image.align-center { margin-left: auto; margin-right: auto; }
.wb-image.align-left { margin-left: 0; margin-right: auto; }
.wb-image.align-right { margin-left: auto; margin-right: 0; }
.wb-image figcaption {
  margin-top: 6px;
  font-size: 0.82rem;
  color: var(--ink-soft);
  text-align: center;
  font-style: italic;
}
@media print { .wb-image { break-inside: avoid; } }
.slider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px 22px;
  margin-top: 14px;
}
.slider-field label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.slider-field .val { font-weight: 700; }
.slider-field.linear .val { color: var(--accent-linear); }
.slider-field.exp .val { color: var(--accent-exp); }
input[type="range"] {
  width: 100%;
  height: 36px;
  accent-color: var(--accent-primary);
  touch-action: manipulation;
}
.slider-field.linear input[type="range"] { accent-color: var(--accent-linear); }
.slider-field.exp input[type="range"] { accent-color: var(--accent-exp); }

.task-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.task-num {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: "Outfit", sans-serif;
}
.task-num.knobel { background: var(--accent-exp-soft); color: var(--accent-exp); }
.task-prompt { flex: 1 1 auto; font-weight: 600; }
.task-prompt p { margin: 0; }
.difficulty-stars {
  font-size: 0.95rem;
  white-space: nowrap;
  letter-spacing: 1px;
  flex: none;
}
.difficulty-stars .filled { color: var(--accent-exp); }
.difficulty-stars .empty { color: var(--line); }

/* --- Sortier-Aufgabe (Drag & Drop, siehe engine.js wireSortList) --- */
.sort-list { margin: 10px 0; }
.sort-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--paper-raised);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  min-height: 44px;
  transition: box-shadow 0.15s ease, opacity 0.15s ease;
}
.sort-item.dragging { opacity: 0.4; }
.sort-item.drag-over-top { box-shadow: 0 -3px 0 var(--accent-primary); }
.sort-item.drag-over-bottom { box-shadow: 0 3px 0 var(--accent-primary); }
.sort-handle {
  flex: none;
  cursor: grab;
  color: var(--ink-soft);
  font-size: 1.15rem;
  touch-action: none;
  line-height: 1;
  padding: 4px 2px;
}
.sort-handle:active { cursor: grabbing; }
.sort-text { flex: 1 1 auto; }

.answer-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}
/* Die Aufgaben-Vorlage bekommt einen eigenen Block-Container, damit Text und
   Eingabefelder normal fließen (mit <br> auch mehrzeilig). Läge sie direkt im
   Flex-Container, würde jeder Textschnipsel ein eigenes Flex-Element. */
.answer-template {
  flex: 1 1 100%;
  line-height: 2.6;
}
.fu-label { font-size: 0.85rem; color: var(--ink-soft); margin-right: 4px; }
input[type="text"], input[type="number"] {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  width: 100px;
  background: var(--paper);
  color: var(--ink);
}
input.field-input { width: auto; }
input:focus { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
select.choice {
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 0.95rem;
  min-height: 44px;
  background: var(--paper);
  color: var(--ink);
}

.feedback {
  display: none;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 6px;
}
.feedback.show { display: inline-flex; }
.feedback.ok { background: var(--success-soft); color: var(--success); }
.feedback.bad { background: var(--danger-soft); color: var(--danger); }

.hint-area {
  display: none;
  margin-top: 8px;
  font-size: 0.87rem;
  color: var(--ink-soft);
  border-left: 3px solid var(--accent-exp);
  padding-left: 10px;
}
.hint-area.show { display: block; }
.hint-area p { margin: 4px 0; }

.solution-area {
  display: none;
  margin-top: 10px;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
}
.solution-area.show { display: block; }

.drawpad-wrap {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  margin-top: 10px;
}
.drawpad-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.color-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}
.color-dot.active { border-color: var(--ink); }
canvas.drawpad-canvas {
  width: 100%; height: 220px;
  display: block;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  touch-action: none;
}

.scratch-fab {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 30;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent-primary);
  color: #fff;
  border: none;
  box-shadow: var(--shadow);
  font-size: 1.4rem;
  cursor: pointer;
}
.scratch-panel {
  position: fixed;
  right: 18px; bottom: 84px;
  z-index: 30;
  width: min(420px, calc(100vw - 36px));
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 12px;
  display: none;
}
.scratch-panel.show { display: block; }
.scratch-panel h3 { font-size: 0.95rem; margin-bottom: 6px; }

footer.appfoot {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 18px 40px;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.no-print { }
body.exporting .no-print { visibility: hidden; }
body.exporting { background-image: none; }
body.exporting .feedback { display: none !important; }
/* Tipps werden im PDF ausgeblendet – AUSSER auf dem Lösungsblatt, dort
   gehören sie zur Lehrerfassung dazu. */
body.exporting:not(.wb-solution) .hint-area { display: none !important; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 0.88rem;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Lösungsblatt (Lehrerfassung) ---------- */
.header-card.is-solution { border-color: var(--accent-exp); }
.solution-badge {
  display: inline-block;
  margin: 8px 0 2px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--accent-exp);
  color: #fff;
  font-family: "Outfit", sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.01em;
}
.field-solution {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--accent-exp-soft);
  border-bottom: 2px solid var(--accent-exp);
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  margin-right: 2px;
}
.hint-area.open,
.solution-area.open { display: block; }
.solution-hints { margin: 4px 0 0; padding-left: 20px; }
.solution-hints li { margin: 2px 0; }
.sort-item.solved { cursor: default; }
.sort-rank {
  flex: none;
  min-width: 1.8em;
  font-family: "JetBrains Mono", monospace;
  font-weight: 600;
  color: var(--accent-primary);
}

/* ---------- Seitenumbruch-Baustein ---------- */
/* Nur ein Hinweis im Baukasten/in der Vorschau – beim PDF-Export wird die
   Zeile gar nicht erst gerastert (collectPrintItems in engine.js). */
.wb-forced-break {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0;
  color: var(--ink-soft);
  font-family: "Outfit", sans-serif;
  font-size: 0.78rem;
  white-space: nowrap;
}
.wb-forced-break::before,
.wb-forced-break::after {
  content: "";
  flex: 1 1 auto;
  border-top: 2px dashed var(--line);
}

/* ---------- Rückmeldung pro Lücke ----------
   Nach „Prüfen" ist an jedem Feld einzeln sichtbar, ob es stimmt – bei
   Aufgaben mit mehreren Lücken war vorher nur eine Gesamtmeldung zu sehen. */
.field-input.field-ok,
select.choice.field-ok {
  border-color: var(--success);
  background: var(--success-soft);
}
.field-input.field-bad,
select.choice.field-bad {
  border-color: var(--danger);
  background: var(--danger-soft);
}

/* ---------- Sortier-Aufgabe: Touch-Bedienung ---------- */
.sort-item {
  transition: box-shadow 0.15s ease, opacity 0.15s ease, background 0.4s ease;
}
.sort-item.dragging {
  opacity: 0.9;
  position: relative;
  z-index: 20;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  border-color: var(--accent-primary);
}
.sort-item.just-moved { background: var(--accent-primary-soft); }
/* Vollwertiges Touch-Ziel: vorher war der Griff nur gut 20 px groß. */
.sort-handle {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  border-radius: 8px;
  user-select: none;
}
.sort-handle:hover { background: var(--accent-primary-soft); }
.sort-moves {
  flex: none;
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
}
.sort-move {
  appearance: none;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 7px;
  width: 44px;
  height: 30px;
  font-size: 0.72rem;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.sort-move:hover:not(:disabled) {
  border-color: var(--accent-primary);
  background: var(--accent-primary-soft);
}
.sort-move:disabled { opacity: 0.3; cursor: default; }

/* ---------- Nebenrechnungen: größerer, umschaltbarer Block ---------- */
.scratch-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.scratch-head h3 { margin: 0; }
.scratch-spacer { flex: 1 1 auto; }
.scratch-panel .drawpad-canvas { height: 300px; }
.scratch-panel.big {
  width: min(1000px, calc(100vw - 24px));
  right: 12px;
  bottom: 12px;
}
.scratch-panel.big .drawpad-canvas { height: min(62vh, 620px); }

/* ---------- Hinweis nach dem Wiederherstellen von Eingaben ---------- */
.restore-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.88rem;
}
.restore-bar span { flex: 1 1 auto; }
.linklike {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent-primary);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}
</style>
