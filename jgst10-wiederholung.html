  };

  var GROUP_LABELS = { struktur: "Struktur", inhalt: "Inhalt", interaktiv: "Interaktiv", aufgabe: "Aufgaben" };

  /* ================= Gesamt-Renderer / Mount ================= */
  function renderHeaderCard(meta, solution) {
    return (
      '<section class="header-card wb-block' + (solution ? " is-solution" : "") + '" data-keep-with-next="false">' +
      '<div class="chapter-eyebrow-row"><span class="chapter-eyebrow">' + esc(meta.chapterCode || "") + " &nbsp;" + esc(meta.chapterTitle || "") + "</span>" +
      '<span class="chapter-meta">' + esc(meta.klasse || "") + (meta.klasse && meta.datum ? " · " : "") + esc(meta.datum || "") + "</span></div>" +
      (solution ? '<div class="solution-badge">🔑 Lösungsblatt – nur für die Lehrkraft</div>' : "") +
      "<h1>" + esc(meta.title || "") + (solution ? " – Lösungen" : "") + "</h1>" +
      (meta.subtitle ? '<p class="subtitle">' + esc(meta.subtitle) + "</p>" : "") +
      "</section>"
    );
  }

  // Ordnet alle Bausteine im 4-spaltigen Raster an – "Frei im Raster
  // verschiebbar": jeder Baustein trägt (nach dem ersten Normalisieren)
  // ein explizites row/col-Feld, Lücken sind erlaubt. normalizeLayout()
  // ist die EINZIGE Stelle, die diese Felder interpretiert/schreibt:
  //  1) Fehlen row/col bei ALLEN Bausteinen (z. B. ein altes, vor Option 2
  //     gespeichertes Projekt), werden sie einmalig nach dem alten
  //     Textumfluss-Prinzip vergeben (Rückwärtskompatibilität).
  //  2) Andernfalls werden vorhandene row/col respektiert, nach (row, col,
  //     bisherige Array-Position) sortiert und Überlappungen aufgelöst:
  //     ein später einsortierter Baustein wird innerhalb der Zeile nach
  //     rechts verschoben bzw. – falls kein Platz mehr ist – in eine neue
  //     Zeile direkt danach verschoben.
  //  3) Strukturelemente (z. B. Phasen-Überschrift) stehen immer alleine
  //     in ihrer eigenen vollen Zeile.
  //  4) Zeilennummern werden am Ende auf dichte, sortierte Ganzzahlen
  //     (0,1,2,…) kompaktiert, und project.blocks wird in die daraus
  //     resultierende Lesereihenfolge (Zeile, dann Spalte) umsortiert –
  //     damit bleiben Baustein-Liste im Editor, Live-Vorschau und Export
  //     immer exakt in derselben Reihenfolge.
  // Rückgabe: Array von Zeilen, jede Zeile ein Array von
  // { b, def, span, col } – wird sowohl vom Editor (Raster-Spiegel der
  // Bausteinliste) als auch von renderBody()/PDF-Export verwendet.
  function normalizeLayout(blocks) {
    blocks = blocks || [];
    var items = [];
    blocks.forEach(function (b, idx) {
      var def = Registry[b.type];
      if (!def) return;
      var span = def.noCard ? 4 : Math.max(1, Math.min(4, Math.round(Number(b.span)) || 4));
      items.push({ b: b, def: def, span: span, idx: idx });
    });

    var hasAnyPos = items.some(function (it) {
      return typeof it.b.row === "number" && isFinite(it.b.row) && typeof it.b.col === "number" && isFinite(it.b.col);
    });

    if (!hasAnyPos) {
      // Altes Projekt ohne row/col: einmalig nach altem Textumfluss-Prinzip
      // (greedy, in Array-Reihenfolge) verteilen.
      var row = 0, used = 0;
      items.forEach(function (it) {
        if (it.def.noCard) {
          if (used > 0) { row++; used = 0; }
          it.row = row; it.col = 0;
          row++; used = 0;
          return;
        }
        if (used + it.span > 4) { row++; used = 0; }
        it.row = row; it.col = used;
        used += it.span;
      });
    } else {
      items.forEach(function (it) {
        it.row = (typeof it.b.row === "number" && isFinite(it.b.row)) ? it.b.row : it.idx;
        it.col = (typeof it.b.col === "number" && isFinite(it.b.col)) ? Math.max(0, Math.min(3, Math.round(it.b.col))) : 0;
      });
    }

    // Spanne an Spalte anpassen, falls sie über den Rand hinausragen würde.
    items.forEach(function (it) {
      if (it.def.noCard) { it.col = 0; it.span = 4; return; }
      if (it.col + it.span > 4) it.span = 4 - it.col;
      if (it.span < 1) { it.col = 0; it.span = 1; }
    });

    // Stabil nach (row, col, ursprünglichem Index) sortieren.
    items.sort(function (a, b2) {
      if (a.row !== b2.row) return a.row - b2.row;
      if (a.col !== b2.col) return a.col - b2.col;
      return a.idx - b2.idx;
    });

    // Zeilen aufbauen: gleiche row-Werte kommen möglichst in dieselbe Zeile,
    // Überlappungen schieben den später einsortierten Baustein nach rechts
    // bzw. – falls kein Platz mehr da ist – in eine neue Zeile.
    var rows = [];
    var current = null, currentKey = null;
    function occupied(rowItems) {
      var occ = [false, false, false, false];
      rowItems.forEach(function (it) {
        for (var c = it.col; c < it.col + it.span && c < 4; c++) occ[c] = true;
      });
      return occ;
    }
    function fitsFrom(occ, col, span) {
      for (var c = col; c < col + span; c++) { if (c >= 4 || occ[c]) return false; }
      return true;
    }
    items.forEach(function (it) {
      if (it.def.noCard) {
        if (current) { rows.push(current); current = null; }
        rows.push([it]);
        currentKey = null;
        return;
      }
      if (current === null) {
        current = [it]; currentKey = it.row;
        return;
      }
      if (it.row !== currentKey) {
        rows.push(current);
        current = [it]; currentKey = it.row;
        return;
      }
      var occ = occupied(current);
      var col = it.col;
      if (!fitsFrom(occ, col, it.span)) {
        var placed = false;
        for (var c2 = col + 1; c2 <= 4 - it.span; c2++) {
          if (fitsFrom(occ, c2, it.span)) { col = c2; placed = true; break; }
        }
        if (!placed) {
          rows.push(current);
          current = [it]; currentKey = it.row;
          col = it.col;
        }
      }
      it.col = col;
      current.push(it);
    });
    if (current) rows.push(current);

    // Dichte Zeilennummern zurückschreiben + project.blocks in Lesereihenfolge bringen.
    var ordered = [];
    rows.forEach(function (rowItems, rIdx) {
      rowItems.forEach(function (it) {
        it.b.row = rIdx; it.b.col = it.col; it.b.span = it.span;
        ordered.push(it.b);
      });
    });
    if (ordered.length === blocks.length) {
      blocks.length = 0;
      Array.prototype.push.apply(blocks, ordered);
    }

    return rows.map(function (rowItems) {
      return rowItems.map(function (it) { return { b: it.b, def: it.def, span: it.span, col: it.col }; });
    });
  }

  function computeRows(blocks) {
    return normalizeLayout(blocks);
  }

  // project.solutionMode  → Lehrerfassung (Lösungen eingetragen/aufgeklappt)
  // project.previewMode   → Live-Vorschau im Baukasten: kein PDF-Knopf in der
  //                         Topbar, weil dort jsPDF/html2canvas bewusst nicht
  //                         mitgeladen werden (der Baukasten exportiert selbst).
  function renderBody(project) {
    var taskNumber = 0;
    var solution = !!project.solutionMode;
    var rows = computeRows(project.blocks);
    var blocksHtml = rows.map(function (row) {
      var rowKeepWithNext = row.some(function (item) { return !!item.def.keepWithNext; });
      var rowForceBreak = row.length === 1 && !!row[0].def.forceBreak;
      var cellsHtml = row.map(function (item) {
        var b = item.b, def = item.def;
        var ctx = { solution: solution };
        if ((b.type === "task" || b.type === "sortTask") && !b.config.knobel) { taskNumber++; ctx.taskNumber = taskNumber; }
        var inner = def.render(b.config, b.id, ctx);
        var cls = "wb-block" + (def.noCard ? "" : " card");
        var gridCol = def.noCard ? ("1 / span 4") : ((item.col + 1) + " / span " + item.span);
        return '<div class="' + cls + '" data-block-id="' + b.id + '" style="grid-column: ' + gridCol + ';">' + inner + "</div>";
      }).join("");
      return '<div class="wb-row" data-keep-with-next="' + rowKeepWithNext + '"' +
        (rowForceBreak ? ' data-force-break="true"' : "") + ">" + cellsHtml + "</div>";
    }).join("\n");
    return (
      '<div class="topbar no-print"><div class="topbar-inner"><h1>' + esc(meta_(project).chapterCode) + " " + esc(meta_(project).chapterTitle) +
      (solution ? " · Lösungen" : "") + "</h1>" +
      (project.previewMode ? "" : '<button class="btn btn-primary btn-sm" id="wbExportPdfBtn" type="button">⭳ Als PDF sichern</button>') +
      "</div></div>" +
      '<main id="wbWorksheet">' + renderHeaderCard(meta_(project), solution) + blocksHtml + "</main>" +
      '<footer class="appfoot no-print">' + (solution ? "Lösungsblatt" : "Interaktives Arbeitsblatt") + (meta_(project).chapterCode ? " · " + esc(meta_(project).chapterCode) : "") + "</footer>" +
      '<button class="scratch-fab no-print" id="wbScratchFab" type="button" aria-label="Kritzelblock öffnen">✎</button>' +
      '<div class="scratch-panel no-print" id="wbScratchPanel">' +
      '<div class="scratch-head"><h3>Nebenrechnungen</h3><span class="scratch-spacer"></span>' +
      '<button class="btn btn-ghost btn-sm" id="wbScratchSize" type="button">⤢ Größer</button>' +
      '<button class="btn btn-ghost btn-sm" id="wbScratchClose" type="button" aria-label="Schließen">✕</button></div>' +
      '<div class="drawpad-wrap" style="margin-top:0;"><div class="drawpad-toolbar"></div>' +
      '<canvas class="drawpad-canvas" id="wbScratchPad"></canvas></div></div>' +
      '<div class="toast no-print" id="wbToast"></div>'
    );
  }
  function meta_(project) { return project.meta || {}; }

  function mount(project) {
    if (project.solutionMode) document.body.classList.add("wb-solution");
    (project.blocks || []).forEach(function (b) {
      var def = Registry[b.type];
      if (def && def.mount) def.mount(b.config, b.id);
    });
    E.wireDrawpad(document.getElementById("wbScratchPad") ? document.getElementById("wbScratchPad").closest(".drawpad-wrap") : null);
    var fab = E.el("wbScratchFab"), panel = E.el("wbScratchPanel");
    function redrawAll() { E.redrawCallbacks.forEach(function (fn) { try { fn(); } catch (e) {} }); }
    if (fab && panel) {
      fab.addEventListener("click", function () {
        panel.classList.toggle("show");
        if (panel.classList.contains("show")) redrawAll();
      });
      var closeBtn = E.el("wbScratchClose");
      if (closeBtn) closeBtn.addEventListener("click", function () { panel.classList.remove("show"); });
      // Größe umschalten: normal / fast bildschirmfüllend. Der Zeichenpuffer
      // wird beim Umschalten neu vermessen, die Striche bleiben erhalten.
      var sizeBtn = E.el("wbScratchSize");
      if (sizeBtn) sizeBtn.addEventListener("click", function () {
        var big = panel.classList.toggle("big");
        sizeBtn.textContent = big ? "⤡ Kleiner" : "⤢ Größer";
        requestAnimationFrame(redrawAll);
      });
    }
    var exportBtn = E.el("wbExportPdfBtn");
    if (exportBtn) exportBtn.addEventListener("click", function () {
      var fname = (project.meta && project.meta.filename ? project.meta.filename : "arbeitsblatt") +
        (project.solutionMode ? "_loesung.pdf" : "_ausgefuellt.pdf");
      E.exportPdf("wbWorksheet", fname, "wbExportPdfBtn");
    });
    window.addEventListener("resize", E.debounce(function () {
      E.redrawCallbacks.forEach(function (fn) { try { fn(); } catch (e) {} });
    }, 150));

    // Seitenumbruch-Indikator: zeigt in der Live-Vorschau gestrichelte
    // Linien dort, wo der PDF-Export vermutlich eine neue Seite beginnen
    // würde. Rein informativ, wird bei jedem Redraw (Resize, Panel-Toggle)
    // neu berechnet.
    function updatePageBreaks() { E.renderPageBreakOverlays("wbWorksheet"); }
    E.redrawCallbacks.push(updatePageBreaks);
    updatePageBreaks();

    // Zuletzt: Eingaben wiederherstellen und ab jetzt mitschreiben. Muss nach
    // dem Mounten aller Bausteine laufen, damit Felder und Zeichenflächen da sind.
    E.wireAutosave(project);
  }

  global.BlockRegistry = Registry;
  global.WBGroupLabels = GROUP_LABELS;
  global.WBRuntime = { renderBody: renderBody, mount: mount, autoParagraph: autoParagraph, uniqueId: uniqueId, normalizeLayout: normalizeLayout };
})(window);
</script>
