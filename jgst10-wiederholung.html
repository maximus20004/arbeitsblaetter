<body>
<div id="wbRoot"></div>
<script>/*
 * Baukasten – gemeinsame Laufzeit-Engine
 * Wird sowohl im Baukasten (Live-Vorschau) als auch im exportierten,
 * eigenständigen Arbeitsblatt verwendet. Rein datengetrieben: kennt keine
 * konkreten Aufgaben, nur die Baustein-Konfiguration aus dem Projekt-JSON.
 */
(function (global) {
  "use strict";

  /* ---------- kleine Helfer ---------- */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#000000";
  }
  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      var args = arguments, ctx = this;
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }
  function parseNum(raw) {
    if (raw === null || raw === undefined) return NaN;
    var s = String(raw).trim().toLowerCase();
    if (s === "") return NaN;
    s = s.replace(/€/g, "").replace(/\beuro\b/g, "");
    s = s.replace(/\btagen\b/g, "").replace(/\btage\b/g, "").replace(/\btag\b/g, "");
    s = s.replace(/%/g, "").replace(/\s+/g, "");
    if (s.indexOf(",") !== -1 && s.indexOf(".") !== -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (s.indexOf(",") !== -1) {
      s = s.replace(",", ".");
    }
    // Einheit am Ende tolerieren: am Feld steht die richtige Einheit ohnehin
    // daneben, Schüler tippen sie aber oft trotzdem mit ("2,5 m", "18 cm²").
    s = s.replace(/[a-zäöüß²³]+$/, "");
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function numEq(a, b, eps) {
    eps = eps === undefined ? 1e-6 : eps;
    return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < eps;
  }
  function formatEuro(v) { return Math.round(v).toLocaleString("de-DE"); }
  function formatDE(num, decimals) { return num.toFixed(decimals).replace(".", ","); }
  // Deterministisch "zufällige" Reihenfolge aus einer Text-Seed (z. B. der
  // Baustein-id) – dieselbe Sortier-Aufgabe zeigt bei jedem Neu-Rendern
  // (Vorschau-Refresh, PDF-Export) dieselbe Ausgangsreihenfolge, verschiedene
  // Bausteine bekommen unterschiedliche Mischungen.
  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
    return h;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seedStr) {
    var rnd = mulberry32(hashStr(String(seedStr)));
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    // Falls die Mischung zufällig die Originalreihenfolge trifft (bei wenigen
    // Elementen nicht unwahrscheinlich): einmal fest vertauschen, damit die
    // Aufgabe nicht bereits gelöst startet.
    if (a.length > 1 && a.every(function (x, i2) { return x === arr[i2]; })) {
      var t2 = a[0]; a[0] = a[a.length - 1]; a[a.length - 1] = t2;
    }
    return a;
  }
  function niceCeil(v) {
    if (v <= 0) return 1;
    var exp = Math.floor(Math.log10(v));
    var base = Math.pow(10, exp);
    var n = v / base, niceN;
    if (n <= 1) niceN = 1; else if (n <= 2) niceN = 2; else if (n <= 5) niceN = 5; else niceN = 10;
    return niceN * base;
  }
  function showToast(msg) {
    var t = el("wbToast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  var redrawCallbacks = [];

  /* ---------- Zeichenfläche ---------- */
  function createDrawPad(canvas) {
    var ctx = canvas.getContext("2d");
    var drawing = false, current = null, strokes = [];
    var color = getCssVar("--ink");
    var lineWidth = 2.5;

    function resize() {
      var rect = canvas.getBoundingClientRect();
      if (rect.width < 1) return;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    function redraw() {
      var rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      for (var i = 0; i < strokes.length; i++) drawStroke(strokes[i]);
    }
    function drawStroke(s) {
      if (s.points.length < 1) return;
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      if (s.points.length === 1) ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1);
      for (var i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.stroke();
    }
    function posFromEvent(e) {
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    canvas.addEventListener("pointerdown", function (e) {
      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      current = { color: color, width: lineWidth, points: [posFromEvent(e)] };
      strokes.push(current);
      e.preventDefault();
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!drawing) return;
      current.points.push(posFromEvent(e));
      redraw();
      e.preventDefault();
    }, { passive: false });
    function endStroke() { drawing = false; current = null; }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("pointerleave", function () { if (drawing) endStroke(); });

    requestAnimationFrame(resize);

    var onChange = null;
    function changed() { if (onChange) { try { onChange(); } catch (e) {} } }
    canvas.addEventListener("pointerup", changed);
    canvas.addEventListener("pointercancel", changed);

    return {
      setColor: function (c) { color = c; },
      setWidth: function (w) { lineWidth = w; },
      undo: function () { strokes.pop(); redraw(); changed(); },
      clear: function () { strokes = []; redraw(); changed(); },
      isEmpty: function () { return strokes.length === 0; },
      resize: resize,
      // Für das Zwischenspeichern: Striche auslesen und wieder einsetzen.
      getStrokes: function () { return strokes; },
      setStrokes: function (arr) {
        strokes = Array.isArray(arr) ? arr : [];
        redraw();
      },
      setOnChange: function (fn) { onChange = fn; }
    };
  }

  function mkToolBtn(label, title, onClick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn btn-sm btn-ghost";
    b.textContent = label; if (title) b.title = title;
    b.addEventListener("click", onClick);
    return b;
  }

  function wireDrawpad(wrapEl) {
    var canvas = wrapEl.querySelector("canvas.drawpad-canvas");
    var toolbar = wrapEl.querySelector(".drawpad-toolbar");
    if (!canvas || !toolbar) return null;
    var pad = createDrawPad(canvas);
    var colors = [
      { name: "Tinte", v: getCssVar("--ink") },
      { name: "Blau (Modell A)", v: getCssVar("--accent-linear") },
      { name: "Orange (Modell B)", v: getCssVar("--accent-exp") },
      { name: "Rot", v: getCssVar("--danger") }
    ];
    colors.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "color-dot" + (i === 0 ? " active" : "");
      b.style.background = c.v; b.title = c.name; b.setAttribute("aria-label", c.name);
      b.addEventListener("click", function () {
        pad.setColor(c.v);
        toolbar.querySelectorAll(".color-dot").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
      toolbar.appendChild(b);
    });
    toolbar.appendChild(mkToolBtn("Dünn", "Feiner Stift", function () { pad.setWidth(2); }));
    toolbar.appendChild(mkToolBtn("Dick", "Dicker Stift", function () { pad.setWidth(5.5); }));
    toolbar.appendChild(mkToolBtn("↺ Rückgängig", "Letzten Strich entfernen", function () { pad.undo(); }));
    toolbar.appendChild(mkToolBtn("🗑 Löschen", "Alles löschen", function () { pad.clear(); }));
    redrawCallbacks.push(pad.resize);
    // Für das Zwischenspeichern merken, welche Zeichenfläche zu welchem
    // Canvas gehört – die Striche werden nach einem Neuladen wiederhergestellt.
    if (canvas.id) {
      padRegistry[canvas.id] = pad;
      pad.setOnChange(scheduleSave);
    }
    return pad;
  }

  /* ---------- Parameter-Graph ---------- */
  function drawGrowthGraph(canvas, opts) {
    var maxDays = opts.maxDays, series = opts.series;
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 1) return;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = rect.width, H = rect.height;
    var padL = 52, padR = 16, padT = 16, padB = 34;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var days = [];
    for (var n = 0; n <= maxDays; n++) days.push(n);
    var maxY = 1;
    var seriesVals = series.map(function (s) {
      var vals = days.map(function (n) {
        return s.type === "linear" ? s.a0 + s.param * n : s.a0 * Math.pow(s.param, n);
      });
      maxY = Math.max(maxY, Math.max.apply(null, vals));
      var copy = {}; for (var k in s) copy[k] = s[k];
      copy.vals = vals;
      return copy;
    });
    var niceMax = niceCeil(maxY);

    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft");
    var line = getCssVar("--line"), paperRaised = getCssVar("--paper-raised");

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paperRaised; ctx.fillRect(0, 0, W, H);

    function xFor(n) { return padL + (n / maxDays) * plotW; }
    function yFor(v) { return padT + plotH - (v / niceMax) * plotH; }

    ctx.font = "11px 'JetBrains Mono', monospace";
    var ySteps = 5;
    for (var i = 0; i <= ySteps; i++) {
      var v = niceMax * i / ySteps, y = yFor(v);
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = inkSoft; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(formatEuro(v), padL - 8, y);
    }
    var xTickStep = maxDays <= 8 ? 1 : (maxDays <= 14 ? 2 : 3);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (var nx = 0; nx <= maxDays; nx += xTickStep) {
      var x = xFor(nx);
      ctx.strokeStyle = line;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB + 4); ctx.stroke();
      ctx.fillStyle = inkSoft; ctx.fillText(String(nx), x, H - padB + 8);
    }
    ctx.fillStyle = inkSoft; ctx.textAlign = "center";
    ctx.fillText("Tag n", padL + plotW / 2, H - 6);
    ctx.save();
    ctx.translate(14, padT + plotH / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Betrag in €", 0, 0);
    ctx.restore();

    ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB);
    ctx.stroke();

    seriesVals.forEach(function (s) {
      ctx.strokeStyle = s.color; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
      ctx.beginPath();
      days.forEach(function (n, i) {
        var x = xFor(n), y = yFor(s.vals[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = s.color;
      days.forEach(function (n, i) {
        var x = xFor(n), y = yFor(s.vals[i]);
        ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI * 2); ctx.fill();
      });
    });
  }

  /* ---------- Diagramm-Baustein: Balken/Linie/Kreis ----------
   * opts: { chartType: 'bar'|'line'|'pie', data: [{label,value,color}],
   *         xLabel, yLabel, unit, showValues }. Farben kommen bereits
   * aufgelöst (getCssVar) vom Aufrufer, damit diese Funktion themen-
   * unabhängig bleibt (wie bei drawCoordinatePlane/drawGrowthGraph). */
  function diagramValueLabel(v, unit) {
    var s = Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : formatDE(v, 1);
    return unit ? s + " " + unit : s;
  }
  function truncateLabel(s, max) {
    s = String(s == null ? "" : s);
    return s.length > max ? s.slice(0, max - 1) + "…" : s;
  }
  function drawPieChart(ctx, W, H, data, opts, ink) {
    var total = data.reduce(function (s, d) { return s + Math.max(0, Number(d.value) || 0); }, 0);
    if (total <= 0) total = 1;
    var cx = W / 2, cy = H / 2, r = Math.max(20, Math.min(W, H) / 2 - 14);
    var startAngle = -Math.PI / 2;
    data.forEach(function (d) {
      var val = Math.max(0, Number(d.value) || 0);
      var angle = (val / total) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, startAngle, startAngle + angle); ctx.closePath();
      ctx.fillStyle = d.color || ink;
      ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = getCssVar("--paper-raised"); ctx.stroke();
      if (opts.showValues && val > 0 && angle > 0.18) {
        var midAngle = startAngle + angle / 2;
        var lx = cx + Math.cos(midAngle) * r * 0.62, ly = cy + Math.sin(midAngle) * r * 0.62;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "700 12px 'Karla', sans-serif";
        ctx.fillText(Math.round((val / total) * 100) + " %", lx, ly);
      }
      startAngle += angle;
    });
  }
  function drawDiagram(canvas, opts) {
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 1) return;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = rect.width, H = rect.height;
    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft");
    var line = getCssVar("--line"), paperRaised = getCssVar("--paper-raised");
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paperRaised; ctx.fillRect(0, 0, W, H);

    var data = (opts.data || []).filter(function (d) { return d && d.label !== undefined && d.label !== ""; });
    if (!data.length) return;

    if (opts.chartType === "pie") { drawPieChart(ctx, W, H, data, opts, ink); return; }

    var vals = data.map(function (d) { return Math.max(0, Number(d.value) || 0); });
    var niceMax = niceCeil(Math.max.apply(null, vals.concat([0])) || 1);

    // Linke Randbreite an die tatsächlich breiteste y-Achsen-Beschriftung
    // anpassen (Werte + Einheit können deutlich breiter sein als reine
    // Zahlen, z. B. "7 Schüler") – sonst würde der Text links abgeschnitten.
    ctx.font = "11px 'JetBrains Mono', monospace";
    var ySteps = 5;
    var maxTickW = 0;
    for (var mi = 0; mi <= ySteps; mi++) {
      var mw = ctx.measureText(diagramValueLabel(niceMax * mi / ySteps, opts.unit)).width;
      if (mw > maxTickW) maxTickW = mw;
    }
    var padL = Math.max(40, Math.ceil(maxTickW) + 16), padR = 16, padT = 16, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    if (plotW < 10 || plotH < 10) return;

    function xFor(i) { return padL + (i + 0.5) / data.length * plotW; }
    function yFor(v) { return padT + plotH - (v / niceMax) * plotH; }

    for (var i = 0; i <= ySteps; i++) {
      var v = niceMax * i / ySteps, y = yFor(v);
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = inkSoft; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(diagramValueLabel(v, opts.unit), padL - 8, y);
    }
    ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(W - padR, padT + plotH);
    ctx.stroke();

    if (opts.chartType === "line") {
      ctx.strokeStyle = ink; ctx.lineWidth = 1.8;
      ctx.beginPath();
      data.forEach(function (d, i) {
        var x = xFor(i), y = yFor(Math.max(0, Number(d.value) || 0));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      data.forEach(function (d, i) {
        var x = xFor(i), val = Math.max(0, Number(d.value) || 0), y = yFor(val);
        ctx.fillStyle = d.color || ink;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        if (opts.showValues) {
          ctx.fillStyle = inkSoft; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          ctx.fillText(diagramValueLabel(val, opts.unit), x, y - 8);
        }
      });
    } else {
      var barW = Math.max(6, (plotW / data.length) * 0.6);
      data.forEach(function (d, i) {
        var x = xFor(i), val = Math.max(0, Number(d.value) || 0), y = yFor(val);
        ctx.fillStyle = d.color || ink;
        ctx.fillRect(x - barW / 2, y, barW, (padT + plotH) - y);
        if (opts.showValues) {
          ctx.fillStyle = inkSoft; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          ctx.fillText(diagramValueLabel(val, opts.unit), x, y - 4);
        }
      });
    }

    ctx.fillStyle = inkSoft; ctx.textAlign = "center"; ctx.textBaseline = "top";
    var maxLabelChars = data.length > 8 ? 6 : (data.length > 5 ? 10 : 16);
    data.forEach(function (d, i) { ctx.fillText(truncateLabel(d.label, maxLabelChars), xFor(i), padT + plotH + 8); });

    if (opts.xLabel) {
      ctx.fillStyle = inkSoft; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(opts.xLabel, padL + plotW / 2, H - 14);
    }
    if (opts.yLabel) {
      ctx.save();
      ctx.translate(14, padT + plotH / 2); ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = inkSoft; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(opts.yLabel, 0, 0);
      ctx.restore();
    }
  }

  /* ---------- Sicherer Funktions-Parser (kein eval/Function) ----------
   * Unterstützt: + - * / ^ (rechtsassoziativ), Klammern, Variable x,
   * Konstanten pi/e, Funktionen sin/cos/tan/asin/acos/atan/sqrt/abs/exp/
   * ln/log/round/floor/ceil/sign. Wirft bei ungültiger Eingabe einen Error
   * mit verständlicher deutscher Meldung; gibt sonst eine Funktion (x)=>y
   * zurück. */
  var EXPR_FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp,
    ln: Math.log, log: Math.log10, log10: Math.log10,
    round: Math.round, floor: Math.floor, ceil: Math.ceil, sign: Math.sign
  };
  var EXPR_CONSTS = { pi: Math.PI, e: Math.E };

  function tokenizeExpr(str) {
    var tokens = [], i = 0, n = str.length;
    while (i < n) {
      var c = str[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var j = i;
        while (j < n && /[0-9.]/.test(str[j])) j++;
        tokens.push({ type: "NUM", value: str.slice(i, j) });
        i = j; continue;
      }
      if (/[A-Za-z]/.test(c)) {
        var k = i;
        while (k < n && /[A-Za-z0-9]/.test(str[k])) k++;
        tokens.push({ type: "IDENT", value: str.slice(i, k) });
        i = k; continue;
      }
      if ("+-*/^()".indexOf(c) !== -1) { tokens.push({ type: "OP", value: c }); i++; continue; }
      throw new Error("unerwartetes Zeichen „" + c + "“");
    }
    return tokens;
  }

  function compileExpr(str) {
    var tokens = tokenizeExpr(String(str == null ? "" : str).trim());
    if (!tokens.length) throw new Error("leerer Ausdruck");
    var pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }
    function expect(val) {
      var t = next();
      if (!t || t.value !== val) throw new Error("„" + val + "“ erwartet");
    }
    function parseExpression() {
      var left = parseTerm();
      while (peek() && (peek().value === "+" || peek().value === "-")) {
        var op = next().value, right = parseTerm();
        left = (function (l, r, op) {
          return op === "+" ? function (x) { return l(x) + r(x); } : function (x) { return l(x) - r(x); };
        })(left, right, op);
      }
      return left;
    }
    function parseTerm() {
      var left = parseUnary();
      while (peek() && (peek().value === "*" || peek().value === "/")) {
        var op = next().value, right = parseUnary();
        left = (function (l, r, op) {
          return op === "*" ? function (x) { return l(x) * r(x); } : function (x) { return l(x) / r(x); };
        })(left, right, op);
      }
      return left;
    }
    function parseUnary() {
      if (peek() && peek().value === "-") { next(); var v = parseUnary(); return function (x) { return -v(x); }; }
      if (peek() && peek().value === "+") { next(); return parseUnary(); }
      return parsePower();
    }
    function parsePower() {
      var base = parsePrimary();
      if (peek() && peek().value === "^") {
        next();
        var exp = parseUnary();
        return function (x) { return Math.pow(base(x), exp(x)); };
      }
      return base;
    }
    function parsePrimary() {
      var t = peek();
      if (!t) throw new Error("unerwartetes Ende des Ausdrucks");
      if (t.type === "NUM") {
        next();
        var v = parseFloat(t.value);
        if (!isFinite(v)) throw new Error("ungültige Zahl „" + t.value + "“");
        return function () { return v; };
      }
      if (t.type === "IDENT") {
        var name = t.value.toLowerCase();
        next();
        if (peek() && peek().value === "(") {
          next();
          if (!EXPR_FUNCS.hasOwnProperty(name)) throw new Error("unbekannte Funktion „" + name + "“");
          var arg = parseExpression();
          expect(")");
          var fn = EXPR_FUNCS[name];
          return function (x) { return fn(arg(x)); };
        }
        if (name === "x") return function (x) { return x; };
        if (EXPR_CONSTS.hasOwnProperty(name)) { var cv = EXPR_CONSTS[name]; return function () { return cv; }; }
        throw new Error("unbekannter Bezeichner „" + name + "“");
      }
      if (t.value === "(") {
        next();
        var e = parseExpression();
        expect(")");
        return e;
      }
      throw new Error("unerwartetes Zeichen „" + t.value + "“");
    }
    var result = parseExpression();
    if (pos !== tokens.length) throw new Error("unerwartete Zeichen am Ende");
    return result;
  }

  /* ---------- Koordinatensystem mit Funktionsgraphen ---------- */
  function formatTick(v) {
    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
    var s = v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    return s.replace(".", ",");
  }
  function drawArrowHead(ctx, x, y, dir, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    if (dir === "right") { ctx.moveTo(x + 8, y); ctx.lineTo(x - 3, y - 4.5); ctx.lineTo(x - 3, y + 4.5); }
    else { ctx.moveTo(x, y - 8); ctx.lineTo(x - 4.5, y + 3); ctx.lineTo(x + 4.5, y + 3); }
    ctx.closePath();
    ctx.fill();
  }

  function drawCoordinatePlane(canvas, opts) {
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var pad = 38;

    var xMin = Math.min(opts.xMin, opts.xMax - 0.001), xMax = Math.max(opts.xMax, opts.xMin + 0.001);
    var yMin = Math.min(opts.yMin, opts.yMax - 0.001), yMax = Math.max(opts.yMax, opts.yMin + 0.001);
    var xStep = opts.xStep > 0 ? opts.xStep : (xMax - xMin) / 10 || 1;
    var yStep = opts.yStep > 0 ? opts.yStep : (yMax - yMin) / 10 || 1;

    // Die Höhe wird passend zur (vom Layout vorgegebenen) Breite berechnet,
    // damit die Gitterkästchen quadratisch sind UND die volle Breite ausfüllen
    // (kein Leerraum links/rechts wie beim reinen Zentrieren in fester Höhe).
    var startRect = canvas.getBoundingClientRect();
    if (startRect.width < 1) return;
    var availW = Math.max(10, startRect.width - 2 * pad);
    var wantedAvailH = availW * (yMax - yMin) / (xMax - xMin);
    wantedAvailH = Math.max(120, Math.min(wantedAvailH, 900));
    canvas.style.height = (wantedAvailH + 2 * pad) + "px";

    var rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = rect.width, H = rect.height;
    var availH = H - 2 * pad;
    if (availW < 10 || availH < 10) return;

    // Gleicher Maßstab auf x- und y-Achse (Höhe wurde oben bereits passend zur
    // Breite gewählt, dieser Schritt fängt nur Rundungsdifferenzen ab).
    var scale = Math.min(availW / (xMax - xMin), availH / (yMax - yMin));
    var plotW = scale * (xMax - xMin), plotH = scale * (yMax - yMin);
    var offX = pad + (availW - plotW) / 2, offY = pad + (availH - plotH) / 2;

    function X(vx) { return offX + (vx - xMin) * scale; }
    function Y(vy) { return offY + plotH - (vy - yMin) * scale; }

    var ink = getCssVar("--ink"), inkSoft = getCssVar("--ink-soft"), line = getCssVar("--line"), paperRaised = getCssVar("--paper-raised");
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paperRaised; ctx.fillRect(0, 0, W, H);

    // Gitterlinien
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    var gx;
    for (gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax + 1e-9; gx += xStep) {
      var px = X(gx);
      ctx.beginPath(); ctx.moveTo(px, offY); ctx.lineTo(px, offY + plotH); ctx.stroke();
    }
    var gy;
    for (gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax + 1e-9; gy += yStep) {
      var py = Y(gy);
      ctx.beginPath(); ctx.moveTo(offX, py); ctx.lineTo(offX + plotW, py); ctx.stroke();
    }

    // Achsen (bei x=0 / y=0, sonst an den Rand geschoben, falls 0 außerhalb liegt)
    var axisX = (0 >= xMin && 0 <= xMax) ? X(0) : (0 < xMin ? offX : offX + plotW);
    var axisY = (0 >= yMin && 0 <= yMax) ? Y(0) : (0 < yMin ? offY + plotH : offY);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(offX, axisY); ctx.lineTo(offX + plotW, axisY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(axisX, offY); ctx.lineTo(axisX, offY + plotH); ctx.stroke();
    drawArrowHead(ctx, offX + plotW, axisY, "right", ink);
    drawArrowHead(ctx, axisX, offY, "up", ink);

    // Zahlen an den Gitterlinien
    ctx.font = "11px 'JetBrains Mono', monospace";
    ctx.fillStyle = inkSoft;
    ctx.textAlign = "center"; ctx.textBaseline = axisY < offY + plotH - 14 ? "top" : "bottom";
    for (gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax + 1e-9; gx += xStep) {
      if (Math.abs(gx) < 1e-9) continue;
      ctx.fillText(formatTick(gx), X(gx), axisY + (ctx.textBaseline === "top" ? 5 : -5));
    }
    ctx.textAlign = axisX > offX + 14 ? "right" : "left"; ctx.textBaseline = "middle";
    for (gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax + 1e-9; gy += yStep) {
      if (Math.abs(gy) < 1e-9) continue;
      ctx.fillText(formatTick(gy), axisX + (ctx.textAlign === "right" ? -6 : 6), Y(gy));
    }
    ctx.fillText("0", axisX + (ctx.textAlign === "right" ? -6 : 6), axisY + (axisY < offY + plotH - 14 ? 9 : -9));

    // Achsenbeschriftungen – fest im Rand außerhalb des Rasters platziert
    // (nicht relativ zur Achsenposition), damit sie nie mit den Zahlen an
    // den Gitterlinien kollidieren, auch wenn die Achse an den Rand rutscht
    // (z. B. bei einem Definitionsbereich, der die 0 nicht enthält).
    ctx.font = "600 13px 'Outfit', ui-sans-serif, sans-serif";
    ctx.fillStyle = ink;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(opts.xLabel || "x", offX + plotW + 6, axisY);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(opts.yLabel || "y", axisX, offY - 8);

    // Funktionsgraphen – auf das Gitter-Rechteck geclippt, damit Kurven, die
    // steil aus dem sichtbaren Bereich laufen, sauber am Rand enden statt in
    // die Beschriftung/den Rand darüber hinauszuragen.
    var yRange = yMax - yMin;
    ctx.save();
    ctx.beginPath();
    ctx.rect(offX, offY, plotW, plotH);
    ctx.clip();
    (opts.functions || []).forEach(function (f) {
      ctx.strokeStyle = f.color; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      var steps = Math.max(120, Math.round(plotW));
      var started = false, prevY = null;
      for (var i = 0; i <= steps; i++) {
        var vx = xMin + (xMax - xMin) * i / steps;
        var vy;
        try { vy = f.fn(vx); } catch (e) { vy = NaN; }
        if (!isFinite(vy) || vy < yMin - yRange * 2 || vy > yMax + yRange * 2) {
          started = false; prevY = null; continue;
        }
        var px = X(vx), py = Y(vy);
        if (!started) { ctx.moveTo(px, py); started = true; }
        else if (prevY !== null && Math.abs(vy - prevY) > yRange * 1.5) { ctx.moveTo(px, py); }
        else { ctx.lineTo(px, py); }
        prevY = vy;
      }
      ctx.stroke();
    });
    ctx.restore();
  }

  /* ---------- Fortschritt / Feedback ---------- */
  function setFeedback(feedbackId, ok, msg) {
    var fb = el(feedbackId);
    if (!fb) return;
    fb.className = "feedback show " + (ok ? "ok" : "bad");
    fb.textContent = (ok ? "✓ " : "✗ ") + msg;
  }

  var hintState = {};
  function wireHintButton(btn, hintAreaId, hints) {
    var key = hintAreaId;
    hintState[key] = 0;
    btn.addEventListener("click", function () {
      var area = el(hintAreaId);
      if (!area) return;
      if (hintState[key] < hints.length) {
        var p = document.createElement("p");
        p.textContent = "Tipp " + (hintState[key] + 1) + ": " + hints[hintState[key]];
        area.appendChild(p);
        area.classList.add("show");
        hintState[key]++;
      }
      if (hintState[key] >= hints.length) {
        btn.disabled = true;
        btn.textContent = "Keine weiteren Tipps";
      }
    });
  }

  function wireRevealButton(btn, targetId) {
    btn.addEventListener("click", function () {
      var area = el(targetId);
      if (!area) return;
      var showing = area.classList.toggle("show");
      btn.textContent = showing ? "Musterlösung verbergen" : "Musterlösung anzeigen";
    });
  }

  /* ---------- Aufgaben-Prüfung (generisch, feld-basiert) ---------- */
  function fieldElId(blockId, fieldId) { return "wb-" + blockId + "-f-" + fieldId; }

  // Markiert ein einzelnes Feld grün bzw. rot. Die Markierung verschwindet,
  // sobald der Schüler das Feld wieder anfasst – sonst bliebe ein rotes Feld
  // auch dann rot stehen, wenn die Antwort längst korrigiert ist.
  function markField(e, ok) {
    e.classList.remove("field-ok", "field-bad");
    e.classList.add(ok ? "field-ok" : "field-bad");
    if (!e.dataset.markWired) {
      e.dataset.markWired = "1";
      var clear = function () { e.classList.remove("field-ok", "field-bad"); };
      e.addEventListener("input", clear);
      e.addEventListener("change", clear);
    }
  }

  /* Mehrere zulässige Schreibweisen pro Lücke: im Editor mit Semikolon
   * getrennt eingeben, z. B. "0,5; 1/2; ein halb". Angenommen wird, wenn die
   * Eingabe EINER Alternative entspricht – entweder als Zahl (Komma/Punkt und
   * Einheiten werden dabei wie bisher toleriert) oder als Text (Groß-/
   * Kleinschreibung und Leerzeichen egal). Die ERSTE Alternative ist die
   * Musterlösung, die auf dem Lösungsblatt erscheint. */
  function acceptedValues(f) {
    return String(f.expected == null ? "" : f.expected)
      .split(";")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s !== ""; });
  }

  function normText(s) {
    return String(s).toLowerCase().replace(/\s+/g, "").replace(/,/g, ".");
  }

  function answerMatches(f, eingabe) {
    if (String(eingabe).trim() === "") return false;
    var alts = acceptedValues(f);
    for (var i = 0; i < alts.length; i++) {
      var a = parseNum(eingabe), b = parseNum(alts[i]);
      if (numEq(a, b)) return true;
      if (normText(eingabe) === normText(alts[i])) return true;
    }
    return false;
  }

  function checkFieldsTask(blockId, fields) {
    var allOk = true, leer = 0, falsch = 0;
    fields.forEach(function (f) {
      var e = el(fieldElId(blockId, f.id));
      if (!e) { allOk = false; return; }
      var leerFeld = String(e.value).trim() === "";
      var ok = answerMatches(f, e.value);
      if (leerFeld) { ok = false; leer++; } else if (!ok) { falsch++; }
      markField(e, ok);
      if (!ok) allOk = false;
    });
    var msg;
    if (allOk) {
      msg = fields.length > 1 ? "Alle Lücken richtig." : "Richtig.";
    } else if (fields.length > 1) {
      var teile = [];
      if (falsch) teile.push(falsch === 1 ? "eine Lücke ist noch falsch" : falsch + " Lücken sind noch falsch");
      if (leer) teile.push(leer === 1 ? "eine Lücke ist leer" : leer + " Lücken sind leer");
      msg = "Rot markiert: " + teile.join(", ") + ". Grün markierte Lücken stimmen.";
    } else {
      msg = leer ? "Da fehlt noch eine Antwort." : "Noch nicht richtig – schau dir ggf. einen Tipp an.";
    }
    setFeedback("wb-" + blockId + "-fb", allOk, msg);
  }

  /* ---------- Sortier-Aufgabe: Drag&Drop-Umsortieren + Prüfung ----------
   * Rein DOM-basiert: jedes .sort-item trägt in data-key den Index, den es
   * in der KORREKTEN Reihenfolge hat (vergeben beim Rendern, siehe
   * registry.js sortTask). Prüfen liest einfach die aktuelle DOM-Reihenfolge
   * aus – funktioniert unabhängig davon, wie oft/wie umsortiert wurde, und
   * genau das erscheint auch in einem PDF-Export (Momentaufnahme). */
  /* ---------- Eingaben auf dem Gerät zwischenspeichern ----------
   * Ein versehentliches Neuladen – auf dem Tablet schnell passiert – hat
   * bisher alles gelöscht. Eingaben, Sortierreihenfolge und Zeichnungen
   * liegen jetzt im localStorage DES GERÄTS. Nichts wird gesendet, nichts
   * verlässt das Tablet, es gibt keinerlei Auswertung.
   * Bewusst NICHT gespeichert: die Prüf-Rückmeldungen – nach dem Neuladen
   * soll man selbst noch einmal auf „Prüfen" tippen. */
  var padRegistry = {};
  var autosaveKey = null;
  var autosaveTimer = null;

  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function collectState(mitZeichnungen) {
    var s = { v: 1, fields: {}, sort: {}, pads: {} };
    Array.prototype.forEach.call(document.querySelectorAll(".field-input, select.choice"), function (e) {
      if (e.id && String(e.value) !== "") s.fields[e.id] = e.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".sort-list[id]"), function (c) {
      s.sort[c.id] = Array.prototype.map.call(c.querySelectorAll(".sort-item"), function (it) {
        return it.dataset.key;
      });
    });
    if (mitZeichnungen !== false) {
      Object.keys(padRegistry).forEach(function (id) {
        var st = padRegistry[id].getStrokes();
        if (st && st.length) s.pads[id] = st;
      });
    }
    return s;
  }

  function applyState(s) {
    if (!s || s.v !== 1) return false;
    var etwas = false;
    Object.keys(s.fields || {}).forEach(function (id) {
      var e = el(id);
      if (e) { e.value = s.fields[id]; etwas = true; }
    });
    Object.keys(s.sort || {}).forEach(function (cid) {
      var c = el(cid);
      if (!c) return;
      (s.sort[cid] || []).forEach(function (k) {
        var it = c.querySelector('.sort-item[data-key="' + k + '"]');
        if (it) { c.appendChild(it); etwas = true; }
      });
      updateSortButtons(c);
    });
    Object.keys(s.pads || {}).forEach(function (id) {
      var pad = padRegistry[id];
      if (pad) { pad.setStrokes(s.pads[id]); etwas = true; }
    });
    return etwas;
  }

  function saveNow() {
    if (!autosaveKey) return;
    try {
      var json = JSON.stringify(collectState(true));
      // Zeichnungen können groß werden; notfalls lieber die Eingaben retten.
      if (json.length > 2000000) json = JSON.stringify(collectState(false));
      storeSet(autosaveKey, json);
    } catch (e) {}
  }

  function scheduleSave() {
    if (!autosaveKey) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(saveNow, 400);
  }

  function clearSaved() {
    if (autosaveKey) storeDel(autosaveKey);
    // Schlüssel abschalten und laufende Speicherung abbrechen: sonst schreibt
    // der pagehide-/beforeunload-Haken beim Neuladen sofort alles zurück und
    // „Neu anfangen" hätte keine Wirkung.
    autosaveKey = null;
    clearTimeout(autosaveTimer);
    location.reload();
  }

  function mkResetBtn(text, frage, cls) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = text;
    b.addEventListener("click", function () {
      if (confirm(frage)) clearSaved();
    });
    return b;
  }

  function showRestoreBar() {
    var root = el("wbWorksheet");
    if (!root) return;
    var bar = document.createElement("div");
    bar.className = "restore-bar no-print";
    var txt = document.createElement("span");
    txt.textContent = "Deine Eingaben von vorhin wurden wiederhergestellt.";
    bar.appendChild(txt);
    bar.appendChild(mkResetBtn("Neu anfangen",
      "Alle deine Eingaben auf diesem Blatt löschen und neu anfangen?", "btn btn-ghost btn-sm"));
    root.insertBefore(bar, root.firstChild);
  }

  function wireAutosave(project) {
    // Auf dem Lösungsblatt gibt es nichts zu retten, und in der Live-Vorschau
    // des Baukastens würde Zwischenspeichern nur die Ansicht der Lehrkraft
    // mit alten Probe-Eingaben verunreinigen.
    if (!project || project.solutionMode || project.previewMode) return;
    if (!storeSet("wb-test", "1")) return;   // z. B. privater Modus
    storeDel("wb-test");
    autosaveKey = "baukasten:" + ((project.meta && project.meta.filename) || "arbeitsblatt");

    var raw = storeGet(autosaveKey), wieder = false;
    if (raw) { try { wieder = applyState(JSON.parse(raw)); } catch (e) {} }

    document.addEventListener("input", scheduleSave, true);
    document.addEventListener("change", scheduleSave, true);
    global.addEventListener("pagehide", saveNow);
    global.addEventListener("beforeunload", saveNow);

    if (wieder) showRestoreBar();
    var foot = document.querySelector("footer.appfoot");
    if (foot) {
      foot.appendChild(document.createTextNode(" · "));
      foot.appendChild(mkResetBtn("Eingaben auf diesem Gerät löschen",
        "Alle deine Eingaben auf diesem Blatt löschen?", "linklike"));
    }
  }

  // Ein Element um eine Position nach oben (-1) oder unten (+1) schieben.
  // Das ist der verlässliche Weg auf Geräten, auf denen Ziehen hakt.
  function moveSortItem(item, dir) {
    var container = item.parentNode;
    if (!container) return;
    if (dir < 0 && item.previousElementSibling) {
      container.insertBefore(item, item.previousElementSibling);
    } else if (dir > 0 && item.nextElementSibling) {
      container.insertBefore(item.nextElementSibling, item);
    } else {
      return;
    }
    item.classList.remove("just-moved");
    void item.offsetWidth;                 // Neustart der Hervorhebung erzwingen
    item.classList.add("just-moved");
    updateSortButtons(container);
    scheduleSave();
  }

  // Hoch/Runter am jeweiligen Rand ausgrauen, damit sichtbar ist, was geht.
  function updateSortButtons(container) {
    var items = Array.prototype.slice.call(container.querySelectorAll(".sort-item"));
    items.forEach(function (it, i) {
      var up = it.querySelector("[data-sort-up]"), dn = it.querySelector("[data-sort-down]");
      if (up) up.disabled = (i === 0);
      if (dn) dn.disabled = (i === items.length - 1);
    });
  }

  /* Umsortieren per Ziehen. Gegenüber der ersten Fassung überarbeitet, weil es
   * auf Tablets schlecht lief:
   *  - das gezogene Element folgt jetzt sichtbar dem Finger (vorher bewegte
   *    sich nichts, man sah nur eine Markierung und hielt es für kaputt),
   *  - die Seite scrollt automatisch mit, wenn man an den Bildschirmrand zieht,
   *  - der Ziehgriff ist ein vollwertiges Touch-Ziel (siehe worksheet.css),
   *  - und über die Hoch/Runter-Knöpfe geht alles auch ganz ohne Ziehen. */
  function wireSortList(container) {
    if (!container) return;

    Array.prototype.forEach.call(container.querySelectorAll("[data-sort-up]"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        moveSortItem(btn.closest(".sort-item"), -1);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll("[data-sort-down]"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        moveSortItem(btn.closest(".sort-item"), 1);
      });
    });
    updateSortButtons(container);

    var drag = null;

    function clearHighlights() {
      Array.prototype.forEach.call(container.querySelectorAll(".sort-item"), function (it) {
        it.classList.remove("drag-over-top", "drag-over-bottom");
      });
    }

    function autoScroll(clientY) {
      var rand = 70;
      if (clientY < rand) global.scrollBy(0, -Math.max(6, (rand - clientY) / 3));
      else if (clientY > global.innerHeight - rand) {
        global.scrollBy(0, Math.max(6, (clientY - (global.innerHeight - rand)) / 3));
      }
    }

    Array.prototype.forEach.call(container.querySelectorAll(".sort-item"), function (item) {
      var handle = item.querySelector(".sort-handle");
      if (!handle) return;

      handle.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        drag = { id: e.pointerId, item: item, startY: e.clientY };
        item.classList.add("dragging");
      });

      handle.addEventListener("pointermove", function (e) {
        if (!drag || drag.item !== item || e.pointerId !== drag.id) return;
        e.preventDefault();
        item.style.transform = "translateY(" + (e.clientY - drag.startY) + "px)";
        autoScroll(e.clientY);
        // Das gezogene Element liegt unter dem Finger – für die Trefferabfrage
        // kurz durchlässig schalten, sonst trifft elementFromPoint nur es selbst.
        item.style.pointerEvents = "none";
        var overEl = document.elementFromPoint(e.clientX, e.clientY);
        item.style.pointerEvents = "";
        var overItem = overEl && overEl.closest ? overEl.closest(".sort-item") : null;
        clearHighlights();
        if (overItem && overItem !== item && container.contains(overItem)) {
          var rect = overItem.getBoundingClientRect();
          var before = (e.clientY - rect.top) < rect.height / 2;
          overItem.classList.add(before ? "drag-over-top" : "drag-over-bottom");
          drag.overKey = overItem.dataset.key;
          drag.before = before;
        } else {
          drag.overKey = undefined;
        }
      });

      function finish(e) {
        if (!drag || drag.item !== item || e.pointerId !== drag.id) return;
        item.classList.remove("dragging");
        item.style.transform = "";
        clearHighlights();
        if (drag.overKey !== undefined) {
          var overItem = container.querySelector('.sort-item[data-key="' + drag.overKey + '"]');
          if (overItem && overItem !== item) {
            if (drag.before) container.insertBefore(item, overItem);
            else container.insertBefore(item, overItem.nextSibling);
            updateSortButtons(container);
            scheduleSave();
          }
        }
        drag = null;
      }
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  function checkSortTask(uid) {
    var container = el("wb-" + uid + "-sort");
    if (!container) return;
    var items = Array.prototype.slice.call(container.querySelectorAll(".sort-item"));
    var ok = items.length > 0 && items.every(function (it, i) { return Number(it.dataset.key) === i; });
    setFeedback("wb-" + uid + "-fb", ok, ok ? "Richtig einsortiert." : "Noch nicht in der richtigen Reihenfolge – vertausche zwei Elemente.");
  }

  /* ---------- Vorlagen-Rendering ({{id}} -> Eingabefeld) ---------- */
  function renderTemplate(template, fields, blockId) {
    var byId = {};
    (fields || []).forEach(function (f) { byId[f.id] = f; });
    return String(template || "").replace(/\{\{(\w+)\}\}/g, function (m, id) {
      var f = byId[id];
      if (!f) return m;
      var elId = fieldElId(blockId, id);
      if (f.type === "choice") {
        var opts = (f.options || []).map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>";
        }).join("");
        return '<select class="choice" id="' + elId + '"><option value="">wähle…</option>' + opts + "</select>";
      }
      // Ohne ausdrücklich gesetzte Breite richtet sich das Feld nach der Länge
      // des erwarteten Werts – so muss man die Breite nie von Hand einstellen,
      // ältere Projekte mit explizitem width behalten aber ihren Wert.
      var ersteAlt = String(f.expected == null ? "" : f.expected).split(";")[0].trim();
      var width = f.width || Math.max(64, Math.min(230, ersteAlt.length * 11 + 40));
      return '<input type="text" inputmode="decimal" class="field-input" style="width:' + width + 'px;" id="' + elId + '">' +
        (f.unit ? '<span class="fu-label">' + esc(f.unit) + "</span>" : "");
    });
  }

  // Lösungsblatt-Variante derselben Vorlage: statt leerer Eingabefelder wird
  // der erwartete Wert direkt als hervorgehobener Text eingesetzt (bei
  // Auswahlfeldern das LABEL der richtigen Option, nicht deren technischer
  // Wert – im Schülerblatt sieht man ja auch nur die Labels).
  function renderTemplateSolution(template, fields) {
    var byId = {};
    (fields || []).forEach(function (f) { byId[f.id] = f; });
    return String(template || "").replace(/\{\{(\w+)\}\}/g, function (m, id) {
      var f = byId[id];
      if (!f) return m;
      var txt;
      var erste = acceptedValues(f)[0];
      if (erste === undefined) erste = "";
      if (f.type === "choice") {
        var hit = (f.options || []).filter(function (o) { return String(o.value) === String(erste); })[0];
        txt = hit ? hit.label : String(erste);
      } else {
        // Deutsche Schreibweise: Dezimalkomma und typografisches Minus (U+2212).
        txt = String(erste).replace(".", ",").replace(/^-/, "−");
      }
      return '<span class="field-solution">' + esc(txt) + "</span>" +
        (f.unit ? '<span class="fu-label">' + esc(f.unit) + "</span>" : "");
    });
  }

  /* ---------- PDF-Export: generische, blockweise Paginierung ---------- */
  // A4 in PDF-Punkten (1pt = 1/72 Zoll) sowie die im Export verwendeten Ränder/
  // Abstände – identisch zu den Werten in exportPdf() weiter unten. Wird hier
  // zusätzlich als reine Konstante gehalten, damit der Seitenumbruch-Schätzer
  // (computePageBreakOffsets) ohne jsPDF-Instanz auskommt.
  var PDF_LAYOUT = { marginX: 26, marginY: 26, gap: 10, pageW: 595.28, pageH: 841.89 };

  // Reine, messungsbasierte Nachbildung der Paginierungs-Entscheidungen aus
  // exportPdf() weiter unten (bewusst dupliziert statt geteilt, damit am
  // bereits getesteten PDF-Export nichts verändert wird – bei Änderungen an
  // der Paginierungslogik dort bitte auch hier nachziehen).
  // heights: Array von Höhen (in pt) je Baustein/Zeile; keepFlags: paralleles
  // Array von keepWithNext-Flags; forceFlags: paralleles Array – true heißt
  // „vor diesem Baustein einen Seitenumbruch erzwingen" (Seitenumbruch-
  // Baustein). Gibt eine Liste von Umbruch-Punkten zurück:
  // { itemIndex, offset } – ein Seitenumbruch fällt vor Baustein itemIndex,
  // offset pt von dessen Oberkante entfernt (>0 nur bei überlangen, in
  // mehrere Seiten zerschnittenen Bausteinen).
  function computePagination(heights, keepFlags, forceFlags, layout) {
    layout = layout || PDF_LAYOUT;
    var marginY = layout.marginY, gap = layout.gap;
    var usableH = layout.pageH - 2 * marginY;
    var n = heights.length;
    var breaks = [];
    var cursorY = marginY, isPageEmpty = true;
    for (var i = 0; i < n; i++) {
      var imgH = heights[i];
      if (forceFlags && forceFlags[i] && !isPageEmpty) {
        breaks.push({ itemIndex: i, offset: 0 });
        cursorY = marginY; isPageEmpty = true;
      }
      if (imgH > usableH + 0.5) {
        if (!isPageEmpty) { breaks.push({ itemIndex: i, offset: 0 }); cursorY = marginY; isPageEmpty = true; }
        var renderedH = 0, first = true, lastSliceH = 0;
        while (renderedH < imgH - 0.5) {
          if (!first) breaks.push({ itemIndex: i, offset: renderedH });
          var sliceH = Math.min(usableH, imgH - renderedH);
          renderedH += sliceH; lastSliceH = sliceH; first = false;
        }
        cursorY = marginY + lastSliceH + gap;
        isPageEmpty = false;
        continue;
      }
      var minNeeded = imgH;
      var keepsWithNext = keepFlags[i] && (i + 1 < n) && heights[i + 1] <= usableH + 0.5;
      if (keepsWithNext) minNeeded = imgH + gap + heights[i + 1];
      var fits = isPageEmpty || (cursorY + minNeeded <= marginY + usableH);
      if (!fits && minNeeded > usableH + 0.5) fits = cursorY + imgH <= marginY + usableH;
      if (!fits) { breaks.push({ itemIndex: i, offset: 0 }); cursorY = marginY; isPageEmpty = true; }
      cursorY += imgH + gap; isPageEmpty = false;
    }
    return breaks;
  }

  // Misst die aktuell gerenderten Bausteine/Zeilen im DOM (kein html2canvas –
  // rein getBoundingClientRect) und rechnet ihre On-Screen-Pixelhöhen über
  // einen konstanten Skalierungsfaktor (PDF-nutzbare Breite ÷ On-Screen-
  // Breite) in PDF-Punkte um. Damit lässt sich dieselbe Paginierung wie beim
  // echten Export "live" schätzen, ohne dass gerastert werden muss.
  function computePageBreakOffsets(rootId) {
    var root = el(rootId);
    if (!root) return [];
    var printItems = collectPrintItems(rootId);
    if (!printItems.length) return [];
    var containerRect = root.getBoundingClientRect();
    var onScreenW = containerRect.width;
    if (onScreenW < 1) return [];
    var usableW = PDF_LAYOUT.pageW - 2 * PDF_LAYOUT.marginX;
    var k = usableW / onScreenW; // pt pro On-Screen-Pixel
    var heights = [], keepFlags = [], forceFlags = [], tops = [];
    printItems.forEach(function (it) {
      var r = it.el.getBoundingClientRect();
      heights.push(r.height * k);
      keepFlags.push(it.keepWithNext);
      forceFlags.push(it.forceBreak);
      tops.push(r.top - containerRect.top);
    });
    var breaks = computePagination(heights, keepFlags, forceFlags, PDF_LAYOUT);
    return breaks.map(function (b) {
      return tops[b.itemIndex] + b.offset / k;
    });
  }

  // Blendet gestrichelte Seitenumbruch-Linien (+ "Seite N"-Etikett) direkt in
  // die Live-Vorschau ein, an genau den Y-Positionen, an denen der PDF-Export
  // vermutlich eine neue Seite beginnen würde. Rein informativ (no-print),
  // wird nach jedem Re-Render und bei Resize neu berechnet.
  function renderPageBreakOverlays(rootId) {
    var root = el(rootId);
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll(":scope > .wb-pagebreak-line"), function (n) { n.remove(); });
    var offsets = computePageBreakOffsets(rootId);
    offsets.forEach(function (y, idx) {
      var line = document.createElement("div");
      line.className = "wb-pagebreak-line no-print";
      line.style.top = Math.round(y) + "px";
      line.innerHTML = '<span class="wb-pagebreak-label">✂ Seite ' + (idx + 2) + "</span>";
      root.appendChild(line);
    });
  }

  function collectPrintBlocks(rootId) {
    var root = el(rootId);
    if (!root) return [];
    // .wb-block direkt unter #wbWorksheet = Header-Karte (immer alleine).
    // .wb-row = eine Rasterzeile (1 oder mehrere nebeneinanderstehende
    // Bausteine) – wird als EINE Einheit gerastert, damit nebeneinander
    // platzierte Bausteine auch im PDF nebeneinander erscheinen.
    return Array.prototype.slice.call(root.querySelectorAll(":scope > .wb-block, :scope > .wb-row"));
  }

  // Wandelt die rohen Druckeinheiten in die tatsächlich zu rasternde Liste um.
  // Eine Zeile, die nur den Seitenumbruch-Baustein enthält (data-force-break),
  // wird selbst NICHT gerastert – sie setzt stattdessen das forceBreak-Flag
  // der nachfolgenden Einheit, vor der dann eine neue Seite beginnt.
  function collectPrintItems(rootId) {
    var out = [];
    var pendingBreak = false;
    collectPrintBlocks(rootId).forEach(function (elm) {
      if (elm.dataset.forceBreak === "true") { pendingBreak = true; return; }
      out.push({ el: elm, keepWithNext: elm.dataset.keepWithNext === "true", forceBreak: pendingBreak });
      pendingBreak = false;
    });
    return out;
  }

  function addSlicedImage(pdf, canvas, x, marginY, imgW, usableH, pageH) {
    var totalImgH = (canvas.height * imgW) / canvas.width;
    var pxPerPt = canvas.height / totalImgH;
    var renderedH = 0, first = true, lastSliceH = 0;
    while (renderedH < totalImgH - 0.5) {
      if (!first) pdf.addPage();
      var availH = first ? usableH : (pageH - 2 * marginY);
      var sliceH = Math.min(availH, totalImgH - renderedH);
      var srcY = Math.round(renderedH * pxPerPt);
      var srcH = Math.round(sliceH * pxPerPt);
      var sliceCanvas = document.createElement("canvas");
      sliceCanvas.width = canvas.width; sliceCanvas.height = srcH;
      sliceCanvas.getContext("2d").drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
      pdf.addImage(sliceCanvas.toDataURL("image/jpeg", 0.92), "JPEG", x, marginY, imgW, sliceH);
      renderedH += sliceH; lastSliceH = sliceH; first = false;
    }
    return lastSliceH;
  }

  async function offerDownload(blob, filename) {
    if (global.claude && typeof global.claude.use === "function") {
      try {
        var downloads = await global.claude.use("downloads");
        if (downloads) {
          await downloads.save({ filename: filename, data: blob });
          showToast("PDF gespeichert.");
          return;
        }
      } catch (err) {
        showToast("Speichern hier nicht möglich. Nutze die eigenständige Datei, um zu speichern.");
        return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    showToast("PDF wird heruntergeladen.");
  }

  // Baut das PDF und gibt es als Blob zurück, OHNE es herunterzuladen.
  // Getrennt von exportPdf(), damit auch der Baukasten selbst ein PDF
  // erzeugen kann (er rendert das Arbeitsblatt in ein verstecktes iframe und
  // holt sich den Blob hier ab, um ihn über seinen eigenen Download-Pfad zu
  // speichern – nur der kennt die claude.use("downloads")-Fähigkeit).
  // Versionen wie die eingebetteten Kopien – bei einem Austausch hier mitziehen.
  var PDF_CDN = [
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
  ];

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("Konnte " + src + " nicht laden")); };
      document.head.appendChild(s);
    });
  }

  /* jsPDF und html2canvas werden erst beim ersten PDF-Export bereitgestellt –
   * nie beim bloßen Öffnen des Arbeitsblatts. Zwei Wege, je nach Exportfassung:
   *  - vollständige Fassung: die Bibliotheken liegen als text/plain-Halter im
   *    Dokument und werden hier ausgewertet. Funktioniert ohne Internet.
   *  - schlanke Fassung: die Halter fehlen (Datei ~150 statt ~700 KB), die
   *    Bibliotheken kommen beim ersten Klick aus dem Netz.
   * In beiden Fällen bleibt der PDF-Knopf für die Schüler erhalten. */
  async function ensurePdfLibs() {
    if (global.jspdf && global.html2canvas) return;
    ["src-jspdf", "src-html2canvas"].forEach(function (id) {
      var holder = el(id);
      if (!holder) return;
      try { (0, eval)(holder.textContent); } catch (err) { console.error("Lade " + id + ":", err); }
    });
    if (global.jspdf && global.html2canvas) return;
    for (var i = 0; i < PDF_CDN.length; i++) await loadScript(PDF_CDN[i]);
  }

  async function buildPdfBlob(rootId) {
    await ensurePdfLibs();
    if (!global.jspdf || !global.html2canvas) throw new Error("PDF-LIBS");
    document.body.classList.add("exporting");
    await new Promise(function (r) { setTimeout(r, 60); });
    try {
      var jsPDF = global.jspdf.jsPDF;
      var pdf = new jsPDF("p", "pt", "a4");
      var marginX = 26, marginY = 26, gap = 10;
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var usableW = pageW - marginX * 2;
      var usableH = pageH - marginY * 2;
      var scale = Math.min(2, global.devicePixelRatio || 1.5);

      var printItems = collectPrintItems(rootId);
      var items = [];
      for (var j = 0; j < printItems.length; j++) {
        var c = await global.html2canvas(printItems[j].el, { scale: scale, backgroundColor: getCssVar("--paper"), useCORS: true });
        items.push({
          canvas: c,
          imgH: (c.height * usableW) / c.width,
          keepWithNext: printItems[j].keepWithNext,
          forceBreak: printItems[j].forceBreak
        });
      }

      var cursorY = marginY, isPageEmpty = true;
      for (var i = 0; i < items.length; i++) {
        var imgH = items[i].imgH, imgW = usableW;
        if (items[i].forceBreak && !isPageEmpty) { pdf.addPage(); cursorY = marginY; isPageEmpty = true; }
        if (imgH > usableH + 0.5) {
          if (!isPageEmpty) { pdf.addPage(); cursorY = marginY; }
          var lastSliceH = addSlicedImage(pdf, items[i].canvas, marginX, marginY, imgW, usableH, pageH);
          cursorY = marginY + lastSliceH + gap; isPageEmpty = false;
          continue;
        }
        var minNeeded = imgH;
        var keepsWithNext = items[i].keepWithNext && (i + 1 < items.length) && items[i + 1].imgH <= usableH + 0.5;
        if (keepsWithNext) minNeeded = imgH + gap + items[i + 1].imgH;
        var fits = isPageEmpty || (cursorY + minNeeded <= marginY + usableH);
        if (!fits && minNeeded > usableH + 0.5) fits = cursorY + imgH <= marginY + usableH;
        if (!fits) { pdf.addPage(); cursorY = marginY; isPageEmpty = true; }
        var imgData = items[i].canvas.toDataURL("image/jpeg", 0.92);
        pdf.addImage(imgData, "JPEG", marginX, cursorY, imgW, imgH);
        cursorY += imgH + gap; isPageEmpty = false;
      }

      return pdf.output("blob");
    } finally {
      document.body.classList.remove("exporting");
    }
  }

  async function exportPdf(rootId, filename, exportBtnId) {
    var btn = exportBtnId ? el(exportBtnId) : null;
    if (btn) btn.disabled = true;
    showToast("Erstelle PDF …");
    try {
      var blob = await buildPdfBlob(rootId);
      await offerDownload(blob, filename || "arbeitsblatt.pdf");
    } catch (err) {
      console.error(err);
      // In der schlanken Fassung kommen die PDF-Bibliotheken aus dem Netz –
      // ohne Verbindung soll die Meldung sagen, woran es liegt.
      var netz = /PDF-LIBS|nicht laden/.test(String(err && err.message));
      showToast(netz
        ? "Für den PDF-Export wird einmalig eine Internetverbindung gebraucht."
        : "PDF-Export ist fehlgeschlagen.");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  global.WBEngine = {
    el: el, esc: esc, getCssVar: getCssVar, debounce: debounce,
    parseNum: parseNum, numEq: numEq, formatEuro: formatEuro, formatDE: formatDE,
    showToast: showToast, redrawCallbacks: redrawCallbacks,
    createDrawPad: createDrawPad, wireDrawpad: wireDrawpad,
    drawGrowthGraph: drawGrowthGraph, drawDiagram: drawDiagram,
    compileExpr: compileExpr, drawCoordinatePlane: drawCoordinatePlane,
    setFeedback: setFeedback, wireHintButton: wireHintButton, wireRevealButton: wireRevealButton,
    fieldElId: fieldElId, checkFieldsTask: checkFieldsTask, renderTemplate: renderTemplate,
    answerMatches: answerMatches, acceptedValues: acceptedValues,
    renderTemplateSolution: renderTemplateSolution,
    seededShuffle: seededShuffle, wireSortList: wireSortList, checkSortTask: checkSortTask,
    moveSortItem: moveSortItem, wireAutosave: wireAutosave,
    offerDownload: offerDownload, exportPdf: exportPdf, buildPdfBlob: buildPdfBlob,
    ensurePdfLibs: ensurePdfLibs,
    computePagination: computePagination, computePageBreakOffsets: computePageBreakOffsets,
    renderPageBreakOverlays: renderPageBreakOverlays, PDF_LAYOUT: PDF_LAYOUT
  };
})(window);
</script>
<script>/*
 * Baukasten – Baustein-Registry + Gesamt-Renderer
 * Jeder Baustein-Typ ist EIN Eintrag hier. Ein neuer Typ = ein neuer Eintrag
 * mit render()/editor()/mount() – der Rest der Anwendung (Palette, Vorschau,
 * Export, Drag&Drop) funktioniert automatisch mit, ohne Änderungen anderswo.
 */
(function (global) {
  "use strict";
  var E = global.WBEngine;

  function esc(s) { return E.esc(s); }

  function autoParagraph(html) {
    var s = String(html == null ? "" : html).trim();
    if (s === "") return "";
    if (/<(p|div|ul|ol|table|h[1-6])[\s>]/i.test(s)) return s;
    return s.split(/\n\s*\n/).map(function (chunk) {
      return "<p>" + chunk.trim().replace(/\n/g, "<br>") + "</p>";
    }).join("\n");
  }

  function variantClass(variant) {
    return variant === "exp" ? "swatch-exp" : (variant === "linear" ? "swatch-linear" : "");
  }

  function starsHtml(stars) {
    stars = Math.max(1, Math.min(3, Number(stars) || 1));
    var filled = "★".repeat(stars), empty = "☆".repeat(3 - stars);
    return '<span class="difficulty-stars" title="Schwierigkeit ' + stars + ' von 3">' +
      '<span class="filled">' + filled + "</span>" +
      (empty ? '<span class="empty">' + empty + "</span>" : "") + "</span>";
  }

  function uniqueId(prefix) {
    return prefix + "_" + Math.random().toString(36).slice(2, 9);
  }

  // Farbpalette für Funktionsgraphen im Koordinatensystem – feste Namen,
  // die auf vorhandene Theme-Variablen zeigen (passen sich automatisch an
  // Hell/Dunkel an).
  var COORD_COLORS = [
    { value: "primary", label: "Blau", cssVar: "--accent-primary" },
    { value: "linear", label: "Türkis", cssVar: "--accent-linear" },
    { value: "exp", label: "Orange", cssVar: "--accent-exp" },

  // Liest eine Bilddatei ein, verkleinert sie client-seitig auf eine sinnvolle
  // maximale Kantenlänge und liefert sie als eingebettete data-URL zurück –
  // damit Fotos aus dem Handy die exportierte Datei nicht unnötig aufblähen.
  // SVGs werden unverändert (als Vektor) eingebettet.
  function readImageFile(file, callback) {
    if (file.type === "image/svg+xml") {
      var r = new FileReader();
      r.onload = function () { callback(null, String(r.result)); };
      r.onerror = function () { callback(new Error("Datei konnte nicht gelesen werden.")); };
      r.readAsDataURL(file);
      return;
    }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var maxDim = 1400;
      var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var isPng = file.type === "image/png";
      var dataUrl = isPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85);
      callback(null, dataUrl);
    };
    img.onerror = function () { URL.revokeObjectURL(url); callback(new Error("Bild konnte nicht geladen werden.")); };
    img.src = url;
  }

  // Mathe-Symbole direkt einfügen: eine kompakte Leiste anklickbarer Zeichen
  // unter einem Text-/Textarea-Feld, die an der aktuellen Cursorposition
  // einfügen (statt Sonderzeichen-Tastatur/Copy-Paste). NICHT an geparsten/
  // technischen Feldern verwenden (z. B. Funktionsterm im Koordinatensystem –
  // der Parser erwartet "pi"/"sqrt(x)", kein π/√; numerische erwartete Werte).
  var MATH_SYMBOLS = [
    "²", "³", "√", "π", "±", "×", "÷", "≈", "≠", "≤", "≥",
    "∞", "°", "∠", "△", "⊥", "∥", "→", "⇒", "∈", "∅", "Σ", "·", "‰", "½", "¼"
  ];
  function insertAtCursor(el, text) {
    el.focus();
    var start = el.selectionStart != null ? el.selectionStart : el.value.length;
    var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    var val = el.value;
    el.value = val.slice(0, start) + text + val.slice(end);
    var pos = start + text.length;
    if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function mkSymbolToolbar(targetEl) {
    var bar = document.createElement("div");
    bar.className = "ed-symbol-bar";
    MATH_SYMBOLS.forEach(function (sym) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "ed-symbol-btn"; b.textContent = sym;
      b.title = "„" + sym + "“ einfügen";
      b.addEventListener("click", function (e) {
        e.preventDefault();

      });
      bar.appendChild(b);

    return bar;
  }
  // Umschließt ein von textInput()/textArea() erzeugtes Feld mit der
  // Symbol-Leiste. Gibt einen Container zurück, der sich genau wie das
  // ursprüngliche Element in field(...) einsetzen lässt.
  // Kurze, sprechende id für eine neue Lücke: erst a, b, c … dann f1, f2 …
  // (der Nutzer soll ids nie selbst tippen müssen – der „Lücke einfügen“-
  // Knopf im Aufgaben-Editor legt Platzhalter und Feld gemeinsam an).
  function nextFieldId(fields) {
    var used = {};
    (fields || []).forEach(function (f) { used[f.id] = true; });
    var alpha = "abcdefghijklmnopqrstuvwxyz";
    for (var i = 0; i < alpha.length; i++) { if (!used[alpha[i]]) return alpha[i]; }
    var n = 1;
    while (used["f" + n]) n++;
    return "f" + n;
  }

    var wrap = document.createElement("div");

  }

  function listEditor(items, opts) {

    var wrap = document.createElement("div");
    wrap.className = "ed-list";
    function redraw() {
      wrap.innerHTML = "";
      items.forEach(function (item, i) {
        var row = document.createElement("div");
        row.className = "ed-list-row";
        row.appendChild(opts.renderRow(item, i,
          function (partial) { Object.assign(item, partial); opts.onChange(items); },
          function () { items.splice(i, 1); opts.onChange(items); redraw(); }
        ));
        wrap.appendChild(row);
      });
      var addBtn = document.createElement("button");
      addBtn.type = "button"; addBtn.className = "btn btn-sm btn-ghost";
      addBtn.textContent = "+ " + (opts.addLabel || "Hinzufügen");
      addBtn.addEventListener("click", function () {
        items.push(opts.newItem());
        opts.onChange(items);
        redraw();
      });
      wrap.appendChild(addBtn);
    }
    redraw();
    return wrap;
  }

      render: function (c, uid, ctx) {
        var numLabel = c.knobel ? "★" : String((ctx && ctx.taskNumber) || "?");
        var out = '<div class="task-head"><div class="task-num' + (c.knobel ? " knobel" : "") + '">' + numLabel + "</div>" +
          '<div class="task-prompt">' + autoParagraph(c.prompt).replace(/^<p>|<\/p>\s*$/g, "") + "</div>" +
          starsHtml(c.stars) + "</div>";

        // Lösungsblatt: keine leeren Felder, keine Prüf-/Tipp-Knöpfe – die
        // erwarteten Werte stehen direkt im Text, Tipps und Musterlösung sind
        // von Anfang an aufgeklappt.
        if (ctx && ctx.solution) {
          if (c.drawpad) {
            out += '<div class="drawpad-wrap"><div class="drawpad-toolbar no-print"></div><canvas class="drawpad-canvas" id="wb-' + uid + '-pad" style="height:' + (c.drawpadHeight || 220) + 'px;"></canvas></div>';
          }
          if (c.fields && c.fields.length && c.template) {
            out += '<div class="answer-row"><div class="answer-template">' +
              E.renderTemplateSolution(c.template, c.fields) + "</div></div>";
          }
          if (c.hints && c.hints.length) {
            out += '<div class="hint-area open"><strong>Tipps:</strong><ol class="solution-hints">' +
              c.hints.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ol></div>";
          }
          if (c.solution) {
            out += '<div class="solution-area open"><strong>Musterlösung:</strong>' + autoParagraph(c.solution) + "</div>";
          }
          return out;
        }

        if (c.drawpad) {
          out += '<div class="drawpad-wrap"><div class="drawpad-toolbar no-print"></div><canvas class="drawpad-canvas" id="wb-' + uid + '-pad" style="height:' + (c.drawpadHeight || 220) + 'px;"></canvas></div>';
        }
        if (c.fields && c.fields.length) {
          // Vorlage in einem eigenen Block-Container: .answer-row ist ein
          // Flex-Container, in dem jeder Textschnipsel und jedes <br> zu einem
          // eigenen Flex-Element würde – mehrzeilige Vorlagen wurden dadurch
          // zerrissen. Im Block-Container fließt der Text normal, die Knöpfe

            E.renderTemplate(c.template, c.fields, uid) + "</div>" +
            '<button class="btn btn-sm no-print" data-wb-check="' + uid + '" type="button">Prüfen</button>';
          if (c.hints && c.hints.length) out += '<button class="btn btn-ghost btn-sm no-print" data-wb-hint="' + uid + '" type="button">Tipp</button>';
          out += "</div>";
          out += '<div class="feedback" id="wb-' + uid + '-fb"></div>';
          if (c.hints && c.hints.length) out += '<div class="hint-area" id="wb-' + uid + '-hint"></div>';
        }
        if (c.solution) {
          out += '<div class="answer-row no-print"><button class="btn btn-ghost btn-sm" data-wb-reveal="' + uid + '" type="button">Musterlösung anzeigen</button></div>';
          out += '<div class="solution-area" id="wb-' + uid + '-sol">' + autoParagraph(c.solution) + "</div>";

        }

        }

        // Vorlage + „Lücke einfügen“: der Knopf setzt den Platzhalter an der
        // Cursorposition UND legt das passende geprüfte Feld gleich mit an –
        // ids muss man dadurch nie von Hand verknüpfen.
        var tplArea = textArea(c.template, function (v) { api.update({ template: v }); updateWarn(); }, 2);
        var tplWrap = document.createElement("div");
        tplWrap.appendChild(withSymbols(tplArea));

        gapBtn.addEventListener("click", function () {
          var id = nextFieldId(c.fields);
          var newFields = (c.fields || []).concat([{ id: id, type: "number", unit: "", expected: 0, options: [] }]);
          insertAtCursor(tplArea, "{{" + id + "}}"); // löst den onChange der Vorlage aus
          api.update({ fields: newFields });
          api.refresh();
        });
        tplWrap.appendChild(gapBtn);
        d.appendChild(field("Vorlage mit Lücken – {{id}} wird durch das passende Feld ersetzt, z. B.: A(5) = {{a}} (die Einheit gehört ins Feld, nicht in die Vorlage)", tplWrap));

        // Warnzeile: meldet Platzhalter ohne Feld und Felder ohne Platzhalter –
        // die häufigste stille Fehlerquelle beim Bauen von Aufgaben.
        var warn = document.createElement("div");
        warn.className = "ed-warn";
        function updateWarn() {
          var tpl = String(c.template || "");
          var used = [];
          tpl.replace(/\{\{(\w+)\}\}/g, function (m, id) { used.push(id); return m; });
          var defined = (c.fields || []).map(function (f) { return f.id; });
          var missing = used.filter(function (id) { return defined.indexOf(id) === -1; });
          var unused = defined.filter(function (id) { return used.indexOf(id) === -1; });
          var msgs = [];
          if (missing.length) msgs.push("Zu {{" + missing.join("}}, {{") + "}} gibt es kein Feld – die Lücke bleibt als Text stehen.");
          if (unused.length) msgs.push("Feld „" + unused.join("“, „") + "“ kommt in der Vorlage nicht vor und wird nicht angezeigt.");
          if (!tpl.trim() && defined.length) msgs.push("Es gibt Felder, aber keine Vorlage – ohne Vorlagentext erscheint nichts.");
          warn.innerHTML = msgs.map(function (m) { return "⚠ " + esc(m); }).join("<br>");
          warn.style.display = msgs.length ? "block" : "none";
        }
        d.appendChild(warn);

        var fieldsWrap = document.createElement("div");
        fieldsWrap.appendChild(document.createTextNode("Geprüfte Felder (verknüpft über die id mit der Vorlage oben):"));

        fieldsWrap.appendChild(altHinweis);
        fieldsWrap.appendChild(listEditor(c.fields, {
          addLabel: "Feld hinzufügen",

        }));
        d.appendChild(hintsWrap);

        d.appendChild(field("Musterlösung (optional, einblendbar; leer lassen = keine Musterlösung)",
          withSymbols(textArea(c.solution, function (v) { api.update({ solution: v }); }, 3))));
        updateWarn();

      }
    },

    sortTask: {
      label: "Sortier-Aufgabe", icon: "🔀", group: "aufgabe",
      defaultConfig: function () {
        return {
          prompt: "Bringe die Elemente in die richtige Reihenfolge.",
          stars: 1, knobel: false,
          items: ["Erster Schritt", "Zweiter Schritt", "Dritter Schritt", "Vierter Schritt"]
        };
      },
      render: function (c, uid, ctx) {
        var numLabel = c.knobel ? "★" : String((ctx && ctx.taskNumber) || "?");
        var items = (c.items || []).map(function (text, i) { return { key: i, text: text }; });
        var head = '<div class="task-head"><div class="task-num' + (c.knobel ? " knobel" : "") + '">' + numLabel + "</div>" +
          '<div class="task-prompt">' + autoParagraph(c.prompt).replace(/^<p>|<\/p>\s*$/g, "") + "</div>" +
          starsHtml(c.stars) + "</div>";

        // Lösungsblatt: korrekte Reihenfolge, durchnummeriert, ohne Ziehgriffe
        // und ohne Prüf-Knopf.
        if (ctx && ctx.solution) {
          var solHtml = items.map(function (it, i) {

          }).join("");

        var shuffled = E.seededShuffle(items, uid);
        var itemsHtml = shuffled.map(function (it) {
          return '<div class="sort-item" data-key="' + it.key + '">' +
            '<span class="sort-handle no-print" aria-label="Ziehen zum Umsortieren">⠿</span>' +
            '<span class="sort-text">' + esc(it.text) + "</span>" +
            '<span class="sort-moves no-print">' +
            '<button type="button" class="sort-move" data-sort-up aria-label="Nach oben">▲</button>' +
            '<button type="button" class="sort-move" data-sort-down aria-label="Nach unten">▼</button>' +

        }).join("");
        return head +
          '<div class="sort-list" id="wb-' + uid + '-sort">' + itemsHtml + "</div>" +
          '<div class="answer-row no-print"><button class="btn btn-sm no-print" data-wb-sortcheck="' + uid + '" type="button">Prüfen</button></div>' +

      },

      editor: function (c, api) {

        var itemsWrap = document.createElement("div");
        itemsWrap.appendChild(document.createTextNode("Elemente in der KORREKTEN Reihenfolge (wird den Schülern gemischt angezeigt):"));
        itemsWrap.appendChild(listEditor(c.items.map(function (t) { return { text: t }; }), {
          addLabel: "Element hinzufügen",
          newItem: function () { return { text: "Neues Element" }; },
          onChange: function (items) { api.update({ items: items.map(function (it) { return it.text; }) }); },
          renderRow: function (it, i, update, remove) {
            var g = document.createElement("div"); g.className = "ed-row-grid-1";
            g.appendChild(withSymbols(textInput(it.text, function (v) { update({ text: v }); }, "Text")));
            var rm = document.createElement("button"); rm.type = "button"; rm.className = "btn btn-sm btn-ghost"; rm.textContent = "🗑";
            rm.addEventListener("click", remove);
